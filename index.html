EX[1] = {n:1, niva:1, titel:"Hur känns det inuti?", omr:"kanslor", tagline:"3–5 år · Känslor är inte farliga",
  ingress:"Övning för förskolan om fyra grundkänslor och hur de kan kännas i kroppen.",
  syfte:["Barnen får ord och bilder för fyra grundkänslor (glad, ledsen, arg och rädd) och upptäcker att känslor kan kännas på olika ställen i kroppen. De får höra att alla känslor får finnas, men att vi väljer vad vi gör med kroppen."],
  intro:"Övningen leds helt av pedagogen. Använd gärna en handdocka eller ett gosedjur som får ”känna” i stället för barnen. Håll tempot lugnt och låt barnen svara med kroppen, ljud eller genom att peka. Ingen behöver prata.",
  material:["Skärm eller projektor för klassrumsläget.","Valfritt: en handdocka eller ett gosedjur.","Inget annat behövs."],
  steg:[
    {t:"Välkommen", min:1, slide:0, gor:"Sätt dig i barnens höjd. Låt handdockan vinka.", manus:["Hej allihop! Idag ska vi prata om hur det känns inuti oss.","Inuti oss bor känslor. Vi ska titta på några känslor tillsammans."]},
    {t:"Glad och ledsen", min:3, slide:1, slideTo:2, gor:"Låt barnen visa med ansiktet och kroppen. De som inte vill får titta.", manus:["Här är glad. Kan du visa med ansiktet hur en glad person ser ut? Bra!","Här är ledsen. Kan du visa hur en ledsen person ser ut? Ja, så kan det se ut.","Både glad och ledsen får finnas. Ingen känsla är fel."]},
    {t:"Arg och rädd", min:3, slide:3, slideTo:4, gor:"Rörelsen är frivillig. Avsluta alltid med att skaka loss, så att kroppen får vila.", manus:["Här är arg. Kan du visa en arg kropp? Spänn armarna och gör knytnävar. Titta, så kan en arg kropp se ut.","Nu skakar vi loss händerna.","Här är rädd. Hur ser en rädd person ut? Ja, ögonen blir stora.","Arg och rädd får också finnas.","Ibland vill kroppen slåss, springa iväg eller bli alldeles stilla. Det händer av sig självt."]},
    {t:"Var känns det i kroppen?", min:3, slide:5, gor:"Låt barnen peka på sin egen kropp. Ge svar utan att rätta.", manus:["Känslor bor inte bara i huvudet. De kan kännas i kroppen.","Många känner glad som pirr i magen. Många känner rädd som att hjärtat slår fort. Många känner arg i händerna.","Men det kan kännas olika för olika personer. Var känns glad hos dig? Peka om du vill."]},
    {t:"Alla känslor får finnas", min:2, slide:6, manus:["Alla känslor får finnas. Du får bli arg. Du får bli ledsen. Du får bli rädd.","Men vi slår inte och vi gör inte andra illa. Vi kan säga: ”Jag är arg!” eller ”Jag är ledsen!”","Vi kan alltid gå till en trygg vuxen och säga att det känns svårt."]},
    {t:"Avslut", min:1, slide:7, manus:["Nu har vi tittat på glad, ledsen, arg och rädd. Vilken känsla vill du visa en sista gång?","Bra jobbat, allihop! Om ni vill tar vi ett stort andetag och sträcker upp armarna. Tack!"]}
  ],
  exempel:[["Mimmi tappar sin glass","Handdockan Mimmi tappar sin glass på marken."],["Mimmi möter sin kompis","Mimmi får syn på sin bästa kompis och springer fram."],["Någon tar Mimmis leksak","Mimmi leker, och en annan docka tar leksaken utan att fråga."]],
  fragor:["Vilken känsla tror du att Mimmi har?","Var känns glad i kroppen?","Vem kan man gå till när det känns svårt?"],
  anpassningar:[["Tecken och bilder","Använd gärna tecken som stöd (TAKK) eller bildkort. Barn som inte talar kan peka på bilderna."],["Mindre grupp","Dela barngruppen i två om den är stor."],["Rörelse","Rörelserna är frivilliga. Barn kan titta på eller göra en mindre rörelse."],["Korta stunder","Dela övningen i två tillfällen om barnen blir rastlösa: glad och ledsen först, arg och rädd senare."]],
  trygghet:["Alla får vara med, men ingen tvingas. Om något väcker starka känslor hos ett barn eller en elev: låt hen pausa, sitta nära en trygg vuxen eller lämna övningen i lugn och ro utan att behöva förklara sig, och prata gärna med hen efteråt.","Betona respekt för olika åsikter och synsätt, så att ingen blir utskämd. Stoppa kommentarer som skämmer ut någon, och påminn om att allt handlar om påhittade personer.","Inget barn behöver berätta något om sig själv.","Låt barn som blir ledsna eller oroliga sitta nära en trygg vuxen eller lämna samlingen.","Om ett barn berättar något som väcker oro: följ förskolans rutiner och kontakta ansvarig, till exempel rektor eller elevhälsa.","Övningen är inte terapi."],
  avslut:"Avsluta alltid med att alla känslor får finnas och att man kan gå till en trygg vuxen.",
  slides:[
    `<div class="slide"><h2 class="big">Hur känns det inuti?</h2><div class="faces">${["glad","ledsen","arg","radd"].map(faceCard).join("")}</div></div>`,
    faceSlide("glad","Glad kan kännas varmt och pirrigt."),
    faceSlide("ledsen","Ledsen kan kännas tungt."),
    faceSlide("arg","Arg kan kännas hett och spänt."),
    faceSlide("radd","Rädd kan kännas som att hjärtat slår fort."),
    `<div class="slide"><div class="body-slide"><div><h2>Var känns det?</h2><p class="note">Känslor kan kännas i kroppen. Det kan kännas olika för olika personer.</p></div><div>${BODY_ENKEL}</div></div></div>`,
    `<div class="slide"><h2 class="big">Alla känslor får finnas.</h2><p>Vi väljer vad vi gör med kroppen.</p></div>`,
    `<div class="slide"><h2 class="big">Bra jobbat!</h2><div class="faces">${["glad","ledsen","arg","radd"].map(faceCard).join("")}</div></div>`
  ]};

EX[4] = {n:4, niva:2, titel:"Alla känslor får finnas.", omr:"kanslor", tagline:"6–8 år · Känslor är inte farliga",
  ingress:"Övning för förskoleklass till årskurs 2 om känsloord och skillnaden mellan att känna och att göra.",
  syfte:["Eleverna får fler ord för känslor och upptäcker att flera känslor kan finnas samtidigt. De får se skillnaden mellan en känsla, som alltid är okej, och en handling, som vi väljer."],
  intro:"Övningen använder bildkort och en kort berättelse om den påhittade personen Lo. Eleverna får peka och rösta med handen, men ingen behöver berätta något om sig själv.",
  material:["Skärm eller projektor för klassrumsläget.","Valfritt: papper och pennor om eleverna vill rita en känsla."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag ska vi prata om känslor. Alla människor har känslor, även jag.","Vi ska lära oss fler ord för känslor och prata om skillnaden mellan att känna och att göra."]},
    {t:"Känsloord", min:4, slide:1, gor:"Låt eleverna peka på skärmen eller på sin bänk. Skriv upp nya ord som eleverna kommer med.", manus:["Här ser ni sex känslor: glad, ledsen, arg, rädd, besviken och stolt.","Titta en stund. Vilken känsla känner du igen? Peka på en. Du behöver inte säga varför.","Det finns många fler känsloord. Kan någon komma på ett till? Om du inte hittar ordet kan du visa med ansiktet."]},
    {t:"Berättelsen om Lo", min:4, slide:2, gor:"Läs långsamt. Låt eleverna rösta för flera känslor. Rätta inte.", manus:["Nu ska jag berätta om Lo. Lo har ritat en teckning länge, länge. Sen kommer en kompis och råkar spilla vatten på den. Teckningen blir blöt.","Hur kan Lo känna? Räck upp handen för den känsla du tror att Lo har.","Titta, flera tror olika. Det är okej, för flera känslor kan finnas samtidigt. Lo kan vara både arg och ledsen."]},
    {t:"Känsla eller handling", min:4, slide:3, manus:["Lo är arg. Arg är en känsla. Känslor får alltid finnas.","Men sen kommer en fråga: vad gör Lo? Det är en handling, och handlingar väljer vi.","Kan Lo slå kompisen? Nej, det är inte okej. Kan Lo säga: ”Nu blev jag arg, du spillde på min teckning”? Ja, det är okej!","När man är arg kan kroppen vilja slå, springa iväg eller bli alldeles stilla. Det händer av sig självt.","Känslan kommer av sig själv. Det vi gör, det väljer vi."]},
    {t:"Avslut", min:2, slide:4, manus:["Idag har vi lärt oss många känsloord, och att alla känslor får finnas.","Vi väljer vad vi gör. Ibland kan vi ta en paus, säga vad vi känner eller be en vuxen om hjälp.","Vill du rita en känsla? Det får du göra. Eller så får du sitta och vila."]}
  ],
  exempel:[["Lo och teckningen","Lo ritar en teckning som blir blöt när en kompis spiller vatten."],["Ali i leken","Ali får inte vara med i en lek på rasten."],["Maja och bollen","Maja missar bollen i en lek och alla ser på."]],
  fragor:["Vilken känsla känner du igen?","Vad kan Lo göra när hen är arg?","Vem kan man be om hjälp?"],
  anpassningar:[["Bildstöd","Låt eleverna peka på känslokorten i stället för att säga ord."],["Mindre grupper","Dela klassen i halvgrupper vid behov."],["Rörelse","Eleverna kan ställa sig upp och visa känslan med kroppen, om de vill."],["Språk","Skriv upp nya känsloord på tavlan och visa med ansiktet."]],
  trygghet:["Alla får vara med, men ingen tvingas. Om något väcker starka känslor hos ett barn eller en elev: låt hen pausa, sitta nära en trygg vuxen eller lämna övningen i lugn och ro utan att behöva förklara sig, och prata gärna med hen efteråt.","Betona respekt för olika åsikter och synsätt, så att ingen blir utskämd. Stoppa kommentarer som skämmer ut någon, och påminn om att allt handlar om påhittade personer.","Ingen elev behöver berätta något om sig själv.","Låt elever som blir ledsna eller oroliga sitta nära en trygg vuxen eller ta en paus.","Om en elev berättar något som väcker oro: följ skolans rutiner och kontakta elevhälsan.","Övningen är inte terapi."],
  avslut:"Avsluta alltid med att alla känslor får finnas, att vi väljer vad vi gör, och att man kan be en vuxen om hjälp.",
  slides:[
    `<div class="slide"><h2 class="big">Alla känslor får finnas.</h2><div class="faces">${["glad","ledsen","arg"].map(faceCard).join("")}</div></div>`,
    `<div class="slide"><h2>Vilken känsla känner du igen?</h2><div class="facegrid">${["glad","ledsen","arg","radd","besviken","stolt"].map(faceCard).join("")}</div></div>`,
    `<div class="slide"><h2>Lo och teckningen</h2><p>Lo har ritat en teckning länge. En kompis råkar spilla vatten på den.</p><p>Hur kan Lo känna?</p><div class="faces small">${["arg","ledsen","besviken"].map(faceCard).join("")}</div></div>`,
    `<div class="slide"><h2>Känsla eller handling?</h2><div class="two"><div class="panel a"><h3>Känslan</h3><p>Lo är arg.</p><p>Känslor får alltid finnas.</p></div><div class="panel b"><h3>Handlingen</h3><p>Det här väljer vi.</p><p>Att slå är inte okej. Att säga vad man känner är okej.</p></div></div></div>`,
    `<div class="slide"><h2 class="big">Vi väljer vad vi gör.</h2><p>Vi kan ta en paus, säga vad vi känner eller be en vuxen om hjälp.</p><p class="tagline">Du får också rita en känsla, eller sitta och vila.</p></div>`
  ]};

EX[7] = {n:7, niva:3, titel:"Vad händer när jag blir arg?", omr:"nervsystem", tagline:"9–10 år · Lär känna ditt nervsystem",
  ingress:"Övning för årskurs 3–4 om kroppens signaler och skillnaden mellan känslor och handlingar.",
  syfte:["Eleverna får se att en känsla som ilska följer med signaler i kroppen, och att det är skillnad på att känna och att göra. De får öva på att tänka på sätt att hjälpa kroppen att landa innan de väljer vad de gör.","Övningen hör till huvudområdet Lär känna ditt nervsystem och bygger på stegen Uppmärksamma, Sätt ord på det och Förstå i modellen i sex steg."],
  intro:"Övningen utgår från en påhittad person så att ingen elev behöver berätta om egna upplevelser. Du behöver inte ge några rätta svar. Målet är att eleverna får ord och bilder för det som händer, inte att de ska analysera sig själva.",
  material:["Skärm eller projektor för klassrumsläget.","Valfritt: papper och pennor om eleverna vill rita eller skriva om Sam.","Inga personuppgifter eller tester behövs."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om vad som händer i kroppen när man blir arg, och om hur vi kan välja vad vi gör.","Vi utgår från en påhittad person som heter Sam. Ingen behöver berätta något om sig själv. Kom ihåg att vi tycker och tänker olika, och att vi visar respekt för det så att ingen blir utskämd."]},
    {t:"Berättelsen om Sam", min:3, slide:1, gor:"Ta emot några korta svar. Peka inte ut vad någon själv har upplevt.", manus:["Lyssna på berättelsen om Sam. Sam har väntat på bollen hela rasten. Då tar någon bollen utan att fråga.","Vad hände? Vad kan Sam känna? Är det någon som vill svara?"]},
    {t:"Kroppens alarm", min:5, slide:2, manus:["Titta på kroppen på bilden. När något känns orättvist gör kroppen sig redo. Tänkandet kan bli smalare. Andningen blir snabbare. Hjärtat slår snabbare. Musklerna spänns.","Det är kroppens sätt att försöka skydda oss. Det är inte farligt, men det kan kännas obehagligt.","Kroppen kan också vilja kämpa, fly eller stelna. Det händer av sig självt och är inget fel på dig.","Känner ni igen de här signalerna från en film eller en bok? Berätta gärna om en påhittad person."]},
    {t:"Känslan kommer, handlingen väljer vi", min:5, slide:3, gor:"Skriv elevernas förslag på tavlan. Sortera dem inte nu.", manus:["Nu kommer det viktigaste. Känslan kommer av sig själv. Handlingen väljer vi.","Arg, besviken och frustrerad är känslor. De är alltid okej.","Att skrika elaka saker eller slå är handlingar. De är inte okej.","Vad kan Sam göra i stället? Jag skriver upp era förslag."]},
    {t:"Samtal i par", min:4, slide:4, gor:"Gå runt och lyssna. Hjälp grupper som fastnat med ett exempel, till exempel att ta en paus eller säga vad man vill.", manus:["Nu pratar ni två och två om Sam. Fråga varandra: Vad kan hjälpa Sams kropp att landa? Vad kan Sam säga till den som tog bollen?","Kom ihåg att ni pratar om Sam. Ni behöver inte berätta något om er själva. Ni har tre minuter."]},
    {t:"Avslut", min:2, slide:5, manus:["Bra jobbat! Titta på verktygen: andas långsamt, röra på sig, ta en paus och prata med någon. Prova det som passar dig.","Alla känslor är tillåtna. Alla beteenden är det inte.","Om något känns svårt kan du alltid prata med en trygg vuxen här på skolan."]}
  ],
  exempel:[["Sam i skolgården","Sam har väntat på bollen hela rasten. Någon tar den utan att fråga."],["Noor i grupparbetet","Någon ändrar i Noors text utan att säga något. Noor märker att händerna blir spända."],["Alex i kön","Någon trängs före Alex i matkön. Alex känner hur hjärtat slår fortare."]],
  fragor:["Vilka signaler i kroppen kan man märka när man blir arg?","Vad kan hjälpa kroppen att landa?","Vad är skillnaden mellan att vara arg och att göra något när man är arg?","Vem kan man be om hjälp?"],
  anpassningar:[["Mer stöd","Använd bilderna som stöd, arbeta i mindre grupper och förenkla frågorna."],["Fördjupning","Låt eleverna beskriva Sams situation med modellens sex steg."],["Rörelse och andning","All rörelse eller andning är frivillig. Låt eleverna titta på, göra en annan rörelse eller sitta stilla."],["Språk","Skriv upp nyckelorden, till exempel hjärta, andning, muskler och paus."]],
  trygghet:["Alla får vara med, men ingen tvingas. Om något väcker starka känslor hos ett barn eller en elev: låt hen pausa, sitta nära en trygg vuxen eller lämna övningen i lugn och ro utan att behöva förklara sig, och prata gärna med hen efteråt.","Betona respekt för olika åsikter och synsätt, så att ingen blir utskämd. Stoppa kommentarer som skämmer ut någon, och påminn om att allt handlar om påhittade personer.","Ingen elev behöver berätta om något privat eller svårt inför gruppen.","Ämnet kan beröra olika starkt. Låt eleverna delta på sitt sätt och hoppa över det de vill.","Om en elev blir upprörd: pausa, ge eleven ro och möjlighet att lämna övningen utan att behöva förklara sig.","Om en elev berättar något som väcker oro: följ skolans egna rutiner och kontakta elevhälsan.","Övningen är inte terapi. Lärare förväntas inte bedöma eller bearbeta enskilda elevers upplevelser."],
  avslut:"Sammanfatta: alla känslor är tillåtna, alla beteenden är det inte. Kroppen skickar signaler, och vi kan välja vad vi gör. Påminn om var eleverna kan få stöd.",
  slides:[
    `<div class="slide"><h2 class="big">Vad händer när jag blir arg?</h2><p>Kroppens signaler och våra val</p><div style="max-width:42cqw;margin-top:1.5cqw">${PULSE}</div><p class="tagline">9–10 år · Lär känna ditt nervsystem</p></div>`,
    `<div class="slide"><h2>Sam i skolgården</h2><p>Sam har väntat på bollen hela rasten. Då tar någon den utan att fråga.</p><div class="flow"><span class="schip on">Händelse</span><i>→</i><span class="schip">Känsla</span><i>→</i><span class="schip">Kroppen</span><i>→</i><span class="schip">Val</span></div><p style="margin-top:2.4cqw">Vad hände? Vad kan Sam känna?</p></div>`,
    `<div class="slide"><div class="body-slide"><div><h2>Kroppens alarm</h2><p class="note">Kroppen gör sig redo när något känns orättvist eller hotfullt.</p><p class="note">Det är inte farligt, men det kan kännas obehagligt.</p><p class="note">Kroppen kan vilja kämpa, fly eller stelna. Det är inget fel på dig.</p></div><div>${BODY}</div></div></div>`,
    `<div class="slide"><h2>Känslan kommer. Handlingen väljer vi.</h2><div class="two"><div class="panel a"><h3>Känslor</h3><p>Arg, besviken, frustrerad.</p><p>De kommer av sig själva och är alltid okej.</p></div><div class="panel b"><h3>Handlingar</h3><p>Här väljer vi. Att slå eller säga elaka saker är inte okej.</p><p>Vi kan ta en paus, säga vad vi vill eller be om hjälp.</p></div></div></div>`,
    `<div class="slide"><h2>Vad kan Sam göra?</h2><ul class="q-list"><li>Vad kan hjälpa Sams kropp att landa?</li><li>Vad kan Sam säga till den som tog bollen?</li></ul><p class="tagline">Prata två och två om Sam. Du behöver inte berätta något om dig själv.</p></div>`,
    `<div class="slide"><h2>Verktyg som kan hjälpa kroppen att landa</h2><div class="chips6"><span class="schip">Andas långsamt</span><span class="schip">Röra på sig</span><span class="schip">Ta en paus</span><span class="schip">Prata med någon</span></div><p style="margin-top:2.4cqw">Prova det som passar dig. Du får också hoppa över.</p><p class="closing">Alla känslor är tillåtna. Alla beteenden är det inte.</p></div>`
  ]};

function glasSvg(){
  const L=y=>110+(y-60)*25/210, R=y=>290-(y-60)*25/210;
  const band=(y1,y2,c)=>`<polygon points="${L(y1)},${y1} ${R(y1)},${y1} ${R(y2)},${y2} ${L(y2)},${y2}" fill="${c}"/>`;
  const etikett=(y,txt)=>`<path d="M${R(y)-8} ${y}H318" stroke="#E8DDCC" stroke-width="2" fill="none"/><text x="328" y="${y+7}">${txt}</text>`;
  return `<svg viewBox="0 0 640 300" role="img" aria-label="Ett glas som fylls på i lager med trött, hungrig, stress inför prov och bråk igår. En droppe till, gruppvalet, får glaset att rinna över.">
${band(225,270,"#B7A9C8")}${band(180,225,"#A9C5CF")}${band(135,180,"#D8B46A")}${band(90,135,"#C8846B")}
<path d="M110 60L135 270H265L290 60" fill="none" stroke="#E8DDCC" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M200 12c9 12 13 19 13 24a13 13 0 0 1-26 0c0-5 4-12 13-24z" fill="#F7F4EE"/>
<path d="M112 62q-14 8-10 26M288 62q14 8 10 26" fill="none" stroke="#A9C5CF" stroke-width="4" stroke-linecap="round"/>
<g font-family="Instrument Sans,Segoe UI,sans-serif" font-weight="600" font-size="22" fill="#F7F4EE">
${etikett(247,"Trött")}${etikett(202,"Hungrig")}${etikett(157,"Stress inför prov")}${etikett(112,"Bråk igår")}
<text x="226" y="36">Gruppvalet</text></g></svg>`;
}

EX[10] = {n:10, niva:4, titel:"Varför reagerar jag så starkt?", omr:"nervsystem", tagline:"11–12 år · Lär känna ditt nervsystem",
  ingress:"Övning för årskurs 5–6 om varför reaktioner ibland blir starkare än man själv förstår, och vad man kan göra i tid.",
  syfte:["Eleverna får se att starka reaktioner ofta har flera orsaker, till exempel trötthet, hunger, stress och sådant som hänt tidigare, och att det finns små saker man kan göra för att få mer utrymme. De får öva på att märka i tid och på att välja ett första litet steg.","Övningen hör till huvudområdet Lär känna ditt nervsystem och bygger på stegen Uppmärksamma, Förstå och Hitta stöd och balans i modellen i sex steg."],
  intro:"Övningen utgår från en påhittad person, Jo, och använder bilden av ett glas som fylls på. Det är en förklarande bild och inte en exakt vetenskaplig modell. Du behöver inte ge några rätta svar. Målet är att eleverna får en bild för det som händer, inte att de ska analysera sig själva.",
  material:["Skärm eller projektor för klassrumsläget.","Valfritt: papper och pennor om eleverna vill rita ett glas för Jo.","Inga personuppgifter eller tester behövs."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag ska vi prata om varför vi ibland reagerar mycket starkare än vi själva förstår.","Vi utgår från en påhittad person, Jo. Ingen behöver berätta något om sig själv. Kom ihåg att vi tycker och tänker olika, och att vi visar respekt för det så att ingen blir utskämd."]},
    {t:"Berättelsen om Jo", min:3, slide:1, gor:"Ta emot några svar. Peka inte ut vad någon själv har upplevt.", manus:["Läs om Jo. Läraren säger att klassen ska välja grupper. Förra gången fick Jo inte vara med en kompis. Nu känns det som att allt rasar, och Jo blir arg och tyst.","Att bli arg kan vara kroppens sätt att kämpa, och att bli tyst kan vara kroppens sätt att stelna. Kroppen reagerar på sitt sätt, och det är inget fel.","Varför blev reaktionen så stark? Räck upp handen om du har en idé."]},
    {t:"Det som fyller på", min:5, slide:2, manus:["Titta på glaset. Tänk dig att varje sak som tynger fyller på lite i glaset: att vara trött, att vara hungrig, stress inför ett prov, ett bråk igår.","När glaset är nästan fullt behövs det bara en liten sak till för att det ska rinna över. Då kan reaktionen bli stark, även om det som hände just nu inte var så stort.","Det här är en bild och inte en exakt vetenskaplig modell. Men den hjälper oss att förstå att starka reaktioner oftast har flera skäl."]},
    {t:"Att tömma lite", min:4, slide:3, manus:["Vad kan man göra för att tömma lite i glaset? Titta på förslagen: sova och vila, äta, röra på sig, prata med någon och ta en paus.","Man kan inte alltid välja bort det som fyller på. Men man kan märka när glaset börjar bli fullt, och göra något litet i tid."]},
    {t:"Samtal i par", min:5, slide:4, gor:"Gå runt och lyssna. Hjälp grupper som fastnat med exempel som ”Jo var kanske trött” eller ”Jo kan ta en paus”.", manus:["Nu pratar ni två och två om Jo. Fråga varandra: Vad kan ha fyllt på hos Jo? Vad kan hjälpa Jo att landa?","Kom ihåg att ni pratar om Jo. Ni behöver inte berätta något om er själva. Ni har tre minuter."]},
    {t:"Avslut", min:2, slide:5, manus:["Idag har vi sett att starka reaktioner har skäl, och att det finns små saker man kan göra när glaset börjar bli fullt.","Alla känslor är tillåtna. Alla beteenden är det inte.","Om något känns tungt eller svårt kan du alltid prata med en trygg vuxen här på skolan."]}
  ],
  exempel:[["Jo och gruppvalet","Jo hoppades få vara med en kompis men blev inte tillfrågad."],["Mika efter en dålig natt","Mika sov dåligt, missade frukosten och blir arg när någon råkar knuffa till hans väska."],["Lo före provet","Lo är stressad inför ett prov och reagerar skarpt när en kompis skämtar."]],
  fragor:["Vad kan fylla på i ett glas utan att man tänker på det?","Vad kan man göra i tid, innan glaset rinner över?","Vem kan man be om hjälp?"],
  anpassningar:[["Mer stöd","Använd bilden av glaset och peka på varje sak medan ni pratar."],["Fördjupning","Låt eleverna rita ett eget glas för Jo, med det som kan ha fyllt på och det som kan tömma."],["Rörelse och andning","Rörelse och andning är frivilliga. Eleverna kan titta på eller välja ett annat verktyg."],["Språk","Skriv upp orden trött, stress, återhämta och paus."]],
  trygghet:["Alla får vara med, men ingen tvingas. Om något väcker starka känslor hos ett barn eller en elev: låt hen pausa, sitta nära en trygg vuxen eller lämna övningen i lugn och ro utan att behöva förklara sig, och prata gärna med hen efteråt.","Betona respekt för olika åsikter och synsätt, så att ingen blir utskämd. Stoppa kommentarer som skämmer ut någon, och påminn om att allt handlar om påhittade personer.","Ingen elev behöver berätta om något privat eller svårt inför gruppen.","Ämnet kan beröra olika starkt, särskilt elever som sover dåligt, har det jobbigt hemma eller känner mycket stress. Låt eleverna delta på sitt sätt och hoppa över det de vill.","Om en elev blir upprörd: pausa och ge eleven ro och möjlighet att lämna övningen utan att förklara sig.","Om en elev berättar något som väcker oro: följ skolans rutiner och kontakta elevhälsan.","Övningen är inte terapi. Lärare förväntas inte bedöma eller bearbeta enskilda elevers upplevelser."],
  avslut:"Sammanfatta: starka reaktioner har skäl, det finns små saker man kan göra i tid, och man kan alltid prata med en trygg vuxen.",
  slides:[
    `<div class="slide"><h2 class="big">Varför reagerar jag så starkt?</h2><p>Glaset som fylls på</p><p class="tagline">11–12 år · Lär känna ditt nervsystem</p></div>`,
    `<div class="slide"><h2>Jo och gruppvalet</h2><p>Läraren säger att klassen ska välja grupper. Förra gången fick Jo inte vara med en kompis. Nu känns det som att allt rasar, och Jo blir arg och tyst.</p><p style="margin-top:2cqw">Varför blev reaktionen så stark?</p></div>`,
    `<div class="slide"><div class="body-slide"><div><h2>Det som fyller på</h2><p class="note">Reaktionen kommer inte bara av det som hände nu. Ibland har glaset hunnit fyllas på.</p></div><div>${glasSvg()}</div></div></div>`,
    `<div class="slide"><h2>Att tömma lite i glaset</h2><div class="chips6"><span class="schip">Sova och vila</span><span class="schip">Äta</span><span class="schip">Röra på sig</span><span class="schip">Prata med någon</span><span class="schip">Ta en paus</span></div><p style="margin-top:2.4cqw">Märk när glaset börjar bli fullt, och gör något litet i tid.</p></div>`,
    `<div class="slide"><h2>Vad kan Jo göra?</h2><ul class="q-list"><li>Vad kan ha fyllt på hos Jo?</li><li>Vad kan hjälpa Jo att landa?</li></ul><p class="tagline">Prata två och två om Jo. Du behöver inte berätta något om dig själv.</p></div>`,
    `<div class="slide"><h2 class="big">Starka reaktioner har skäl.</h2><p>Du kan lära dig att märka när glaset börjar bli fullt.</p><p class="tagline">Stöd finns: en trygg vuxen på skolan.</p></div>`
  ]};

EX[11] = {n:11, niva:5, titel:"Våga säga nej.", omr:"granser", tagline:"13–15 år · Snäll betyder inte gränslös",
  ingress:"Övning för årskurs 7–9 om att sätta gränser utan att bli arg, och om att respektera andras nej.",
  syfte:["Eleverna får skilja på att ge efter, att attackera och att vara tydlig och vänlig. De får öva på att säga nej och på att respektera när någon annan säger nej, även i digitala sammanhang."],
  intro:"Övningen utgår från påhittade situationer. Rollspelet är frivilligt: elever kan läsa upp, ge tips eller skriva sitt svar. Det finns inget enda rätt svar på vad som händer efteråt. Poängen är att skilja på de tre sätten att svara.",
  material:["Skärm eller projektor för klassrumsläget.","Valfritt: papper och pennor.","Inga personuppgifter behövs."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag ska vi prata om att säga nej, och om att respektera när någon annan säger nej.","Allt vi pratar om handlar om påhittade personer. Ingen behöver berätta något om sig själv. Kom ihåg att människor har olika åsikter och synsätt, och att vi visar respekt för det."]},
    {t:"Tre sätt att svara", min:5, slide:1, slideTo:2, gor:"Det finns inget enda rätt svar på vad som händer efteråt. Poängen är att skilja på att ge efter, att attackera och att vara tydlig.", manus:["Här är Mika. Några kompisar vill lägga ut en pinsam bild på en klasskamrat i gruppchatten, som ett skämt. Mika vill inte vara med.","Titta på tre sätt att svara. Det första: ”Ja, okej då.” Det andra: ”Är ni helt dumma?!” Det tredje: ”Nej, det tycker jag inte är kul. Jag är inte med på det.”","Prata med personen bredvid er i en minut. Vilket svar hjälper Mika att hålla sin gräns? Vad tror ni händer efteråt med varje svar?","Vad kom ni fram till? Någon som vill dela?"]},
    {t:"Så säger man nej", min:3, slide:3, manus:["Att säga nej behöver inte vara ilsket. Man kan vara tydlig och vänlig samtidigt.","Fyra steg. Ett: säg vad du inte vill. Två: håll rösten lugn. Tre: erbjud ett alternativ om du vill, till exempel ”Jag kan göra något annat med er.” Fyra: gå därifrån om det behövs.","När det känns pressat kan kroppen vilja kämpa, fly eller stelna, och då kan det vara svårt att svara lugnt. Det går att öva på.","Det är okej att säga nej, även till kompisar."]},
    {t:"Öva två och två", min:7, slide:4, gor:"Gå runt. Hjälp elever som fastnar att börja med: ”Nej, det vill jag inte.” Uppmuntra lugn röst, inte hög.", manus:["Nu ska ni öva två och två. Titta på korten på skärmen. Välj ett kort.","En av er läser kortet. Den andra svarar med ett tydligt och vänligt nej. Sedan byter ni.","Ni får använda stegen från förra bilden. Du får också välja att vara den som lyssnar och ger tips. Ni har sex minuter."]},
    {t:"Att respektera ett nej", min:3, slide:5, manus:["Nu byter vi sida. Vad gör man när någon annan säger nej till en?","Man stannar. Man frågar inte igen och igen. Man säger: ”Okej.” Ett nej är ett svar.","Det gäller också på nätet, och det gäller allt: kropp, saker och tid."]},
    {t:"Avslut", min:2, slide:6, manus:["Idag har vi sett att man kan sätta en gräns utan att vara arg eller dum, och att man kan respektera andras gränser.","Snäll betyder inte gränslös. Om någon inte lyssnar på ditt nej kan du be en vuxen om hjälp.","Det finns alltid vuxna här på skolan som du kan prata med."]}
  ],
  exempel:[["Mika och gruppchatten","Kompisar vill lägga ut en pinsam bild på en klasskamrat. Mika vill inte vara med."],["Jo och läxan","Någon vill att Jo ska ge bort sin läxa så att de kan skriva av den."],["Lee och lösenordet","Någon ber Lee om ett lösenord och säger att det är ”bara för skojs skull”."]],
  fragor:["Varför kan det vara svårt att säga nej till kompisar?","Hur kan man säga nej utan att vara ilsken?","Hur märker man att någon respekterar ens nej?"],
  anpassningar:[["Mer stöd","Skriv upp meningsstarter på tavlan: ”Nej, det vill jag inte.”, ”Jag är inte med på det.”, ”Jag kan göra något annat.”"],["Fördjupning","Låt eleverna skriva egna situationskort om påhittade personer."],["Rollspel","Rollspelet är frivilligt. Elever kan läsa upp, ge tips eller skriva sitt svar."],["Språk","Förklara orden gräns, grupptryck och samtycke vid behov."]],
  trygghet:["Alla får vara med, men ingen tvingas. Om något väcker starka känslor hos ett barn eller en elev: låt hen pausa, sitta nära en trygg vuxen eller lämna övningen i lugn och ro utan att behöva förklara sig, och prata gärna med hen efteråt.","Betona respekt för olika åsikter och synsätt, så att ingen blir utskämd. Stoppa kommentarer som skämmer ut någon, och påminn om att allt handlar om påhittade personer.","Ingen elev behöver berätta om egna upplevelser.","Ämnet kan beröra elever som har varit med om att inte bli lyssnade på. Låt eleverna delta på sitt sätt.","Om en elev berättar att någon har gått över en gräns, till exempel mot kroppen: lyssna lugnt, lova inte att hålla det hemligt och följ skolans rutiner. Kontakta elevhälsan. Skolpersonal har skyldighet att agera vid oro för att ett barn far illa.","Om en elev blir upprörd: pausa och ge eleven möjlighet att lämna övningen i lugn och ro.","Övningen är inte terapi."],
  avslut:"Avsluta med att man kan sätta en gräns utan att vara arg, att man ska respektera andras nej, och att man kan be en vuxen om hjälp.",
  slides:[
    `<div class="slide"><h2 class="big">Våga säga nej</h2><p>Gränser utan att bli arg</p><p class="tagline">13–15 år · Snäll betyder inte gränslös</p></div>`,
    `<div class="slide"><h2>Mika och gruppchatten</h2><p>Några kompisar vill lägga ut en pinsam bild på en klasskamrat i gruppchatten, som ett skämt. Mika vill inte vara med.</p><p style="margin-top:2cqw">Vad kan Mika svara?</p></div>`,
    `<div class="slide"><h2>Tre sätt att svara</h2><div class="three-col"><div class="bubble mid"><small>Ger efter</small>”Ja, okej då …”</div><div class="bubble bad"><small>Attackerar</small>”Är ni helt dumma?!”</div><div class="bubble good"><small>Tydligt och vänligt</small>”Nej, det tycker jag inte är kul. Jag är inte med på det.”</div></div></div>`,
    `<div class="slide"><h2>Så säger du nej</h2>${nsteps(["Säg vad du inte vill.","Håll rösten lugn.","Erbjud ett alternativ om du vill.","Gå därifrån om det behövs."])}</div>`,
    `<div class="slide"><h2>Öva två och två</h2><div class="three-col"><div class="bubble"><small>Kort A</small>Någon vill att du ska ge bort din läxa så att de kan skriva av den.</div><div class="bubble"><small>Kort B</small>Någon vill att du ska stanna kvar, men du vill gå hem.</div><div class="bubble"><small>Kort C</small>Någon ber dig om ditt lösenord.</div></div><p style="margin-top:2cqw">En läser kortet. Den andra svarar med ett tydligt och vänligt nej. Byt sedan.</p></div>`,
    `<div class="slide"><h2>När någon säger nej till dig</h2>${nsteps(["Stanna.","Fråga inte igen.","Säg: ”Okej.”"])}<p style="margin-top:2cqw">Ett nej är ett svar.</p></div>`,
    `<div class="slide"><h2 class="big">Snäll betyder inte gränslös.</h2><p>Att sätta en gräns är inte att vara dum eller arg.</p><p class="tagline">Lyssnar ingen? Be en vuxen om hjälp.</p></div>`
  ]};

EX[15] = {n:15, niva:5, titel:"Hur reparerar man en relation?", omr:"ansvar", tagline:"13–15 år · Misstag, ansvar och att göra rätt igen",
  ingress:"Övning för årskurs 7–9 om skillnaden mellan att förklara och att ursäkta, och om hur man kan laga en relation.",
  syfte:["Eleverna får se skillnaden mellan att förklara ett beteende och att ursäkta det, och lär sig fyra delar i en ursäkt som lagar. De får öva på att ta ansvar utan skam och på att förstå att man inte styr hur en ursäkt tas emot."],
  intro:"Övningen utgår från två påhittade personer, Robin och Noor. Övningen handlar om vanliga misstag mellan kompisar och passar inte som lösning när någon utsätts för upprepade kränkningar, hot eller våld.",
  material:["Skärm eller projektor för klassrumsläget.","Papper och pennor, eller digital anteckningsyta.","Inga personuppgifter samlas in."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om vad man kan göra när man har gjort något som sårat någon, och hur man kan laga en relation.","Vi arbetar med påhittade personer. Ingen behöver berätta något om sig själv. Det du skriver senare handlar om påhittade personer. Ingen tvingas, och du kan säga till mig om något känns jobbigt."]},
    {t:"Berättelsen om Robin och Noor", min:3, slide:1, manus:["Läs situationen på skärmen. Robin har en dålig dag och skriver ett drygt svar i gruppchatten. Noor blir sårad och undviker Robin. Nu känns det konstigt för båda.","Titta på reaktionerna. Robin blev kanske arg, och det kan vara kroppens sätt att kämpa. Noor drar sig undan, och det kan vara kroppens sätt att fly. Båda reaktionerna sker av sig själva.","Vad skulle kunna laga det? Prata två och två i en minut.","Vad kom ni fram till?"]},
    {t:"Förklara eller ursäkta", min:4, slide:2, manus:["Det är skillnad på att förklara och att ursäkta. Robin kan förklara: ”Jag hade en dålig dag.” Det är sant, och det är en förklaring.","Men en ursäkt säger: ”Det jag skrev var drygt, och det var mitt val.” Förklaringen ersätter inte ursäkten.","Att förstå varför någon gjorde något betyder inte att man accepterar det. Det gäller också Robin."]},
    {t:"En ursäkt som lagar", min:4, slide:3, manus:["En ursäkt som lagar har fem delar. Ett: säg vad du gjorde. Två: säg hur det kan ha påverkat den andra. Tre: ta ansvar, utan att skylla på någon annan. Fyra: fråga vad som kan lagas, eller erbjud något konkret. Fem: säg vad du gör annorlunda nästa gång, så att det inte händer igen.","Ett exempel för Robin: ”Jag skrev något drygt i chatten. Det var inte okej, och jag fattar om det gjorde ont. Vill du prata, eller ska jag skriva något till gruppen? Nästa gång tar jag en paus innan jag skriver.”","Lägg märke till att det inte står ”men jag hade en dålig dag”."]},
    {t:"Skriv", min:7, slide:4, gor:"Gå runt. Uppmuntra elever som fastnar att använda de fem delarna. Läs inte upp något utan elevens tillåtelse. Ingen tvingas: om en elev tycker att det är jobbigt, låt eleven pausa eller sitta vid sidan om utan att förklara sig.", manus:["Nu skriver ni två eller tre meningar. Välj själva: antingen Robins ursäkt till Noor, eller Noors svar till Robin.","Skriv om Robin och Noor, inte om er själva. Ni har sex minuter.","Läs sedan upp din text för personen bredvid."]},
    {t:"Du styr inte hur det tas emot", min:2, slide:5, manus:["En sista viktig sak. Du kan ta ansvar för det du gjorde. Du kan inte bestämma hur den andra tar emot det.","Noor kanske behöver tid. Det betyder inte att ursäkten var fel.","Och om någon utsätts för kränkningar eller hot upprepade gånger är det inte en relation man ska laga på egen hand. Då ska en vuxen in."]},
    {t:"Avslut", min:2, slide:6, manus:["Idag har vi sett skillnaden mellan att förklara och att ursäkta, och fyra delar i en ursäkt som lagar.","Misstag är mänskliga. Ansvar hjälper oss att utvecklas, och det går att ta ansvar utan skam.","Behöver du prata om något av det här finns elevhälsan och vuxna här på skolan."]}
  ],
  exempel:[["Robin och Noor","Robin skriver ett drygt svar i gruppchatten efter en dålig dag."],["Kim och löftet","Kim lovade att hjälpa till men glömde bort det, och en kompis blev ensam med uppgiften."],["Sasha och skämtet","Sasha skämtade om någons kläder framför andra och märkte att personen blev tyst."]],
  fragor:["Varför är det svårt att be om ursäkt?","Vad är skillnaden mellan att förklara och att ursäkta?","Vad kan man göra om den andra inte vill prata än?"],
  anpassningar:[["Mer stöd","Ge färdiga meningsstarter: ”Jag gjorde …”, ”Jag förstår att det kan ha …”, ”Det var mitt val.”"],["Fördjupning","Koppla till steg 6 i modellen i sex steg: Ta ansvar och reparera."],["Skrivande","Elever som har svårt att skriva kan säga sin text muntligt till kompisen eller få hjälp att skriva ner den."],["Muntligt","Situationen kan göras om till ett muntligt exempel om chatt känns främmande."]],
  trygghet:["Alla får vara med, men ingen tvingas. Om något väcker starka känslor hos ett barn eller en elev: låt hen pausa, sitta nära en trygg vuxen eller lämna övningen i lugn och ro utan att behöva förklara sig, och prata gärna med hen efteråt.","Betona respekt för olika åsikter och synsätt, så att ingen blir utskämd. Stoppa kommentarer som skämmer ut någon, och påminn om att allt handlar om påhittade personer.","Ingen behöver berätta något om sig själv. Eleverna skriver om påhittade personer, och läser upp sina texter för en kompis.","Ämnet kan beröra elever som själva har blivit sårade eller sårat andra. Låt eleverna delta på sitt sätt.","Reparera passar inte om en elev utsätts för mobbning, hot eller våld. Då handlar det om att få stopp på det med vuxnas hjälp. Följ skolans rutiner och kontakta elevhälsan.","Om en elev blir upprörd: pausa och ge ro.","Övningen är inte terapi."],
  avslut:"Avsluta med att misstag är mänskliga, att ansvar går att ta utan skam, och att vuxna och elevhälsan finns om något känns svårt.",
  slides:[
    `<div class="slide"><h2 class="big">Hur reparerar man en relation?</h2><p>Förklara, ursäkta, laga</p><p class="tagline">13–15 år · Misstag, ansvar och att göra rätt igen</p></div>`,
    `<div class="slide"><h2>Robin och Noor</h2><div class="timeline"><div class="tl"><b>1</b>Efter en dålig dag skriver Robin ett drygt svar i gruppchatten.</div><div class="tl"><b>2</b>Noor blir sårad och undviker Robin.</div><div class="tl"><b>3</b>Nu känns det konstigt för båda.</div></div><p style="margin-top:2cqw">Vad skulle kunna laga det?</p></div>`,
    `<div class="slide"><h2>Att förklara är inte att ursäkta</h2><div class="two"><div class="panel a"><h3>Förklaring</h3><p>”Jag hade en dålig dag.”</p><p>Säger varför det hände.</p></div><div class="panel b"><h3>Ursäkt</h3><p>”Det jag skrev var drygt, och det var mitt val.”</p><p>Tar ansvar för vad som hände.</p></div></div><p class="tagline">Förklaringen ersätter inte ursäkten.</p></div>`,
    `<div class="slide"><h2>En ursäkt som lagar</h2>${nsteps(["Säg vad du gjorde.","Säg hur det kan ha påverkat.","Ta ansvar, utan att skylla på.","Fråga vad som kan lagas, eller erbjud något konkret.","Säg vad du gör annorlunda nästa gång."])}</div>`,
    `<div class="slide"><h2>Din tur</h2><p>Skriv två eller tre meningar. Välj själv:</p><ul class="q-list"><li>Robins ursäkt till Noor</li><li>Noors svar till Robin</li></ul><p class="tagline">Skriv om Robin och Noor, inte om dig själv.</p></div>`,
    `<div class="slide"><h2>Du styr inte hur det tas emot</h2><p>Du kan ta ansvar för det du gjorde.</p><p>Du kan inte bestämma hur den andra tar emot det.</p><p class="tagline">Noor kan behöva tid.</p></div>`,
    `<div class="slide"><h2 class="big">Att reparera är att ta ansvar utan skam.</h2><p>Misstag är mänskliga. Ansvar hjälper oss att utvecklas.</p></div>`
  ]};

EX[18] = {n:18, niva:6, titel:"Från reaktion till medvetet val.", omr:"nyasatt", tagline:"16–19 år · Vi kan lära oss nya sätt",
  ingress:"Övning för gymnasiet om hur reaktioner uppstår och hur man kan skapa utrymme för ett medvetet val.",
  syfte:["Eleverna får se att reaktioner följer en kedja från händelse till konsekvens, och att det finns ett utrymme mellan känsla och handling som går att göra större. De får skilja mellan strategier som hjälper på sikt och sådana som bara lindrar för stunden."],
  intro:"Övningen utgår från en påhittad person, Sasha. I steget Skriv om ett val skriver eleverna om Sasha eller om en egen påhittad person och läser upp sin text för en kompis. Inget samlas in.",
  material:["Skärm eller projektor för klassrumsläget.","Papper och pennor, eller digital anteckningsyta.","Inga personuppgifter samlas in."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag ska vi undersöka vad som händer mellan en känsla och en handling, och hur man kan gå från reaktion till medvetet val.","Vi utgår från en påhittad person, Sasha. Senare skriver ni om Sasha eller om en egen påhittad person. Ingen tvingas, och du kan säga till mig om något känns jobbigt."]},
    {t:"Situationen", min:4, slide:1, manus:["Läs situationen. Under en presentation får Sasha kritik inför hela gruppen. Sasha svarar snabbt och skarpt. Efteråt känner Sasha både ilska och skam.","Fråga: Vad hände mellan kritiken och svaret? Prata två och två i två minuter."]},
    {t:"Kedjan", min:5, slide:2, gor:"Låt eleverna peka ut var i kedjan Sasha hade kunnat göra något annat.", manus:["Titta på kedjan. Händelsen var kritiken. Sasha tolkade den som ”de tycker att jag är dålig”. Det gav ilska och en kropp i försvarsläge. Sedan kom reaktionen, ett skarpt svar, och sedan konsekvensen.","Sashas skarpa svar är en kampreaktion. Andra kunde i stället ha stelnat och blivit tysta, eller dragit sig undan. Alla tre är automatiska reaktioner i kroppen.","Det mesta av det här sker på några sekunder och utan att vi tänker. Det är inte ett fel. Det är hur vi fungerar, formade av våra erfarenheter.","Att förklara en reaktion är inte att ursäkta den. Men när vi ser kedjan kan vi se var vi har möjlighet att välja."]},
    {t:"Utrymmet", min:4, slide:3, manus:["Mellan känslan och handlingen finns ett utrymme. Att göra det utrymmet större är en färdighet som går att öva.","Några saker som kan hjälpa: pausa, andas långsamt, röra på sig och sätta ord på vad du behöver. Be gärna om tid: ”Jag behöver tänka på det, kan vi ta det senare?”","Och det är skillnad på det som hjälper på sikt och det som bara lindrar för stunden. Att varje gång distrahera bort känslan lindrar nu, men lär oss inte något nytt.","Gör i stället så här: känn efter först och sätt ord på känslan. Välj sedan något som hjälper, till exempel en paus, att röra på dig eller att prata med någon, och kom tillbaka till det som hände."]},
    {t:"Skriv om ett val", min:7, slide:4, gor:"Låt rummet vara tyst medan alla skriver. Läs inte upp elevernas texter inför klassen utan tillåtelse. Eleverna läser upp för varandra i par. Ingen tvingas: om en elev tycker att det är jobbigt, låt eleven pausa eller sitta vid sidan om utan att förklara sig.", manus:["Nu skriver ni i sex minuter. Välj: antingen Sasha, och vad Sasha kunde ha gjort efter kritiken och innan svaret för att välja något annat, eller en egen påhittad person som ofta reagerar snabbt i en situation.","Svara på tre frågor: Vad startar reaktionen? Vilket val skulle personen vilja kunna göra? Vad skulle hjälpa personen att komma dit?","Skriv om en påhittad person, inte om er själva. Läs sedan upp din text för personen bredvid."]},
    {t:"Avslut", min:2, slide:5, manus:["Idag har vi sett att reaktioner följer en kedja, och att vi kan öva på att skapa utrymme för ett val.","Du är inte dina reaktioner. Nya sätt går att lära sig, men det tar tid och övning.","Om något av det här känns tungt eller övermäktigt finns stöd: prata med elevhälsan eller vårdcentralen, eller med en vuxen du litar på."]}
  ],
  exempel:[["Sasha och kritiken","Sasha får kritik inför gruppen och svarar skarpt."],["Alex och ändringen","Alex får ett sent besked om att planerna ändras och skriver ett argt meddelande innan han hunnit tänka."],["Robin och löftet","Robins kompis bryter ett löfte, och Robin drar sig undan i flera dagar utan att säga varför."]],
  fragor:["Vad kan hjälpa personen att få ett utrymme?","Vilka strategier hjälper på sikt?","Vem kan personen be om stöd?"],
  anpassningar:[["Mer stöd","Ge en färdig mall med de tre frågorna."],["Fördjupning","Koppla till modellen i sex steg och låt eleverna rita kedjan på ett annat sätt."],["Skrivande","Elever som har svårt att skriva kan säga sin text muntligt till kompisen eller få hjälp att skriva ner den."],["Pauser","Elever får gå ut en stund i lugn och ro."]],
  trygghet:["Alla får vara med, men ingen tvingas. Om något väcker starka känslor hos ett barn eller en elev: låt hen pausa, sitta nära en trygg vuxen eller lämna övningen i lugn och ro utan att behöva förklara sig, och prata gärna med hen efteråt.","Betona respekt för olika åsikter och synsätt, så att ingen blir utskämd. Stoppa kommentarer som skämmer ut någon, och påminn om att allt handlar om påhittade personer.","Eleverna skriver om påhittade personer, inte om sig själva. Inget samlas in.","Ämnet kan väcka starka minnen hos vissa. Låt eleverna delta på sitt sätt och hoppa över det de vill.","Om en elev berättar något som väcker oro: följ skolans rutiner och kontakta elevhälsan.","Om en elev blir upprörd: ge ro och möjlighet att lämna övningen.","Övningen är inte terapi."],
  avslut:"Avsluta med att reaktioner följer en kedja, att utrymmet går att göra större, att nya sätt tar tid, och var eleverna kan få stöd.",
  slides:[
    `<div class="slide"><h2 class="big">Från reaktion till medvetet val</h2><p>Att skapa utrymme mellan känsla och handling</p><p class="tagline">16–19 år · Vi kan lära oss nya sätt</p></div>`,
    `<div class="slide"><h2>Sasha och kritiken</h2><p>Under en presentation får Sasha kritik inför hela gruppen. Sasha svarar snabbt och skarpt. Efteråt känner Sasha både ilska och skam.</p><p style="margin-top:2cqw">Vad hände mellan kritiken och svaret?</p></div>`,
    `<div class="slide"><h2>Kedjan</h2><div class="chain"><div class="link"><b>Händelse</b>Kritik inför gruppen</div><div class="link"><b>Tolkning</b>”De tycker att jag är dålig”</div><div class="link"><b>Känsla och kropp</b>Ilska, pulsen ökar</div><div class="link"><b>Reaktion</b>Ett skarpt svar</div><div class="link"><b>Konsekvens</b>Spänd stämning, skam</div></div></div>`,
    `<div class="slide"><h2>Utrymmet mellan känsla och handling</h2><div class="chips6"><span class="schip">Pausa</span><span class="schip">Andas långsamt</span><span class="schip">Röra på sig</span><span class="schip">Sätta ord på behovet</span></div><div class="two"><div class="panel b"><h3>Kan hjälpa på sikt</h3><p>Ta en paus, röra på sig, sätta ord på vad du behöver, prata med någon.</p></div><div class="panel a"><h3>Lindrar bara för stunden</h3><p>Att varje gång distrahera bort känslan eller trycka undan den.</p><p><strong>Gör i stället:</strong> känn efter, sätt ord på känslan och välj sedan något som hjälper: en paus, rörelse eller någon att prata med.</p></div></div></div>`,
    `<div class="slide"><h2>Skriv om ett val</h2><p>Välj en:</p><ul class="q-list"><li>Sasha: Vad kunde Sasha ha gjort efter kritiken, innan svaret, för att välja något annat?</li><li>En egen påhittad person som ofta reagerar snabbt: vad händer, och vad kan personen välja i stället?</li></ul><p style="margin-top:2cqw">Vad startar reaktionen? Vilket val vill personen kunna göra? Vad skulle hjälpa personen dit?</p><p class="tagline">Skriv om en påhittad person, inte om dig själv.</p></div>`,
    `<div class="slide"><h2 class="big">Du är inte dina reaktioner.</h2><p>Nya sätt går att lära sig. Det tar tid och övning.</p><p class="tagline">Stöd finns: elevhälsan, vårdcentralen och vuxna du litar på.</p></div>`
  ]};

EX[19] = {n:19, niva:6, titel:"Säg vad du behöver (del 1 av 2)", omr:"andra", tagline:"16–19 år · Förstå andra människor",
  ingress:"Del 1 av 2 av en övning för gymnasiet om ömsesidighet, empati och jag-budskap. Del 2, som görs några dagar senare, handlar om att lyssna och söka en lösning.",
  syfte:["Eleverna får se att goda relationer bygger på ömsesidighet, och att empati är att förstå någon annan utan att behöva hålla med, acceptera allt eller ta över den andres känslor eller problem. De övar på att säga vad de behöver med ett jag-budskap.","Övningen hör till huvudområdet Förstå andra människor. Del 2, Lyssna och sök en lösning, bygger vidare på den här delen och görs helst några dagar senare."],
  intro:"Övningen utgår från påhittade personer. Jag-budskapen är ett verktyg och inget facit. Målet är att eleverna får ord för att säga vad de behöver, inte att de ska analysera sina egna relationer. Del 2 görs helst några dagar senare, så att innehållet repeteras med mellanrum.",
  material:["Skärm eller projektor för klassrumsläget.","Valfritt: papper och pennor för att skriva om meningar.","Inga personuppgifter eller tester behövs."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om relationer: om empati, och om hur man kan säga vad man behöver. Nästa gång övar vi på att lyssna och hitta en lösning.","Vi utgår från påhittade personer, Nour och Elias. Ingen behöver berätta något om sina egna relationer. Kom ihåg att människor har olika åsikter och synsätt, och att vi visar respekt för det."]},
    {t:"Nour och Elias", min:4, slide:1, gor:"Ta emot några svar. Det finns inget rätt svar. Peka inte ut vad någon själv har upplevt.", manus:["Läs situationen. Nour och Elias skulle ses på lördag. Elias ändrar planerna i sista minuten, för tredje gången. Nour blir stressad och skriver: ”Du bryr dig inte om mig.” Elias svarar: ”Du överreagerar.”","Hur tror ni att det känns för var och en? Vad händer med samtalet? Prata med personen bredvid er i en minut."]},
    {t:"Empati utan att hålla med", min:4, slide:2, manus:["Empati är att kunna förstå hur någon annan har det. Det betyder inte att du håller med, och inte att du accepterar allt.","Nour kan förstå att Elias är stressad efter en jobbig vecka, utan att tycka att det är okej att ändra planerna sent hela tiden.","Empati betyder inte heller att du tar över den andres känslor eller problem. Elias stress är Elias att hantera, och Nours stress är Nours. Nour kan lyssna och stötta, men behöver inte lösa den.","Ditt ansvar är att lyssna, att säga vad du själv behöver och att vara respektfull. Den andres ansvar är sina egna känslor och val."]},
    {t:"Säg vad du behöver", min:5, slide:3, gor:"Ge gärna ett förslag efter minuten: ”Jag blir ledsen när jag inte får prata till punkt, och jag behöver att du lyssnar tills jag är klar.”", manus:["Titta på de två meningarna. ”Du bryr dig inte om mig” säger något om den andra personen och låter som en anklagelse. Den som hör det försvarar sig lätt.","En mening som utgår från dig själv låter så här: ”Jag blir stressad när planerna ändras sent, och jag behöver få veta i god tid.” Den säger hur du har det och vad du behöver.","Mönstret är: jag känner … när … och jag behöver …","Gör nu om meningen ”Du lyssnar aldrig” till en mening som utgår från dig själv. Ni har en minut."]},
    {t:"Avslut", min:1, slide:4, manus:["Idag har vi sett att goda relationer bygger på ömsesidighet, att empati är att förstå utan att behöva hålla med, och att man kan säga vad man behöver med ett jag-budskap.","Nästa gång övar vi på att lyssna och söka en lösning tillsammans."]}
  ],
  exempel:[["Nour och Elias","Elias ändrar planerna i sista minuten för tredje gången, och Nour blir stressad."],["Mika och Ines i projektgruppen","Ines gör inte sin del av ett gemensamt arbete, och Mika blir irriterad."],["Jo och Alex","Alex bryter ett löfte om att hjälpa till, och Jo drar sig undan."]],
  fragor:["Vad är skillnaden mellan att förstå någon och att hålla med?","Hur låter ett jag-budskap, och varför är det ofta lättare att lyssna på?"],
  anpassningar:[["Mer stöd","Skriv upp meningsstarten på tavlan: ”Jag blir … när … och jag behöver …”"],["Fördjupning","Låt eleverna skriva egna jag-budskap för påhittade personer."],["Språk","Förklara orden ömsesidighet, empati och jag-budskap vid behov."]],
  trygghet:["Alla får vara med, men ingen tvingas. Om något väcker starka känslor hos ett barn eller en elev: låt hen pausa, sitta nära en trygg vuxen eller lämna övningen i lugn och ro utan att behöva förklara sig, och prata gärna med hen efteråt.","Betona respekt för olika åsikter och synsätt, så att ingen blir utskämd. Stoppa kommentarer som skämmer ut någon, och påminn om att allt handlar om påhittade personer.","Ingen elev behöver berätta om egna relationer. Eleverna övar med påhittade personer.","Ämnet kan beröra elever som har konflikter hemma eller i en relation. Låt eleverna delta på sitt sätt och hoppa över det de vill.","Att lösa en konflikt genom att prata passar inte om någon blir hotad, kontrollerad eller utsatt för våld eller upprepade kränkningar. Då handlar det om att få stopp på det med vuxnas hjälp. Följ skolans rutiner och kontakta elevhälsan.","Om en elev blir upprörd: pausa och ge eleven möjlighet att lämna övningen i lugn och ro.","Övningen är inte terapi. Lärare förväntas inte bedöma eller bearbeta enskilda elevers relationer."],
  avslut:"Avsluta med att goda relationer bygger på ömsesidighet, att empati är att förstå utan att hålla med eller ta över den andres känslor eller problem, och att man kan säga vad man behöver med ett jag-budskap. Berätta att del 2 handlar om att lyssna och söka en lösning.",
  slides:[
    `<div class="slide"><h2 class="big">Säg vad du behöver</h2><p>Del 1: empati och jag-budskap</p><p class="tagline">16–19 år · Förstå andra människor</p></div>`,
    `<div class="slide"><h2>Nour och Elias</h2><div class="timeline"><div class="tl"><b>1</b>Nour och Elias skulle ses på lördag. Elias ändrar planerna i sista minuten, för tredje gången.</div><div class="tl"><b>2</b>Nour blir stressad och skriver: ”Du bryr dig inte om mig.”</div><div class="tl"><b>3</b>Elias svarar: ”Du överreagerar.”</div></div><p style="margin-top:2cqw">Hur känns det för var och en? Vad händer med samtalet?</p></div>`,
    `<div class="slide"><h2>Empati</h2><div class="two"><div class="panel b"><h3>Empati är</h3><p>Att förstå hur någon annan har det.</p><p>Att kunna lyssna utan att försvara sig direkt.</p></div><div class="panel a"><h3>Empati är inte</h3><p>Att hålla med om allt eller acceptera allt.</p><p>Att ta över den andres känslor eller problem, eller tro att det är ditt jobb att fixa dem.</p></div></div><div class="bubble good" style="margin-top:2cqw"><small>Ansvar</small>Mitt ansvar: lyssna, säga vad jag själv behöver och vara respektfull. Den andres ansvar: sina egna känslor och val.</div></div>`,
    `<div class="slide"><h2>Du-budskap eller jag-budskap?</h2><div class="three-col" style="grid-template-columns:1fr 1fr"><div class="bubble bad"><small>Du-budskap</small>”Du bryr dig inte om mig.”</div><div class="bubble good"><small>Jag-budskap</small>”Jag blir stressad när planerna ändras sent, och jag behöver få veta i god tid.”</div></div><p style="margin-top:2cqw">Jag känner … när … och jag behöver …</p></div>`,
    `<div class="slide"><h2 class="big">Jag känner … när … och jag behöver …</h2><p>Nästa gång: lyssna och sök en lösning.</p></div>`
  ]};

EX[20] = {n:20, niva:6, titel:"Lyssna och sök en lösning (del 2 av 2)", omr:"andra", tagline:"16–19 år · Förstå andra människor",
  ingress:"Del 2 av 2 av en övning för gymnasiet om att lyssna, spegla och söka en lösning vid en konflikt. Görs helst några dagar efter del 1.",
  syfte:["Eleverna repeterar empati och jag-budskap och övar på att lyssna, säga tillbaka vad de hörde och söka en lösning som båda kan leva med.","Övningen hör till huvudområdet Förstå andra människor och bygger på del 1, Säg vad du behöver."],
  intro:"Övningen görs helst några dagar efter del 1, så att innehållet repeteras med mellanrum. Eleverna övar med påhittade personer, och rollspelet görs i par. Målet är att eleverna får en struktur för att lyssna och söka en lösning, inte att de ska analysera sina egna relationer.",
  material:["Skärm eller projektor för klassrumsläget.","Valfritt: papper och pennor.","Inga personuppgifter eller tester behövs."],
  steg:[
    {t:"Återblick", min:2, slide:0, slideTo:1, manus:["Hej igen! Förra gången pratade vi om empati och jag-budskap. Idag övar vi på att lyssna och hitta en lösning.","Prata med personen bredvid er i en minut: Vad är empati, och hur låter ett jag-budskap?","Vi utgår från påhittade personer. Ingen behöver berätta något om sina egna relationer. Kom ihåg att människor har olika åsikter och synsätt, och att vi visar respekt för det."]},
    {t:"Lyssna och söka en lösning", min:4, slide:2, manus:["När någon säger vad den behöver kan du lyssna så här: låt den andra prata klart, och säg sedan tillbaka vad du hörde: ”Om jag förstår dig rätt …” Fråga: ”Stämmer det?”","Därefter säger du vad du själv behöver. Sedan söker ni en lösning som ni båda kan leva med, till exempel att Elias lovar att säga till senast kvällen innan.","Konflikter hör till relationer. De går att hantera genom att lyssna och söka en lösning."]},
    {t:"Öva två och två", min:8, slide:3, gor:"Gå runt. Hjälp elever som fastnar att börja med: ”Jag blir … när … och jag behöver …” Uppmuntra dem att lyssna färdigt innan de svarar.", manus:["Nu övar ni två och två. Titta på korten på skärmen och välj ett. Ni spelar påhittade personer.","En av er säger vad den behöver med ett jag-budskap. Den andra lyssnar, säger tillbaka vad den hörde och frågar: ”Stämmer det?” Sedan söker ni en lösning tillsammans. Byt roller efteråt.","Du får också välja att vara den som lyssnar och ger tips. Ni har sju minuter, alltså ungefär tre och en halv minut var."]},
    {t:"Avslut", min:2, slide:4, manus:["Idag har vi övat på att lyssna, säga tillbaka vad vi hörde och söka en lösning. Konflikter hör till relationer och går att hantera.","Men om någon blir hotad, kontrollerad eller sårad gång på gång är det inte en konflikt man ska lösa på egen hand. Då ska en vuxen in.","Behöver du prata om något av det här finns elevhälsan och vuxna här på skolan."]}
  ],
  exempel:[["Nour och Elias","Elias ändrar planerna i sista minuten för tredje gången, och Nour blir stressad."],["Mika och Ines i projektgruppen","Ines gör inte sin del av ett gemensamt arbete, och Mika blir irriterad."],["Jo och Alex","Alex bryter ett löfte om att hjälpa till, och Jo drar sig undan."]],
  fragor:["Vad kan man göra när man inte kommer överens?","Hur kan man hitta en lösning som båda kan leva med?"],
  anpassningar:[["Mer stöd","Skriv upp meningsstarten på tavlan: ”Jag blir … när … och jag behöver …” och ”Om jag förstår dig rätt …”"],["Fördjupning","Koppla till gränser och samtycke, eller låt eleverna skriva en egen konflikt om påhittade personer och hur den kan lösas."],["Rollspel","Rollspelet görs i par. Elever som vill kan vara lyssnare, ge tips eller skriva dialogen."],["Språk","Förklara orden ömsesidighet, empati och jag-budskap vid behov."]],
  trygghet:["Alla får vara med, men ingen tvingas. Om något väcker starka känslor hos ett barn eller en elev: låt hen pausa, sitta nära en trygg vuxen eller lämna övningen i lugn och ro utan att behöva förklara sig, och prata gärna med hen efteråt.","Betona respekt för olika åsikter och synsätt, så att ingen blir utskämd. Stoppa kommentarer som skämmer ut någon, och påminn om att allt handlar om påhittade personer.","Ingen elev behöver berätta om egna relationer. Eleverna övar med påhittade personer.","Ämnet kan beröra elever som har konflikter hemma eller i en relation. Låt eleverna delta på sitt sätt och hoppa över det de vill.","Att lösa en konflikt genom att prata passar inte om någon blir hotad, kontrollerad eller utsatt för våld eller upprepade kränkningar. Då handlar det om att få stopp på det med vuxnas hjälp. Följ skolans rutiner och kontakta elevhälsan.","Om en elev blir upprörd: pausa och ge eleven möjlighet att lämna övningen i lugn och ro.","Övningen är inte terapi. Lärare förväntas inte bedöma eller bearbeta enskilda elevers relationer."],
  avslut:"Avsluta med att konflikter hör till relationer och går att hantera genom att lyssna och söka en lösning, att man ska söka hjälp av en vuxen om någon hotas eller kontrolleras, och att elevhälsan finns om något är svårt.",
  slides:[
    `<div class="slide"><h2 class="big">Lyssna och sök en lösning</h2><p>Del 2: att hantera en konflikt</p><p class="tagline">16–19 år · Förstå andra människor</p></div>`,
    `<div class="slide"><h2>Kom ihåg från förra gången</h2><div class="two"><div class="panel b"><h3>Empati</h3><p>Att förstå hur någon annan har det, utan att hålla med om allt eller ta över den andres känslor eller problem.</p></div><div class="panel a"><h3>Jag-budskap</h3><p>Jag känner … när … och jag behöver …</p></div></div></div>`,
    `<div class="slide"><h2>Lyssna och söka en lösning</h2>${nsteps(["Låt den andra prata klart.","Säg tillbaka vad du hörde och fråga: ”Stämmer det?”","Säg vad du själv behöver.","Hitta en lösning som ni båda kan leva med."])}</div>`,
    `<div class="slide"><h2>Öva två och två</h2><div class="three-col"><div class="bubble"><small>Kort A</small>Någon i gruppen gör inte sin del av ett gemensamt arbete.</div><div class="bubble"><small>Kort B</small>En kompis ändrar planerna sent, igen.</div><div class="bubble"><small>Kort C</small>En kompis svarar inte på dina meddelanden på flera dagar.</div></div><p style="margin-top:2cqw">En säger vad den behöver. Den andra lyssnar och säger tillbaka. Sök en lösning. Byt sedan.</p></div>`,
    `<div class="slide"><h2 class="big">Konflikter hör till relationer.</h2><p>De går att hantera: lyssna, säg vad du behöver och sök en lösning.</p><p class="tagline">Stöd finns: elevhälsan och vuxna på skolan.</p></div>`
  ]};

const STOPP = `<svg viewBox="0 0 200 200" role="img" aria-label="En stoppskylt med texten STOPP"><polygon points="62,10 138,10 190,62 190,138 138,190 62,190 10,138 10,62" fill="#C8846B" stroke="#F7F4EE" stroke-width="8" stroke-linejoin="round"/><text x="100" y="116" text-anchor="middle" font-family="Instrument Sans,Segoe UI,sans-serif" font-weight="700" font-size="44" fill="#F7F4EE">STOPP</text></svg>`;
const SMITTA = `<svg viewBox="0 0 640 300" role="img" aria-label="Två cirklar som överlappar: min känsla, hens känsla och mitt emellan att känslor kan smitta"><circle cx="240" cy="150" r="110" fill="#A9C5CF" fill-opacity=".9"/><circle cx="400" cy="150" r="110" fill="#B7A9C8" fill-opacity=".9"/><g font-family="Instrument Sans,Segoe UI,sans-serif" font-weight="700" font-size="26" fill="#25332c" text-anchor="middle"><text x="190" y="158">Min känsla</text><text x="450" y="158">Hens känsla</text><text x="320" y="140" font-size="21">Känslor</text><text x="320" y="168" font-size="21">kan smitta</text></g></svg>`;
