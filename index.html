/* klassrumsbilder för verktyg: id på formen v{index}{y|a} */
function andningSlide(ver, antal){
  const y = ver==="y", k = y ? "ba" : "bb", inn = y ? 3 : 4, ut = y ? 5 : 6, cyc = inn + ut;
  const standard = y ? 7 : 6, n = antal || standard;
  const ord = ["ett","två","tre","fyra","fem","sex"];
  const kw = k==="ba" ? "numA 8s" : "numB 10s";
  const tal = (start, cnt) => Array.from({length:cnt}, (_,i) => `<span class="num" style="animation:${kw} linear ${start+i}s ${n}">${i+1}</span>`).join("");
  const andetag = Array.from({length:n}, (_,i) => `<span style="animation:cnt ${cyc}s linear ${i*cyc}s 1">Andetag ${i+1} av ${n}</span>`).join("");
  const itr = `animation-iteration-count:${n}`;
  const lopande = n===standard ? `${n} andetag, ungefär en minut.` : `${n} andetag.`;
  return `<div class="slide"><div class="body-slide"><div><h2>Andas med mig</h2><p class="note">Lägg en hand på magen. Den ska gå ut när du andas in.</p><p class="note">Räkna in: ${ord.slice(0,inn).join(", ")}. Räkna ut: ${ord.slice(0,ut).join(", ")}. Utandningen är bromsen.</p><p class="note">${lopande}</p></div><div class="brwrap"><div class="brc ${k}" style="${itr}"></div><div class="brt ${k}"><span class="in" style="${itr}">Andas in</span><span class="out" style="${itr}">Andas ut</span></div><div class="brnum">${tal(0,inn)}${tal(inn,ut)}</div><div class="brcount">${andetag}<span class="klar" style="animation:okfade .6s ease ${n*cyc}s 1 forwards">Klart. Bra jobbat!</span></div></div></div></div>`;
}
function gasSlide(){
  return `<div class="slide"><div class="body-slide"><div><h2>Gasen</h2><p class="note">Ta tre snabba, små andetag och märk hur kroppen känns.</p><p class="note">Det räcker med tre.</p></div><div class="brwrap"><div class="brc fast"></div><div class="brt"><span style="opacity:1">Gas: snabbt</span></div></div></div></div>`;
}
function verktygSlides(v, ver){
  const steg = ver==="y" ? v.sy : v.sa, ut = [];
  ut.push(`<div class="slide"><h2 class="big">${v.n}</h2><p>${v.typ}, ${v.tid}</p><p class="tagline">Verktyg · ${ver==="y"?"3–8 år":"9–19 år"}</p></div>`);
  const nasta = v.andning ? `<p class="tagline">I nästa bild kommer övningen.</p>` : "";
  if(steg.length>4){
    ut.push(`<div class="slide"><h2>Så gör vi (1/2)</h2>${nsteps(steg.slice(0,3))}</div>`);
    ut.push(`<div class="slide"><h2>Så gör vi (2/2)</h2>${nsteps(steg.slice(3))}${nasta}</div>`);
  } else {
    ut.push(`<div class="slide"><h2>Så gör vi</h2>${nsteps(steg)}${nasta}</div>`);
  }
  if(v.gas) ut.push(gasSlide());
  if(v.andning) ut.push(andningSlide(ver));
  ut.push(`<div class="slide"><h2>Hur kändes det?</h2><p>Märk vad som hände i kroppen.</p><p>Du kan använda verktyget när det blir mycket.</p></div>`);
  return ut;
}
function klassData(id){
  if(typeof id === "string"){
    const i = Number(id.slice(1,-1)), ver = id.slice(-1), v = VERKTYG[i] || VERKTYG[0];
    return {titel:v.n, exit:"verktyg", slides:verktygSlides(v, ver)};
  }
  const e = EX[id] || EX[7];
  return {titel:e.titel, exit:"ovning"+e.n, slides:e.slides};
}

    <h2>När är det mer än vanligt?</h2>
    <p>Alla mår dåligt ibland. Det kan vara mer än vanligt om det håller i sig i flera veckor, påverkar sömn, skolgång eller kompisar, eller om eleven drar sig undan eller verkar mycket orolig eller nedstämd. Du ska inte ställa någon diagnos. Lyssna och kontakta elevhälsan enligt skolans rutiner. Om skolan bestämmer det tar ni kontakt med vårdnadshavare.</p>

    <h2>Om en elev berättar att hen mår mycket dåligt eller inte vill leva</h2>
    <ol class="breathsteps">
      <li><strong>Lyssna lugnt och ta det på allvar.</strong> Du behöver inte lösa det.</li>
      <li><strong>Lämna inte eleven ensam.</strong></li>
      <li><strong>Lova inte att hålla det hemligt.</strong> Säg att du behöver hjälp av fler för att eleven ska få stöd.</li>
      <li><strong>Kontakta elevhälsan och rektor direkt,</strong> samma dag, och följ skolans rutiner.</li>
      <li><strong>Vid akut fara: ring 112.</strong></li>
      <li><strong>Prata inte om hur man kan skada sig.</strong> Fokusera på att eleven blir hörd och får hjälp.</li>
      <li>Du kan ringa Mind Självmordslinjen på 90101 för råd, även om du är orolig för någon annan.</li>
    </ol>

    <h2>Kränkningar</h2>
    <p>Om en elev berättar om kränkningar eller mobbning: lyssna lugnt, lova inte att hålla det hemligt och följ skolans plan mot kränkande behandling. Kontakta elevhälsan och rektor. Skolpersonal har en anmälningsplikt till socialtjänsten om det finns oro för att ett barn far illa. Fråga elevhälsan eller rektor hur det går till på din skola.</p>

    <h2>Här kan elever och familjer få hjälp</h2>
    <ul class="hjalp">${hjalp.map(h=>`<li><strong>${h[0]}.</strong> ${h[1]}${h[2]?` <a href="${h[2]}" target="_blank" rel="noopener">Öppna webbplatsen</a>`:""}</li>`).join("")}</ul>
    <p>Kontrollera aktuella nummer och öppettider på respektive webbplats. Uppgifterna kan ändras.</p>

    <h2>Ta hand om dig själv</h2>
    <p>Det kan vara tungt att ta emot svåra berättelser. Prata med en kollega eller elevhälsan. Du behöver inte bära det ensam.</p>
  </div>`;
}

      <h1>Human Basics: information till dig som är vårdnadshavare</h1>
      <p class="ingress">Barn lär sig läsa, räkna och forska. De borde också få lära sig att förstå sig själva. Human Basics är ett material för skolan om känslor, kroppen, att lugna sig, att förstå andra, gränser, ansvar, tankar och vardagsvanor.</p>

      <h2>Vad barnen får lära sig</h2>
      <ul>
        <li>Att alla känslor är okej, men inte alla handlingar.</li>
        <li>Att kroppen berättar hur vi mår, till exempel att hjärtat slår fort när vi är rädda eller arga.</li>
        <li>Verktyg för att hjälpa kroppen att landa, som att andas långsamt, röra på sig, ta en paus eller prata med någon.</li>
        <li>Att förstå hur andra har det, och att sätta gränser och ta ansvar.</li>
        <li>Att tankar inte alltid är sanna, och att sömn, rörelse, mat och vila påverkar hur vi mår.</li>
      </ul>

      <h2>Så kan du stötta hemma</h2>
      <ul>
        <li>Lyssna utan att direkt lösa eller rätta. Du kan säga: ”Det låter som att det var jobbigt.”</li>
        <li>Hjälp barnet att sätta ord på känslor, och fråga: ”Vad hjälper dig?” innan du ger råd.</li>
        <li>Prata om kroppen: hjärtat som slår fort, magen som knyter sig.</li>
        <li>Ha trygga rutiner för sömn, mat, rörelse och skärm.</li>

        <div><h3>13–19 år</h3><p>Fråga öppet och lyssna. Respektera behovet av egen tid men finns kvar. Ta samtalet vid sidan av något annat, som en promenad.</p></div>
      </div>

      <h2>Så arbetar vi</h2>

        <li>Vi samlar inte in några personuppgifter.</li>

function pVerktyg(){
  return `<div class="wrap t-page">
    ${tTitle("Verktygslåda","Små verktyg som eleverna kan använda när det blir mycket. De yngre får lekfulla versioner, och äldre elever får diskreta versioner som ingen märker. Varje verktyg finns också som bildspel i klassrumsläget.")}
    <div class="btn-row" style="margin:-.4rem 0 1.4rem"><a class="btn" href="#verktygskort">Skriv ut verktygskort</a></div>
    <div class="callout" style="margin-bottom:1.4rem"><p><strong>Så används verktygen.</strong> Förberedelse: läs det verktyg du ska använda och prova det själv en gång, cirka 3–5 minuter. Ett av veckans tre pass är ett verktygspass med ett verktyg ur lådan. Verktygen kan också avsluta en övning, eller vara något eleverna väljer själva när det blir mycket. Alla får vara med, men ingen tvingas. Den som börjar med Human Basics som tonåring får samma verktyg i en diskret version och behöver inte skaka framför hela klassen.</p></div>
    <div class="callout" style="margin-bottom:1.6rem"><p><strong>Vad forskningen säger.</strong> Vi har tittat på forskningen för varje verktyg och lyft fram det positiva och lovande under varje verktyg. Verktygen är ett stöd i vardagen, och inget verktyg är behandling. Vi påstår inte mer än studierna visar.</p></div>

    <h2>Gas och broms: förstå andningen</h2>
    <p>Andningen är en av få saker i kroppen som både sker av sig själv och som vi kan påverka. När vi är stressade andas vi ofta snabbare, och det är som att trycka på gasen: kroppen blir redo att agera. En långsam andning med längre utandning är som att trycka på bromsen. Hjärtat slår lite långsammare när vi andas ut, och kroppen kan varva ner.</p>
    <figure class="figure-card" style="margin:1.2rem 0 1.6rem"><div class="scroll"><svg class="gb" viewBox="0 0 640 250" role="img" aria-labelledby="gbt gbd"><title id="gbt">Gas och broms: två sätt att andas</title><desc id="gbd">Till vänster en tät, hackig linje som visar snabb och grund andning, kallad gasen. Till höger en mjuk våg där utandningen är dubbelt så lång som inandningen, kallad bromsen.</desc>
<text x="160" y="30" text-anchor="middle" font-size="22" style="fill:#C8846B">Gasen</text>
<text x="160" y="52" text-anchor="middle" font-size="15">Snabb, grund andning</text>
<path d="M30 170l16-60 16 60 16-60 16 60 16-60 16 60 16-60 16 60 16-60 16 60 16-60 16 60 16-60 16 60 16-60 16 60" fill="none" stroke="#C8846B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="160" y="215" text-anchor="middle" font-size="15">Kroppen blir redo att agera</text>
<line x1="320" y1="70" x2="320" y2="230" stroke="var(--line)" stroke-width="2"/>
<text x="480" y="30" text-anchor="middle" font-size="22" style="fill:#5b8190">Bromsen</text>
<text x="480" y="52" text-anchor="middle" font-size="15">Långsam andning, lång utandning</text>
<path d="M350 170Q370 110 390 110Q430 110 470 170Q490 110 510 110Q550 110 590 170" fill="none" stroke="#5b8190" stroke-width="5" stroke-linecap="round"/>
<text x="372" y="192" text-anchor="middle" font-size="14">in</text><text x="430" y="192" text-anchor="middle" font-size="14">ut, längre</text>
<text x="480" y="215" text-anchor="middle" font-size="15">Kroppen kan varva ner</text></svg></div>
<figcaption class="cap">Liknelsen om gas och broms. Det som har starkast stöd är att långsam andning hjälper kroppen att anpassa sig mjukt. Längre utandning har också visat fördelar i flera studier på vuxna.</figcaption></figure>
    <p>Liknelsen hjälper att förstå, och den stämmer med hur hjärtat följer andningen. Det som har starkast stöd är att andas långsamt, ungefär fem till sex andetag per minut. Flera studier på vuxna har också sett fördelar med att utandningen är lite längre än inandningen. Forskningen är främst gjord på vuxna och fortsätter, även för barn.</p>
    <h3 style="margin-top:1.8rem">Så andas du, steg för steg</h3>
    <ol class="breathsteps">
      <li><strong>Sitt bekvämt.</strong> Fötterna i golvet, ryggen lätt stödd och axlarna nere. Lägg ena handen på magen och den andra på bröstet.</li>
      <li><strong>Andas in genom näsan.</strong> Låt luften gå djupt ner i magen, som när du blåser upp en ballong. Handen på magen ska gå ut, och handen på bröstet rör sig bara lite.</li>
      <li><strong>Räkna in.</strong> Räkna långsamt, ungefär ett tal per sekund: ”ett, två, tre, fyra”. För yngre barn räcker det att räkna till tre.</li>
      <li><strong>Andas ut långsamt.</strong> Genom näsan eller munnen, som om du blåser mjukt på ett ljus. Magen går in igen.</li>
      <li><strong>Räkna ut.</strong> Räkna lite längre än in: ”ett, två, tre, fyra, fem, sex”. För yngre barn räcker det att räkna till fem.</li>
      <li><strong>Upprepa.</strong> Gör sex andetag, ungefär en minut (sju för yngre barn, också ungefär en minut), och märk om kroppen blir lugnare.</li>
    </ol>
    <h4 style="margin-top:1.2rem">Så kan det se ut</h4>
    <div class="tscroll"><table class="btable">
      <thead><tr><th scope="col">Andetag</th><th scope="col">In genom näsan (magen går ut)</th><th scope="col">Ut långsamt (magen går in)</th></tr></thead>
      <tbody>
        <tr><td>9–19 år, andetag 1–6</td><td>ett, två, tre, fyra</td><td>ett, två, tre, fyra, fem, sex</td></tr>
        <tr><td>3–8 år, andetag 1–7</td><td>ett, två, tre</td><td>ett, två, tre, fyra, fem</td></tr>
      </tbody>
    </table></div>
    <p style="margin-top:1rem">Ett andetag med fyra in och sex ut tar ungefär tio sekunder, så sex andetag tar ungefär en minut. För yngre barn är tre in och fem ut en lagom nivå som tar ungefär åtta sekunder, så sju andetag blir ungefär en minut. Tre in och fem ut är vår anpassning för barn och inget som studierna har undersökt. Barn kan göra färre andetag om det känns långt.</p>
    <ul class="breathsteps">
      <li>Det ska aldrig kännas som en ansträngning. Håll inte andan, och tvinga inte fram djupa andetag.</li>
      <li>Blir du yr eller känns det obehagligt: andas som vanligt och sluta. Det är alltid okej att bara titta på.</li>
      <li>Om tal till fyra och sex är för långa kan du ta kortare, till exempel tre in och fyra ut. Det viktiga är att utandningen blir lite längre än inandningen.</li>
      <li>Om det är svårt att känna magen: ligg på rygg med ett gosedjur eller en bok på magen och se den gå upp när du andas in och ner när du andas ut.</li>
    </ul>
    <div class="callout" style="margin:1rem 0 2rem"><p><strong>Så hänger det ihop med kroppens reaktioner.</strong> Från att kämpa eller fly till lugn: använd bromsen, alltså långsam andning med lång utandning. Från att stelna till återhämtning: gå inte rakt på djup andning. Börja med små rörelser och sinnen, och lägg till andningen sist. Snabb andning är aldrig en övning, bara en demonstration på högst tre andetag. Det här är vår vägledning för att välja verktyg.</p></div>

    <h2>Kroppens tre reaktioner</h2>
    <p>Under stress reagerar kroppen automatiskt på något av tre sätt: att kämpa, fly eller stelna (på engelska fight, flight och freeze). Att känna igen vilken reaktion man har gör det lättare att välja ett verktyg som passar. Forskare beskriver att människor under stress ofta faller tillbaka på just de här tre reaktionerna, och att det är viktigt att kunna växla mellan att stå stilla och att agera (Roelofs, 2017). Vilka verktyg som passar till vilken reaktion är vår vägledning för att välja verktyg, och den kan med tiden prövas i forskning.</p>
    <ul class="three" style="margin-bottom:2rem">
      <li><div class="layer" style="--c:var(--terra)"><span class="tag">Kämpa</span><h3>Arg, spänd, redo att försvara sig</h3><p>Verktyg som kan passa: andas långsamt med lång utandning (bromsen), rör på dig och ta en paus.</p></div></li>
      <li><div class="layer" style="--c:var(--himmel)"><span class="tag">Fly</span><h3>Vill därifrån, undvika eller dra sig undan</h3><p>Verktyg som kan passa: andas långsamt, ta en paus med en plan för att komma tillbaka, prata med någon trygg och sätt ord på känslan.</p></div></li>
      <li><div class="layer" style="--c:var(--lav)"><span class="tag">Stelna</span><h3>Stilla, tom eller tyst</h3><p>Verktyg som kan passa: från stelhet till rörelse (små rörelser först), sätt ord på känslan (ett enda ord räcker) och prata med någon trygg.</p></div></li>
    </ul>

    <ul class="tools">${VERKTYG.map((v,i)=>`<li class="tool"><header><h3>${v.n}</h3><span class="badge">${v.typ}</span><span class="badge">${v.tid}</span></header>
      <div class="vers"><div><h4>För yngre (3–8 år)</h4><p>${v.yngre}</p></div><div><h4>Diskret version (9–19 år)</h4><p>${v.aldre}</p></div></div>
      <div class="stod"><h4>Det forskningen säger</h4><p>${v.stod}</p></div>
      <div class="tank"><h4>Att tänka på</h4><p>${v.tank}</p></div>
      <div class="tool-actions"><button type="button" class="btn sm" data-act="klass" data-ex="v${i}y" data-s="0" data-key="vk-${i}y">Klassrumsläge för 3–8 år</button><button type="button" class="btn ghost sm" data-act="klass" data-ex="v${i}a" data-s="0" data-key="vk-${i}a">Klassrumsläge för 9–19 år</button></div></li>`).join("")}</ul>
    <h2 style="margin-top:2.4rem">Källor</h2>
    <p>Sammanställningen bygger på sammanfattningar och abstracts, inte på genomläsning av hela artiklarna. Sakkunniga bör kontrollera den innan den används utåt.</p>
    <ul class="refs">${VERKTYG_KALLOR.map(r=>`<li>${r[0]} <a href="${r[1]}" target="_blank" rel="noopener">Öppna källan</a></li>`).join("")}</ul>

  if(act==="gotogrund"){ state.niva = Number(b.dataset.n); go("grund"); return; }
  if(act==="gotoovn"){ state.fNiva = Number(b.dataset.n); state.fOmr = b.dataset.o || ""; go("ovningar"); return; }
  if(act==="klass"){ state.ex = b.dataset.ex ? (/^\d+$/.test(b.dataset.ex) ? Number(b.dataset.ex) : b.dataset.ex) : 7; state.slide = Number(b.dataset.s||0); go("klassrum"); return; }
  if(act==="print"){ try{ window.print(); }catch(err){} return; }
  if(act==="niva") state.niva = Number(b.dataset.n);
  if(act==="fniva") state.fNiva = Number(b.dataset.n);
  if(act==="mode") state.mode = b.dataset.m;
  if(act==="steg") state.steg = Number(b.dataset.i);
  if(act==="kortver") state.kortVer = b.dataset.v;
  if(act==="mex") state.mex = Number(b.dataset.i);
  if(act==="clearf"){ state.fNiva = 0; state.fOmr = ""; }
  if(act==="area"){ const id=b.dataset.id; state.openAreas.has(id) ? state.openAreas.delete(id) : state.openAreas.add(id); }
  if(act==="prev" && state.slide>0) state.slide--;
  if(act==="next" && state.slide<klassData(state.ex).slides.length-1) state.slide++;
  const y = window.scrollY;
  render(true);
  window.scrollTo(0,y);
  let again = key && app.querySelector(`[data-key="${key}"]`);
  if(again && again.disabled){ again = app.querySelector(act==="prev" ? '[data-key="knext"]' : '[data-key="kprev"]'); }
  if(again) again.focus({preventScroll:true});
});
app.addEventListener("change", e=>{
  if(e.target.id==="fOmr"){ state.fOmr = e.target.value; const y=window.scrollY; render(true); window.scrollTo(0,y); const s=document.getElementById("fOmr"); if(s) s.focus({preventScroll:true}); }
});
document.addEventListener("keydown", e=>{
  if(currentPage()==="klassrum"){
    if(e.key==="ArrowRight" && state.slide<klassData(state.ex).slides.length-1){ state.slide++; render(true); }
    if(e.key==="ArrowLeft" && state.slide>0){ state.slide--; render(true); }
    if(e.key==="Escape"){ go(klassData(state.ex).exit); }
  } else if(e.key==="Escape"){
    const nav = document.getElementById("nav"); const mb = document.getElementById("menuBtn");
    if(nav && nav.classList.contains("open")){ nav.classList.remove("open"); mb.setAttribute("aria-expanded","false"); mb.focus(); }
  }
});
render(true);

</script>
</body>
</html>
