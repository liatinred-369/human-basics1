const SKYDD = "Övningen är inte terapi. Lärare förväntas inte bedöma eller bearbeta enskilda elevers upplevelser.";

EX[3] = {n:3, niva:1, titel:"Stopp, jag vill inte!", omr:"granser", tagline:"3–5 år · Snäll betyder inte gränslös",
  ingress:"Övning för förskolan om att kroppen är ens egen, att få säga stopp och att trygga vuxna lyssnar.",
  syfte:["Barnen får veta att kroppen är deras egen, att de får säga ”Stopp!” och ”Jag vill inte”, att andra ska sluta när någon säger stopp, och att de kan gå till en trygg vuxen om någon inte lyssnar."],
  intro:"Övningen leds av pedagogen med två handdockor, Mimmi och Nisse. Håll tonen lugn, trygg och lekfull. Övningen handlar om att få säga stopp och att bli lyssnad på, och den berättar ingenting läskigt. Ingen behöver prata, och barn kan visa med handen eller kroppen.",
  material:["Skärm eller projektor för klassrumsläget.","Handdockorna Mimmi och Nisse, eller två gosedjur.","Inget annat behövs."],
  steg:[
    {t:"Välkommen", min:1, slide:0, gor:"Sätt dig i barnens höjd. Låt Mimmi vinka.", manus:["Hej allihop! Idag ska vi prata om att kroppen är din egen, och om att säga ”Stopp!”","Mimmi och Nisse hjälper oss."]},
    {t:"Min kropp är min", min:2, slide:1, manus:["Din kropp är din egen. Du bestämmer över den.","Du får säga ”Stopp!” och ”Jag vill inte” om något inte känns bra, till exempel om någon vill krama dig fast du inte vill.","Det gäller alla barn. Alla får säga stopp."]},
    {t:"Vi övar att säga stopp", min:3, slide:2, gor:"Låt barnen prova tillsammans i gruppen. Ingen behöver göra det ensam. Håll det lekfullt, inte allvarligt.", manus:["Nu övar vi. Vi säger ”Stopp!” med stark röst och visar stopp-handen: handen rakt framför oss, så här. Prova!","Bra! Nu säger vi ”Jag vill inte!”","Du får säga det högt, eller viska, eller bara visa med handen. Alla sätt är bra."]},
    {t:"När någon säger stopp", min:3, slide:3, manus:["Mimmi leker med Nisse. Nisse säger: ”Stopp!” Vad ska Mimmi göra? Ja, Mimmi ska sluta direkt. När någon säger stopp stannar vi.","Och om någon inte lyssnar när du säger stopp? Då går du till en trygg vuxen och berättar. Vuxna hjälper till."]},
    {t:"Trygga vuxna", min:2, slide:4, manus:["Vem är en trygg vuxen? Det kan vara någon här hos oss, eller någon hemma. Titta på en trygg vuxen här i rummet och peka om du vill.","Trygga vuxna lyssnar och hjälper till."]},
    {t:"Avslut", min:1, slide:5, manus:["Bra jobbat! Nu vet vi att kroppen är vår egen. Vi får säga stopp. Alla ska lyssna när någon säger stopp. Och vi kan gå till en trygg vuxen.","Nu säger vi ett sista STOPP tillsammans, och sedan skakar vi loss händerna!"]}
  ],
  exempel:[["Mimmi och Nisse","Nisse säger stopp när Mimmi leker för vilt, och Mimmi slutar direkt."],["Mimmi vill inte bli kramad","Mimmi säger ”Jag vill inte krama nu”, och Nisse nickar och frågar om de kan vinka i stället."],["Någon tar Mimmis leksak","Mimmi säger ”Stopp, den är min!” och går till en trygg vuxen när Nisse inte lyssnar."]],
  fragor:["När får man säga stopp?","Vad gör vi när någon säger stopp?","Vem kan man gå till?"],
  anpassningar:[["Tecken och bilder","Använd gärna tecken som stöd (TAKK) för stopp. Barn som inte talar kan visa stopp-handen."],["Mindre grupp","Dela barngruppen i två om den är stor."],["Röst","Barn kan säga stopp högt, viska eller bara visa med handen."],["Korta stunder","Dela övningen i två tillfällen om barnen blir rastlösa."]],
  trygghet:["Alla får vara med, men ingen tvingas. Om något väcker starka känslor hos ett barn eller en elev: låt hen pausa, sitta nära en trygg vuxen eller lämna övningen i lugn och ro utan att behöva förklara sig, och prata gärna med hen efteråt.","Betona respekt för olika åsikter och synsätt, så att ingen blir utskämd. Stoppa kommentarer som skämmer ut någon, och påminn om att allt handlar om påhittade personer.","Inget barn behöver berätta något om sig själv.","Övningen handlar om att få säga stopp och att trygga vuxna lyssnar, och den ska aldrig göra barn rädda.","Om ett barn berättar att någon har gjort något som känns fel eller farligt: lyssna lugnt, lova inte att hålla det hemligt och följ förskolans rutiner. Kontakta ansvarig, till exempel rektor eller elevhälsa. Personal har skyldighet att agera vid oro för att ett barn far illa.",SKYDD],
  avslut:"Avsluta med att kroppen är barnets egen, att alla får säga stopp, att alla ska lyssna när någon säger stopp, och att man kan gå till en trygg vuxen.",
  slides:[
    `<div class="slide"><div class="face-slide"><div class="fbig">${STOPP}</div><div><h2 class="giant">Stopp, jag vill inte!</h2><p>Din kropp är din egen.</p></div></div></div>`,
    `<div class="slide"><h2 class="big">Min kropp är min.</h2><p>Jag bestämmer över den. Jag får säga stopp.</p></div>`,
    `<div class="slide"><div class="face-slide"><div class="fbig">${STOPP}</div><div><h2 class="giant">Stopp!</h2><p>Jag vill inte.</p><p>Säg det högt, viska eller visa med handen.</p></div></div></div>`,
    `<div class="slide"><h2>När någon säger stopp, stannar vi.</h2><div class="flow"><span class="schip on">Någon säger stopp</span><i>→</i><span class="schip">Vi slutar direkt</span></div></div>`,
    `<div class="slide"><h2>Om någon inte lyssnar</h2><div class="chips6"><span class="schip">Gå till en trygg vuxen</span><span class="schip">Berätta</span><span class="schip">Be om hjälp</span></div><p style="margin-top:2.4cqw">Trygga vuxna lyssnar och hjälper till.</p></div>`,
    `<div class="slide"><h2 class="big">Bra jobbat!</h2><div class="faces">${["glad","stolt"].map(faceCard).join("")}</div></div>`
  ]};

EX[5] = {n:5, niva:2, titel:"Min egen lugna verktygslåda.", omr:"lugn", tagline:"6–8 år · Hitta tillbaka till lugnet",
  ingress:"Övning för förskoleklass till årskurs 2 om att först våga känna och sedan välja ett verktyg som hjälper kroppen att bli lugn.",
  syfte:["Eleverna får höra att man först vågar känna en känsla och inte gömmer den, och att man sedan kan hjälpa kroppen att bli lugn. De provar fyra enkla verktyg och väljer ett som de tror passar dem."],
  intro:"Övningen använder fyra verktyg ur verktygslådan i lekfulla versioner. Allt är frivilligt, och eleverna får titta på. Rörelsen är en lekfull rörelse och ingen behandling. Eleverna väljer själva vilket verktyg som passar, och du behöver inte bedöma valet.",
  material:["Skärm eller projektor för klassrumsläget.","Valfritt: papper och pennor om eleverna vill rita sitt verktyg.","Inga personuppgifter eller tester behövs."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag ska vi bygga en egen lugn verktygslåda.","Verktyg hjälper kroppen att bli lugn när det känns mycket."]},
    {t:"Först får vi känna", min:3, slide:1, manus:["Först får vi känna. Vi gömmer inte känslor, för känslor som vi gömmer försvinner inte.","Titta på korten. Vilken känsla kan finnas här idag? Peka på en. Du behöver inte säga varför.","När vi har känt efter kan vi hjälpa kroppen att bli lugn."]},
    {t:"Fyra verktyg", min:6, slide:2, slideTo:5, gor:"Låt barnen prova varje verktyg i ungefär en minut. Allt är frivilligt, och ingen behöver göra. Skakandet är en lekfull rörelse och ingen behandling.", manus:["Verktyg ett är ballongandning. Andas in genom näsan så att magen blir stor som en ballong, och ut långsamt. Vi gör tre andetag tillsammans. Du får också titta på.","Verktyg två är att röra på sig. Skaka händerna och hoppa lite i tio sekunder. Sedan står vi stilla och känner efter.","Verktyg tre är en lugn plats. Vi blundar eller tittar på en bild i en halv minut och låter kroppen vila.","Verktyg fyra är att prata med en trygg vuxen och säga: ”Det känns svårt.”"]},
    {t:"Min verktygslåda", min:3, slide:6, gor:"Låt barnen rita sitt verktyg om de vill. Rätta inte valet.", manus:["Nu får du välja det verktyg som du tror passar dig bäst. Det är ditt verktyg.","Du kan rita det på ett papper, eller bara peka på det på skärmen."]},
    {t:"Avslut", min:2, slide:7, manus:["Idag har vi sett att alla känslor får finnas, och att vi har verktyg som hjälper kroppen att bli lugn.","Om det känns svårt kan du alltid gå till en trygg vuxen. Bra jobbat!"]}
  ],
  exempel:[["Lo och ballongen","Lo blir arg och andas som en ballong tre gånger innan hon svarar."],["Ali och den lugna platsen","Ali blir ledsen och går till den lugna platsen en stund."],["Maja och den trygga vuxna","Maja blir orolig och säger till en vuxen: ”Det känns svårt.”"]],
  fragor:["Vilket verktyg tror du passar dig?","Vad kan man göra när man är arg?","Vem är en trygg vuxen?"],
  anpassningar:[["Bildstöd","Använd bilderna på verktygen och låt eleverna peka."],["Frivillighet","Elever kan titta på, göra en mindre rörelse eller välja ett annat verktyg."],["Mindre grupper","Dela klassen i halvgrupper vid behov."],["Korta stunder","Dela övningen i två tillfällen om eleverna blir rastlösa."]],
  trygghet:["Alla får vara med, men ingen tvingas. Om något väcker starka känslor hos ett barn eller en elev: låt hen pausa, sitta nära en trygg vuxen eller lämna övningen i lugn och ro utan att behöva förklara sig, och prata gärna med hen efteråt.","Betona respekt för olika åsikter och synsätt, så att ingen blir utskämd. Stoppa kommentarer som skämmer ut någon, och påminn om att allt handlar om påhittade personer.","Ingen elev behöver berätta något om sig själv.","Andnings- och rörelseövningar är alltid frivilliga. Vissa elever kan tycka att andning känns obehagligt. Erbjud då att titta på eller välja ett annat verktyg.","Låt elever som blir ledsna eller oroliga sitta nära en trygg vuxen eller ta en paus.","Om en elev berättar något som väcker oro: följ skolans rutiner och kontakta elevhälsan.",SKYDD],
  avslut:"Avsluta med att alla känslor får finnas, att man först vågar känna, att det finns verktyg som hjälper kroppen att bli lugn, och att man kan gå till en trygg vuxen.",
  slides:[
    `<div class="slide"><h2 class="big">Min egen lugna verktygslåda</h2><p>Verktyg som hjälper kroppen att bli lugn</p></div>`,
    `<div class="slide"><h2>Först får vi känna</h2><div class="faces small">${["glad","ledsen","arg","radd"].map(faceCard).join("")}</div><p style="margin-top:2cqw">Vilken känsla kan finnas här idag? Vi gömmer inte känslor. Vi säger vad vi känner.</p></div>`,
    andningSlide("y",3),
    verktygSlide(2,"Röra på sig","Skaka händerna och hoppa lite i tio sekunder. Stå sedan stilla och känn efter."),
    verktygSlide(3,"Lugn plats","Blunda eller titta på en bild en liten stund. Låt kroppen vila."),
    verktygSlide(4,"Prata med en trygg vuxen","Gå till en trygg vuxen och säg: ”Det känns svårt.”"),
    `<div class="slide"><h2>Min verktygslåda</h2><div class="chips6"><span class="schip">Ballongandning</span><span class="schip">Röra på sig</span><span class="schip">Lugn plats</span><span class="schip">Trygg vuxen</span></div><p style="margin-top:2.4cqw">Vilket verktyg vill du ha i din låda?</p></div>`,
    `<div class="slide"><h2 class="big">Alla känslor får finnas.</h2><p>Och vi har verktyg som hjälper.</p><div class="faces small">${["glad","stolt"].map(faceCard).join("")}</div></div>`
  ]};

EX[9] = {n:9, niva:3, titel:"Vems ansvar är det?", omr:"ansvar", tagline:"9–10 år · Misstag, ansvar och att göra rätt igen",
  ingress:"Övning för årskurs 3–4 om att ta ansvar för det man gör, inte för allt andra gör, och att laga genom att göra något.",
  syfte:["Eleverna får se att vi ansvarar för det vi gör och inte för allt andra gör, och att ett förlåt blir starkare när man också gör något för att laga. De får också höra att man inte är en dålig människa för att man gör fel."],
  intro:"Övningen utgår från tre påhittade personer, Sam, Noor och Elias. Eleverna sorterar vems ansvar som är vems. Det finns inget enda rätt svar på allt, och poängen är att skilja på sitt eget och andras ansvar. Ingen behöver berätta något om sig själv.",
  material:["Skärm eller projektor för klassrumsläget.","Valfritt: papper och pennor.","Inga personuppgifter eller tester behövs."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om ansvar: vad man ansvarar för, och vad man inte ansvarar för.","Vi utgår från påhittade personer. Ingen behöver berätta något om sig själv. Kom ihåg att vi tycker och tänker olika, och att vi visar respekt för det så att ingen blir utskämd."]},
    {t:"Berättelsen om Sam, Noor och Elias", min:3, slide:1, gor:"Ta emot några korta svar. Peka inte ut vad någon själv har upplevt.", manus:["Lyssna på berättelsen. Sam springer in i klassrummet och råkar knuffa omkull Noors torn. Noor blir arg. Elias står bredvid och skrattar.","Vad hände? Vad tror ni att var och en känner?"]},
    {t:"Vems ansvar är vems?", min:5, slide:2, manus:["Titta på bilden. Sam gjorde något, och Sam ansvarar för det Sam gjorde och för att försöka laga det.","Noor är arg, och det är okej. Noors ansvar är vad Noor gör när hon är arg. Att slå är inte okej, men att säga ”Jag är arg!” är okej.","Elias skrattar. Det är Elias val, och Elias ansvarar för det.","Vi ansvarar för det vi gör, inte för allt andra gör. Sam ansvarar inte för att Elias skrattar."]},
    {t:"Ett förlåt som lagar", min:4, slide:3, manus:["Vad kan Sam göra? Ett förlåt är bra, men det blir bättre när man också gör något.","Fyra steg. Ett: säg vad du gjorde, till exempel ”Jag knuffade ditt torn.” Två: fråga vad du kan göra, ”Vad kan jag göra?” Tre: gör det, till exempel hjälp till att bygga upp tornet igen. Fyra: tänk på nästa gång och fråga dig: ”Vad behöver jag göra eller säga för att det inte ska hända igen?” Sam kan till exempel säga: ”Nästa gång stannar jag innan jag springer in.”","Och kom ihåg: man är inte en dålig människa för att man gör fel. Ansvar handlar om vad man gjorde, inte om vem man är."]},
    {t:"Sortera två och två", min:5, slide:4, gor:"Gå runt och lyssna. Hjälp grupper som fastnat med frågan: Vems val är det?", manus:["Nu pratar ni två och två. Titta på de tre korten på skärmen. Bestäm för varje kort: är det Sams ansvar, Noors ansvar, Elias ansvar eller allas?","Ni pratar om Sam, Noor och Elias. Ni behöver inte berätta något om er själva. Ni har tre minuter."]},
    {t:"Avslut", min:2, slide:5, manus:["Idag har vi sett att vi ansvarar för det vi gör, inte för allt andra gör, och att ett förlåt blir starkare när vi också gör något och tänker på nästa gång.","Man är inte en dålig människa för att man gör fel. Om något känns svårt kan du alltid prata med en trygg vuxen här på skolan."]}
  ],
  exempel:[["Sam, Noor och Elias","Sam råkar knuffa omkull Noors torn, Noor blir arg och Elias skrattar."],["Lo och bollen","Lo sparkar bollen så att den träffar en annan elev. Lo frågar om det gick bra och hjälper till att hämta den."],["Mika och teckningen","Mika råkar spilla på Jos teckning och erbjuder sig att rita en ny tillsammans."]],
  fragor:["Vad är skillnaden mellan att ta ansvar och att skämmas?","Vad kan man göra efter ett misstag?","Vems ansvar är det att Elias skrattar?"],
  anpassningar:[["Mer stöd","Använd bilderna som stöd och arbeta i mindre grupper."],["Fördjupning","Låt eleverna hitta på en egen berättelse om påhittade personer och sortera ansvaret."],["Muntligt","Elever kan peka eller prata i stället för att skriva."],["Språk","Skriv upp orden ansvar, laga, val och misstag."]],
  trygghet:["Alla får vara med, men ingen tvingas. Om något väcker starka känslor hos ett barn eller en elev: låt hen pausa, sitta nära en trygg vuxen eller lämna övningen i lugn och ro utan att behöva förklara sig, och prata gärna med hen efteråt.","Betona respekt för olika åsikter och synsätt, så att ingen blir utskämd. Stoppa kommentarer som skämmer ut någon, och påminn om att allt handlar om påhittade personer.","Ingen elev behöver berätta om något privat eller svårt inför gruppen.","Ämnet kan beröra elever som ofta får skulden eller skäms mycket. Betona att ansvar handlar om vad man gjorde och inte om vem man är.","Om en elev blir upprörd: pausa och ge eleven ro.","Om en elev berättar något som väcker oro: följ skolans rutiner och kontakta elevhälsan.",SKYDD],
  avslut:"Sammanfatta att vi ansvarar för det vi gör och inte för allt andra gör, att ett förlåt blir starkare med en handling och att man tänker på nästa gång, och att man inte är en dålig människa för att man gör fel.",
  slides:[
    `<div class="slide"><h2 class="big">Vems ansvar är det?</h2><p>Ansvar, misstag och att laga</p><p class="tagline">9–10 år · Misstag, ansvar och att göra rätt igen</p></div>`,
    `<div class="slide"><h2>Sam, Noor och Elias</h2><p>Sam springer in i klassrummet och råkar knuffa omkull Noors torn. Noor blir arg. Elias står bredvid och skrattar.</p><p style="margin-top:2cqw">Vad hände? Vad kan var och en känna?</p></div>`,
    `<div class="slide"><h2>Vems ansvar är vems?</h2><div class="three-col"><div class="bubble good"><small>Sam</small>Det Sam gjorde, och att försöka laga det.</div><div class="bubble mid"><small>Noor</small>Vad Noor gör när hon är arg. Att vara arg är okej.</div><div class="bubble bad"><small>Elias</small>Att skratta. Det är Elias val.</div></div></div>`,
    `<div class="slide"><h2>Ett förlåt som lagar</h2>${nsteps(["Säg vad du gjorde.","Fråga vad du kan göra.","Gör det.","Tänk på nästa gång: vad gör jag annorlunda?"])}<p class="tagline">Du är inte en dålig människa för att du gjorde fel.</p></div>`,
    `<div class="slide"><h2>Sortera: vems ansvar?</h2><div class="three-col"><div class="bubble"><small>Kort A</small>Att bygga upp tornet igen.</div><div class="bubble"><small>Kort B</small>Att inte slå när man är arg.</div><div class="bubble"><small>Kort C</small>Att skratta åt någon.</div></div><p style="margin-top:2cqw">Sam, Noor, Elias eller allas?</p></div>`,
    `<div class="slide"><h2 class="big">Vi ansvarar för det vi gör.</h2><p>Inte för allt andra gör.</p><p class="tagline">Ansvar handlar om vad du gjorde, inte om vem du är.</p></div>`
  ]};

EX[12] = {n:12, niva:4, titel:"Är det min känsla eller någon annans?", omr:"andra", tagline:"11–12 år · Förstå andra människor",
  ingress:"Övning för årskurs 5–6 om att förstå hur andra känner utan att ta över deras känslor.",
  syfte:["Eleverna får se att känslor kan smitta, och att man kan förstå och stötta någon annan utan att ta över den personens känsla eller vara ansvarig för den personens humör. De får tre frågor att använda: Vad känner jag? Vad känner hen, kanske? Vad är mitt ansvar?"],
  intro:"Övningen utgår från två påhittade personer, Mika och Ines. Eleverna pratar om personerna och behöver inte berätta något om sig själva. Det finns inget rätt svar på vad Ines känner. Poängen är att skilja på sin egen känsla och en annan persons känsla.",
  material:["Skärm eller projektor för klassrumsläget.","Valfritt: papper och pennor.","Inga personuppgifter eller tester behövs."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om att förstå hur andra känner, och om att inte ta över deras känslor.","Vi utgår från påhittade personer, Mika och Ines. Ingen behöver berätta något om sig själv. Kom ihåg att vi tycker och tänker olika, och att vi visar respekt för det så att ingen blir utskämd."]},
    {t:"Mika och Ines", min:3, slide:1, gor:"Ta emot några svar. Peka inte ut vad någon själv har upplevt.", manus:["Läs om Mika och Ines. Ines kommer in på morgonen och är tyst och sur. Mika märker att han själv blir spänd och börjar fundera: ”Har jag gjort något?”","Vems känsla är det? Prata med personen bredvid er i en minut."]},
    {t:"Min känsla, din känsla", min:5, slide:2, manus:["Titta på bilden. Här finns två känslor: Mikas känsla och Ines känsla. Känslor kan smitta. När någon är arg eller ledsen kan vi börja känna oss spända eller ledsna själva.","Då kan det vara svårt att veta vems känsla det är. Är Mika spänd för att Mika har gjort något, eller för att Ines är sur?","Att förstå hur någon annan har det kallas empati. Empati betyder att förstå, inte att ta över den andres känsla eller att vara ansvarig för den."]},
    {t:"Tre frågor", min:4, slide:3, slideTo:4, manus:["Här är tre frågor som hjälper. Ett: Vad känner jag? Två: Vad känner hen, kanske? Vi kan aldrig vara helt säkra, så vi kan fråga. Tre: Vad är mitt ansvar?","Mika kan fråga Ines: ”Hur är det med dig?” Mika kan lyssna och finnas där. Men Mika kan inte ta bort Ines känsla, och Ines humör är inte Mikas ansvar."]},
    {t:"Öva två och två", min:5, slide:5, gor:"Gå runt och lyssna. Hjälp grupper som fastnat att börja med den första frågan: Vad känner jag?", manus:["Nu övar ni två och två. Titta på korten på skärmen och välj ett.","Prata om de tre frågorna för personen på kortet: Vad känner jag? Vad känner hen, kanske? Vad är mitt ansvar? Ni pratar om påhittade personer. Ni har fyra minuter."]},
    {t:"Avslut", min:2, slide:6, manus:["Idag har vi sett att känslor kan smitta, att vi kan förstå och stötta andra utan att ta över deras känslor, och att andras humör inte är vårt ansvar.","Om det blir för mycket kan du alltid be en trygg vuxen om hjälp."]}
  ],
  exempel:[["Mika och Ines","Ines är tyst och sur, och Mika blir spänd och undrar om det är Mikas fel."],["Jo och Alex","Alex berättar att han är orolig inför ett prov, och Jo får ont i magen."],["Lo i gruppen","En i gruppen är sur, och plötsligt blir alla spända och tysta."]],
  fragor:["Hur kan man veta om en känsla är ens egen eller någon annans?","Vad kan man göra för någon som är ledsen?","Vad är inte ens ansvar?"],
  anpassningar:[["Mer stöd","Skriv upp de tre frågorna på tavlan och använd bilden som stöd."],["Fördjupning","Låt eleverna skriva en egen berättelse om två påhittade personer och använda frågorna."],["Muntligt","Elever kan prata eller peka i stället för att skriva."],["Språk","Förklara orden empati, ansvar och smitta."]],
  trygghet:["Alla får vara med, men ingen tvingas. Om något väcker starka känslor hos ett barn eller en elev: låt hen pausa, sitta nära en trygg vuxen eller lämna övningen i lugn och ro utan att behöva förklara sig, och prata gärna med hen efteråt.","Betona respekt för olika åsikter och synsätt, så att ingen blir utskämd. Stoppa kommentarer som skämmer ut någon, och påminn om att allt handlar om påhittade personer.","Ingen elev behöver berätta om något privat eller svårt inför gruppen.","Ämnet kan beröra elever som ofta tar på sig andras känslor, till exempel om någon hemma mår dåligt. Betona att andras känslor inte är deras ansvar, och låt eleverna delta på sitt sätt.","Om en elev blir upprörd: pausa och ge eleven ro.","Om en elev berättar något som väcker oro: följ skolans rutiner och kontakta elevhälsan.",SKYDD],
  avslut:"Sammanfatta att känslor kan smitta, att man kan förstå och stötta utan att ta över, och att andras humör inte är ens ansvar.",
  slides:[
    `<div class="slide"><h2 class="big">Är det min känsla eller någon annans?</h2><p>Empati utan att ta över</p><p class="tagline">11–12 år · Förstå andra människor</p></div>`,
    `<div class="slide"><h2>Mika och Ines</h2><p>Ines kommer in på morgonen och är tyst och sur. Mika märker att han själv blir spänd och börjar fundera: ”Har jag gjort något?”</p><p style="margin-top:2cqw">Vems känsla är det?</p></div>`,
    `<div class="slide"><div class="body-slide"><div><h2>Min känsla, din känsla</h2><p class="note">Känslor kan smitta. Då kan det vara svårt att veta vems känsla det är.</p></div><div>${SMITTA}</div></div></div>`,
    `<div class="slide"><h2>Tre frågor</h2>${nsteps(["Vad känner jag?","Vad känner hen, kanske?","Vad är mitt ansvar?"])}</div>`,
    `<div class="slide"><h2>Jag kan, och jag kan inte</h2><div class="two"><div class="panel b"><h3>Jag kan</h3><p>Lyssna, fråga hur det är och finnas där.</p></div><div class="panel a"><h3>Jag kan inte</h3><p>Ta bort känslan åt någon, eller ansvara för hens humör.</p></div></div></div>`,
    `<div class="slide"><h2>Öva två och två</h2><div class="three-col"><div class="bubble"><small>Kort A</small>En kompis är ledsen och tyst efter en dålig dag.</div><div class="bubble"><small>Kort B</small>Någon i gruppen är sur, och alla blir spända.</div><div class="bubble"><small>Kort C</small>En kompis berättar att hen är orolig, och du får ont i magen.</div></div></div>`,
    `<div class="slide"><h2 class="big">Du kan förstå och stötta, utan att ta över.</h2><p class="tagline">Det är okej att be om hjälp om det blir för mycket.</p></div>`
  ]};

EX[13] = {n:13, niva:5, titel:"Du är inte dina reaktioner.", omr:"sjalv", tagline:"13–15 år · Lär känna dig själv",
  ingress:"Övning för årskurs 7–9 om att kroppen reagerar automatiskt med att kämpa, fly eller stelna, och att man kan välja nästa steg.",
  syfte:["Eleverna får se att kroppen reagerar automatiskt på tre sätt (kämpa, fly eller stelna), att det inte är ett val eller en svaghet, och att de kan välja vad de gör efteråt. De får höra att man först vågar känna och inte gräver ner känslan, och de skriver om en påhittad person."],
  intro:"Övningen utgår från tre påhittade personer, Robin, Alex och Kim, och de skriver om en påhittad person. De läser upp sin text för en kompis. Ingen behöver berätta om egna reaktioner. Poängen är att reaktioner är automatiska och att man kan lära sig välja nästa steg.",
  material:["Skärm eller projektor för klassrumsläget.","Papper och pennor, eller digital anteckningsyta.","Inga personuppgifter samlas in."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om automatiska reaktioner och om hur man kan välja sitt nästa steg.","Vi utgår från påhittade personer. Det du skriver senare handlar om en påhittad person, och du får gärna dela det. Kom ihåg att människor har olika åsikter och synsätt, och att vi visar respekt för det."]},
    {t:"Gruppchatten", min:3, slide:1, manus:["Läs situationen. I en gruppchatt skriver någon: ”Det här är ju helt värdelöst.” Robin blir arg och svarar skarpt. Alex blir tyst och svarar inte. Kim loggar ut och försvinner från chatten.","Alla tre reagerar olika på samma sak. Varför tror ni att det blev så? Prata med personen bredvid er i en minut."]},
    {t:"Tre reaktioner", min:4, slide:2, manus:["Titta på bilden. Kroppen kan reagera på tre sätt när något känns hotfullt: kämpa, fly eller stelna. Robin kämpar. Kim flyr. Alex stelnar.","De här reaktionerna sker automatiskt, på några sekunder, och är formade av våra erfarenheter. Ingen av dem är fel, och ingen är en svaghet.","Du är inte dina reaktioner. En reaktion är något som din kropp gör, och det är inte detsamma som vem du är."]},
    {t:"Reaktion, paus, val", min:5, slide:3, manus:["Efter reaktionen finns ett utrymme. Du hinner inte alltid stoppa reaktionen, men du kan välja vad du gör sedan.","Först vågar man känna: märk reaktionen och ge den ett namn. Sedan en liten paus: andas långsamt, rör på dig eller ta en minut. Sedan ett val: vad vill jag göra?","Att gräva ner känslan hjälper inte. Den försvinner inte, och den kan komma ut senare, ofta när du minst vill det."]},
    {t:"Skriv om en person", min:7, slide:4, gor:"Gå runt. Läs inte upp elevernas texter inför klassen utan tillåtelse. Alla skriver, och alla läser upp sin text för kompisen bredvid. Ingen tvingas: om en elev tycker att det är jobbigt, låt eleven pausa eller sitta vid sidan om utan att förklara sig.", manus:["Nu skriver ni i sex minuter. Välj en av personerna, Robin, Alex eller Kim, eller hitta på en egen person. Skriv: Vad reagerar personen med? Vad behöver personen? Vilket val skulle personen kunna prova nästa gång?","Skriv om en påhittad person, inte om er själva. Läs sedan upp din text för personen bredvid."]},
    {t:"Avslut", min:2, slide:5, manus:["Idag har vi sett att kroppen kan kämpa, fly eller stelna, att det sker automatiskt, och att vi kan välja vad vi gör efteråt.","Du är inte dina reaktioner. Behöver du prata om något av det här finns elevhälsan och vuxna här på skolan."]}
  ],
  exempel:[["Robin, Alex och Kim","Tre personer reagerar olika på en hård kommentar i en gruppchatt."],["Sasha efter provet","Sasha får tillbaka ett prov med dåligt resultat och blir tyst i flera timmar."],["Jo och kritiken","Jo får kritik från en lärare och svarar med ett skämt för att dölja att det sårade."]],
  fragor:["Vilka tecken kan visa att en person kämpar, flyr eller stelnar?","Vad kan en person göra i en paus?","Vad skulle hjälpa personen att välja något annat nästa gång?"],
  anpassningar:[["Mer stöd","Ge en färdig mall med de tre frågorna."],["Fördjupning","Koppla till steg 5 i modellen i sex steg: Välj handling."],["Skrivande","Elever som har svårt att skriva kan säga sin text muntligt till kompisen eller få hjälp att skriva ner den."],["Pauser","Elever får gå ut en stund i lugn och ro."]],
  trygghet:["Alla får vara med, men ingen tvingas. Om något väcker starka känslor hos ett barn eller en elev: låt hen pausa, sitta nära en trygg vuxen eller lämna övningen i lugn och ro utan att behöva förklara sig, och prata gärna med hen efteråt.","Betona respekt för olika åsikter och synsätt, så att ingen blir utskämd. Stoppa kommentarer som skämmer ut någon, och påminn om att allt handlar om påhittade personer.","Ingen elev behöver berätta om egna reaktioner. Eleverna skriver om påhittade personer, och läser upp sina texter för en kompis.","Ämnet kan väcka starka minnen hos vissa elever. Låt eleverna delta på sitt sätt och hoppa över det de vill.","Betona att reaktionerna är automatiska och inte en svaghet.","Om en elev berättar något som väcker oro: följ skolans rutiner och kontakta elevhälsan.",SKYDD],
  avslut:"Avsluta med att kroppen kan kämpa, fly eller stelna, att det är automatiskt, att man inte är sina reaktioner, och att man kan välja nästa steg.",
  slides:[
    `<div class="slide"><h2 class="big">Du är inte dina reaktioner</h2><p>Kämpa, fly eller stelna, och vad du gör sedan</p><p class="tagline">13–15 år · Lär känna dig själv</p></div>`,
    `<div class="slide"><h2>Gruppchatten</h2><p>Någon skriver: ”Det här är ju helt värdelöst.”</p><div class="timeline"><div class="tl"><b>R</b>Robin blir arg och svarar skarpt.</div><div class="tl"><b>A</b>Alex blir tyst och svarar inte.</div><div class="tl"><b>K</b>Kim loggar ut och försvinner från chatten.</div></div></div>`,
    `<div class="slide"><h2>Tre reaktioner</h2><div class="three-col"><div class="bubble bad"><small>Kämpa</small>Robin blir arg och svarar skarpt.</div><div class="bubble mid"><small>Fly</small>Kim loggar ut och drar sig undan.</div><div class="bubble good"><small>Stelna</small>Alex blir tyst och vet inte vad han ska säga.</div></div><p style="margin-top:2cqw">Reaktionerna är automatiska. Inget av det är en svaghet.</p></div>`,
    `<div class="slide"><h2>Reaktion, paus, val</h2><div class="flow"><span class="schip on">Reaktion</span><i>→</i><span class="schip">Våga känna</span><i>→</i><span class="schip">Paus</span><i>→</i><span class="schip">Val</span></div><p style="margin-top:2.4cqw">Du är inte dina reaktioner. Du kan välja nästa steg.</p></div>`,
    `<div class="slide"><h2>Skriv om en person</h2><ul class="q-list"><li>Vad reagerar personen med?</li><li>Vad behöver personen?</li><li>Vilket val kan personen prova nästa gång?</li></ul><p class="tagline">Skriv om en påhittad person, inte om dig själv.</p></div>`,
    `<div class="slide"><h2 class="big">Du är inte dina reaktioner.</h2><p>Du kan lära dig att välja nästa steg.</p><p class="tagline">Stöd finns: elevhälsan och vuxna på skolan.</p></div>`
  ]};

EX[17] = {n:17, niva:6, titel:"Kärlek utan att förlora sig själv.", omr:"granser", tagline:"16–19 år · Snäll betyder inte gränslös",
  ingress:"Övning för gymnasiet om gränser, samtycke och respekt i nära relationer, och om hur man kan vara nära någon utan att förlora sig själv.",
  syfte:["Eleverna får se att gränser och samtycke gäller också i nära relationer, att samtycke är ett fritt och tydligt ja som går att ändra, och att kontroll inte är kärlek. De övar på att säga vad de behöver med ett jag-budskap och får veta var man kan få stöd."],
  intro:"Övningen utgår från två påhittade personer, Alva och Sam. Ämnet är känsligt och kan beröra elever som själva har erfarenheter av kontroll eller våld. Alla får delta på sitt sätt, och ingen behöver berätta om egna relationer. Övningen innehåller information om var man kan få stöd.",
  material:["Skärm eller projektor för klassrumsläget.","Valfritt: papper och pennor.","Inga personuppgifter samlas in."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om nära relationer: om gränser, samtycke och respekt, och om hur man kan vara nära någon utan att förlora sig själv.","Vi utgår från påhittade personer, Alva och Sam. Ingen behöver berätta något om sin egen relation. Kom ihåg att människor har olika åsikter och synsätt, och att vi visar respekt för det."]},
    {t:"Alva och Sam", min:3, slide:1, gor:"Ta emot några svar. Peka inte ut vad någon själv har upplevt.", manus:["Läs situationen. Alva och Sam har varit tillsammans i fyra månader. Sam vill att Alva alltid delar sin position och sitt lösenord, och blir sur när Alva träffar kompisar. Alva börjar tacka nej till vänner för att slippa bråk.","Vad händer med Alva? Prata med personen bredvid er i en minut."]},
    {t:"Samtycke och gränser", min:4, slide:2, manus:["En gräns är en linje för vad som är okej för dig, till exempel kring din kropp, din tid, din telefon och dina vänner. Gränser får finnas även i en relation.","Samtycke betyder ett ja som är fritt och tydligt, utan tryck eller hot. Man får alltid ändra sig, och ett nej är ett nej även om man har sagt ja förut.","Självrespekt är att ta dina egna behov och gränser på allvar. Kärlek handlar inte om att förlora sig själv."]},
    {t:"Sunt eller varningssignal", min:5, slide:3, manus:["Titta på de två listorna. I en sund relation lyssnar båda, båda har egna vänner och intressen, och man kan säga nej utan att bli straffad.","Varningssignaler är till exempel kontroll över telefon eller lösenord, att bli isolerad från vänner, skuldbeläggning, hot eller att man blir rädd för den andres reaktion.","Alva kanske inte tänker att det är fel, för sådant börjar ofta smygande. Det kan kännas som omtanke. Men kontroll är inte kärlek."]},
    {t:"Hitta orden", min:6, slide:4, gor:"Gå runt. Läs inte upp något utan elevens tillåtelse. Hjälp med meningsstarten: Jag vill … och jag behöver … Ingen tvingas: om en elev tycker att det är jobbigt, låt eleven pausa eller sitta vid sidan om utan att förklara sig.", manus:["Nu hjälper ni Alva. Skriv eller säg ett jag-budskap som Alva kan använda, till exempel: ”Jag vill kunna träffa mina kompisar också, och jag vill bestämma själv över min telefon.” Skriv sedan vad Alva kan göra om Sam inte lyssnar.","Ni pratar om Alva och Sam. Ni behöver inte berätta något om er själva. Läs upp din text för personen bredvid. Ni har fem minuter."]},
    {t:"Var finns stöd", min:3, slide:5, manus:["Om någon i en relation kontrollerar dig, hotar dig, gör dig rädd eller inte respekterar ett nej, är det inte något du ska behöva klara på egen hand. Prata med någon: elevhälsan, ungdomsmottagningen eller vårdcentralen, eller ring 1177 för rådgivning.","Om du eller någon annan är i akut fara: ring 112."]},
    {t:"Avslut", min:2, slide:6, manus:["Idag har vi sett att gränser och samtycke gäller även i nära relationer, att kontroll inte är kärlek, och att man kan vara nära någon utan att förlora sig själv.","Respekt går åt båda hållen. Det finns alltid vuxna här på skolan som du kan prata med."]}
  ],
  exempel:[["Alva och Sam","Sam vill kontrollera Alvas telefon och blir sur när Alva träffar kompisar."],["Robin och Jo","Robin gör slut, och Jo skriver upprepade meddelanden trots att Robin har bett Jo sluta."],["Kim och Lee","Kim känner sig pressad att svara direkt på alla meddelanden, hela dagen."]],
  fragor:["Vad är skillnaden mellan omtanke och kontroll?","Hur kan man säga nej utan att relationen tar slut?","Vem kan man prata med om något inte känns bra?"],
  anpassningar:[["Mer stöd","Skriv upp meningsstarten på tavlan: ”Jag vill … och jag behöver …”"],["Fördjupning","Koppla till övningen om att lyssna och säga vad man behöver, och till gränser och samtycke i Min grund."],["Skrivande","Elever som har svårt att skriva kan säga sin text muntligt till kompisen eller få hjälp att skriva ner den."],["Pauser","Elever får gå ut en stund i lugn och ro."]],
  trygghet:["Alla får vara med, men ingen tvingas. Om något väcker starka känslor hos ett barn eller en elev: låt hen pausa, sitta nära en trygg vuxen eller lämna övningen i lugn och ro utan att behöva förklara sig, och prata gärna med hen efteråt.","Betona respekt för olika åsikter och synsätt, så att ingen blir utskämd. Stoppa kommentarer som skämmer ut någon, och påminn om att allt handlar om påhittade personer.","Ingen elev behöver berätta om egna relationer. Eleverna övar med påhittade personer.","Ämnet kan beröra elever som själva har erfarenheter av kontroll, hot eller våld. Låt eleverna delta på sitt sätt, hoppa över det de vill och lämna rummet i lugn och ro.","Om en elev berättar att den utsätts för kontroll, hot eller våld: lyssna lugnt, lova inte att hålla det hemligt och följ skolans rutiner. Kontakta elevhälsan. Skolpersonal har skyldighet att agera vid oro för att ett barn eller en ung person far illa.","Om en elev blir upprörd: pausa och ge eleven möjlighet att lämna övningen utan att förklara sig.",SKYDD],
  avslut:"Avsluta med att gränser och samtycke gäller även i nära relationer, att kontroll inte är kärlek, att man kan vara nära någon utan att förlora sig själv, och var man kan få stöd.",
  slides:[
    `<div class="slide"><h2 class="big">Kärlek utan att förlora sig själv</h2><p>Gränser, samtycke och respekt i nära relationer</p><p class="tagline">16–19 år · Snäll betyder inte gränslös</p></div>`,
    `<div class="slide"><h2>Alva och Sam</h2><div class="timeline"><div class="tl"><b>1</b>Alva och Sam har varit tillsammans i fyra månader.</div><div class="tl"><b>2</b>Sam vill att Alva alltid delar sin position och sitt lösenord, och blir sur när Alva träffar kompisar.</div><div class="tl"><b>3</b>Alva börjar tacka nej till vänner för att slippa bråk.</div></div><p style="margin-top:2cqw">Vad händer med Alva?</p></div>`,
    `<div class="slide"><h2>Samtycke och gränser</h2><div class="two"><div class="panel b"><h3>Samtycke är</h3><p>Ett ja som är fritt och tydligt, utan tryck.</p><p>Man får alltid ändra sig.</p></div><div class="panel a"><h3>En gräns är</h3><p>En linje för vad som är okej för dig.</p><p>Den får finnas även i en relation.</p></div></div></div>`,
    `<div class="slide"><h2>Sunt eller varningssignal?</h2><div class="two"><div class="panel b"><h3>Sunt</h3><p>Båda lyssnar. Båda har egna vänner och intressen. Man kan säga nej utan att bli straffad.</p></div><div class="panel a"><h3>Varningssignal</h3><p>Kontroll över telefon eller lösenord. Att bli isolerad från vänner. Skuldbeläggning, hot eller att bli rädd för reaktionen.</p></div></div></div>`,
    `<div class="slide"><h2>Hitta orden</h2><div class="bubble good" style="margin-top:2cqw"><small>Ett jag-budskap för Alva</small>”Jag vill kunna träffa mina kompisar också, och jag vill bestämma själv över min telefon.”</div><p style="margin-top:2cqw">Vad kan Alva göra om Sam inte lyssnar?</p></div>`,
    `<div class="slide"><h2>Var finns stöd?</h2><div class="chips6"><span class="schip">Elevhälsan</span><span class="schip">Ungdomsmottagningen</span><span class="schip">Vårdcentralen eller 1177</span></div><p style="margin-top:2.4cqw">Du behöver inte klara det själv. Vid akut fara: ring 112.</p></div>`,
    `<div class="slide"><h2 class="big">Kärlek handlar inte om att förlora sig själv.</h2><p>Respekt går åt båda hållen.</p></div>`
  ]};

const T_ALLA = "Alla får vara med, men ingen tvingas. Om något väcker starka känslor hos ett barn eller en elev: låt hen pausa, sitta nära en trygg vuxen eller lämna övningen i lugn och ro utan att behöva förklara sig, och prata gärna med hen efteråt.";
const T_RESPEKT = "Betona respekt för olika åsikter och synsätt, så att ingen blir utskämd. Stoppa kommentarer som skämmer ut någon, och påminn om att allt handlar om påhittade personer.";
const T_RUTIN = "Om en elev berättar något som väcker oro: lyssna lugnt, lova inte att hålla det hemligt och följ skolans rutiner. Kontakta elevhälsan.";
const HJARTA = `<svg class="hjarta" viewBox="0 0 100 90" role="img" aria-label="Ett hjärta"><path d="M50 84C20 62 6 46 6 28A22 22 0 0 1 50 20A22 22 0 0 1 94 28C94 46 80 62 50 84Z" fill="#C8846B" stroke="#F7F4EE" stroke-width="4" stroke-linejoin="round"/></svg>`;
const NGOR = "Ingen tvingas: om en elev tycker att det är jobbigt, låt eleven pausa eller sitta vid sidan om utan att förklara sig.";
const YNGRE = "Kom ihåg att vi tycker och tänker olika, och att vi visar respekt för det så att ingen blir utskämd.";
const ALDRE = "Kom ihåg att människor har olika åsikter och synsätt, och att vi visar respekt för det.";

EX[2] = {n:2, niva:1, titel:"Min kropp berättar.", omr:"nervsystem", tagline:"3–5 år · Kroppen och nervsystemet",
  ingress:"Övning för förskolan om att kroppen berättar hur vi mår, och att man kan lyssna på den.",
  syfte:["Barnen får känna att kroppen berättar hur de mår: hjärtat slår fortare när vi rör oss eller blir arga eller rädda, och kroppen blir lugn igen. De får höra att man kan lyssna på kroppen och gå till en trygg vuxen."],
  intro:"Övningen leds av pedagogen med handdockan Mimmi. Barnen känner sitt eget hjärta med handen. Håll tonen lugn och lekfull, och förklara att en snabb puls är normal. Ingen behöver prata, och barn kan titta på.",
  material:["Skärm eller projektor för klassrumsläget.","Handdockan Mimmi, eller ett gosedjur.","Inget annat behövs."],
  steg:[
    {t:"Välkommen", min:1, slide:0, gor:"Sätt dig i barnens höjd. Låt Mimmi vinka.", manus:["Hej allihop! Idag ska vi lyssna på vad kroppen berättar.","Mimmi hjälper oss. Vi är snälla mot varandra och lyssnar på varandra."]},
    {t:"Kroppen berättar", min:3, slide:1, gor:"Peka på ansiktskorten medan du pratar. Det finns inga fel svar.", manus:["Kroppen kan berätta hur vi mår. När vi är glada kan det kännas som att det bubblar i magen.","När vi blir rädda eller arga kan hjärtat bulta fort och händerna bli spända.","När vi är lugna blir kroppen mjuk och vi andas långsamt."]},
    {t:"Känn hjärtat", min:3, slide:2, gor:"Ta det lugnt. Barn som inte vill hoppa kan gunga armarna eller bara titta på. Det är normalt att pulsen blir snabbare.", manus:["Lägg handen på bröstet och känn efter. Känner du hjärtat? Det slår hela tiden.","Nu hoppar vi på stället i tio sekunder. Räkna med mig!","Stanna och lägg handen på bröstet igen. Slår hjärtat fortare nu? Ja! Kroppen gör sig redo när vi rör oss.","Nu står vi stilla och andas långsamt. Då blir hjärtat lugnare igen."]},
    {t:"Vad känner Mimmi?", min:3, slide:3, manus:["Titta på Mimmi. Mimmis hjärta bultar och händerna är spända. Vad tror ni att Mimmi känner? Peka på ett ansikte.","Det kan vara arg, rädd eller något annat. Det finns inga fel svar. Kroppen berättar, och vi kan fråga: Hur känns det inuti?"]},
    {t:"Avslut", min:2, slide:4, manus:["Bra jobbat! Kroppen berättar hur vi mår. Hjärtat slår fortare när vi rör oss och när vi blir arga eller rädda.","Kroppen kan bli lugn igen. Vi kan andas långsamt, och en trygg vuxen hjälper alltid till."]}
  ],
  exempel:[["Mimmi hoppar","Mimmi hoppar tio hopp och känner att hjärtat slår fortare. Sedan blir hjärtat lugnare."],["Nisse blir rädd","Nisse blir rädd för ett högt ljud, hjärtat bultar och Nisse går till en trygg vuxen."],["Mimmi är glad","Mimmi är glad och känner att det bubblar i magen."]],
  fragor:["Var känner du hjärtat?","Vad händer med hjärtat när vi hoppar?","Vad kan man göra när kroppen bultar och är spänd?"],
  anpassningar:[["Mer stöd","Använd ansiktskorten och låt barnen peka."],["Mindre rörelse","Barn som inte vill hoppa kan gunga armarna eller titta på."],["Mindre grupp","Dela gruppen i två om den är stor."],["Korta stunder","Dela övningen i två tillfällen om barnen blir rastlösa."]],
  trygghet:[T_ALLA,T_RESPEKT,"Inget barn behöver berätta något om sig själv.","Vissa barn kan bli oroliga av att känna hjärtat slå fort. Förklara att det är normalt och att hjärtat blir lugnare igen. Låt barnet sitta nära en trygg vuxen.","Om ett barn berättar något som väcker oro: följ förskolans rutiner och kontakta ansvarig.",SKYDD],
  avslut:"Avsluta med att kroppen berättar hur vi mår, att hjärtat slår fortare när vi rör oss eller blir arga eller rädda, och att kroppen blir lugn igen med hjälp av andning och en trygg vuxen.",
  slides:[
    `<div class="slide"><div class="face-slide"><div class="fbig">${HJARTA}</div><div><h2 class="big">Min kropp berättar</h2><p>Vi lyssnar på vad kroppen säger.</p></div></div></div>`,
    `<div class="slide"><h2>Kroppen berättar</h2><div class="faces small">${["glad","radd","arg"].map(faceCard).join("")}</div><p style="margin-top:2cqw">Glad: det bubblar i magen. Rädd eller arg: hjärtat bultar. Lugn: kroppen är mjuk.</p></div>`,
    `<div class="slide"><div class="face-slide"><div class="fbig">${HJARTA}</div><div><h2 class="big">Känn hjärtat</h2><div class="flow"><span class="schip on">Stilla</span><i>→</i><span class="schip">Hoppa</span><i>→</i><span class="schip">Känn igen</span></div></div></div></div>`,
    `<div class="slide"><h2>Vad känner Mimmi?</h2><div class="faces small">${["arg","radd","glad","ledsen"].map(faceCard).join("")}</div><p style="margin-top:2cqw">Mimmis hjärta bultar och händerna är spända.</p></div>`,
    `<div class="slide"><h2 class="big">Kroppen kan bli lugn igen.</h2><p>Andas långsamt. En trygg vuxen hjälper.</p><div class="faces small">${["stolt","glad"].map(faceCard).join("")}</div></div>`
  ]};

EX[6] = {n:6, niva:2, titel:"Förlåt är mer än ett ord.", omr:"ansvar", tagline:"6–8 år · Misstag, ansvar och att göra rätt igen",
  ingress:"Övning för förskoleklass till årskurs 2 om att ett förlåt blir starkare när man också gör något.",
  syfte:["Eleverna får höra att man inte är en dålig människa för att man gör fel, och att ett förlåt blir starkare när man säger vad man gjorde, frågar vad man kan göra, gör det och tänker på nästa gång. De får också höra att den som blev ledsen får vara ledsen en stund."],
  intro:"Övningen utgår från två påhittade barn, Lo och Maja. Eleverna övar de fyra stegen två och två med påhittade situationer. Ingen behöver berätta något om sig själv. Poängen är att ett förlåt är mer än ett ord, och att den som blev ledsen inte behöver förlåta direkt.",
  material:["Skärm eller projektor för klassrumsläget.","Valfritt: papper och pennor.","Inga personuppgifter eller tester behövs."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om vad man kan göra när man har gjort fel.","Vi utgår från påhittade barn, Lo och Maja. Ingen behöver berätta något om sig själv. Vi är snälla mot varandra och lyssnar på varandra."]},
    {t:"Lo och Maja", min:3, slide:1, gor:"Ta emot några svar. Det finns inga fel svar. Peka inte ut någon som har gjort något.", manus:["Lyssna på berättelsen. Maja har ritat en teckning. Lo vill titta, drar i den och teckningen går sönder. Maja blir ledsen.","Hur känns det för Maja? Hur kan det kännas för Lo? Peka på ett ansikte."]},
    {t:"Bara ordet förlåt", min:3, slide:2, manus:["Lo säger: ”Förlåt”, och går därifrån. Hur känns det för Maja? Teckningen är fortfarande trasig.","Nu säger Lo: ”Förlåt, jag drog i din teckning. Vad kan jag göra?” Maja säger att Lo kan hjälpa till att laga den med tejp. Lo gör det.","Det blev lättare för Maja. Ett förlåt blir starkare när man också gör något."]},
    {t:"Fyra steg", min:4, slide:3, manus:["Ett förlåt har fyra steg. Ett: säg vad du gjorde. ”Jag drog i din teckning.”","Två: fråga vad du kan göra. ”Vad kan jag göra?”","Tre: gör det. Hjälp till att laga eller ge tillbaka.","Fyra: tänk på nästa gång. Fråga dig: ”Vad behöver jag göra eller säga för att det inte ska hända igen?” Lo kan säga: ”Nästa gång frågar jag först.”","Och kom ihåg: man är inte en dålig människa för att man gör fel. Den som blev ledsen får vara ledsen en stund. Man behöver inte säga ”det är okej” direkt."]},
    {t:"Öva två och två", min:3, slide:4, gor:"Gå runt och hjälp barn som fastnar. Låt dem börja med: Jag … Vad kan jag göra?", manus:["Nu övar ni två och två. Titta på korten på skärmen och välj ett. Ni spelar påhittade barn.","En säger de fyra stegen. Den andra svarar vad hen vill att den andra ska göra. Byt sedan."]},
    {t:"Avslut", min:1, slide:5, manus:["Idag har vi sett att ett förlåt är mer än ett ord. Vi säger vad vi gjorde, frågar vad vi kan göra, gör det och tänker på nästa gång.","Man är inte en dålig människa för att man gör fel. Bra jobbat!"]}
  ],
  exempel:[["Lo och Maja","Lo drar i Majas teckning så att den går sönder, säger vad Lo gjorde, hjälper till att laga den och bestämmer sig för att fråga först nästa gång."],["Ali och bygget","Ali välter någons bygge och frågar vad han kan göra. De bygger upp det tillsammans."],["Sam i kön","Sam knuffar någon i kön, säger vad Sam gjorde och går tillbaka till sin plats."]],
  fragor:["Vad är skillnaden mellan att bara säga förlåt och att också göra något?","Vad kan man göra efter ett misstag?","Får man vara ledsen en stund även om någon säger förlåt?"],
  anpassningar:[["Bildstöd","Använd bilderna på tre steg som stöd, och låt eleverna visa med handen: ett, två, tre."],["Mindre grupper","Dela klassen i halvgrupper vid behov."],["Muntligt","Eleverna övar muntligt och behöver inte skriva."],["Språk","Skriv upp orden förlåt, laga och göra rätt."]],
  trygghet:[T_ALLA,T_RESPEKT,"Ingen elev behöver berätta något om sig själv.","Ämnet kan beröra elever som ofta får skulden eller som skäms mycket. Betona att man inte är en dålig människa för att man gör fel.","Om en elev blir upprörd: pausa och ge eleven ro.",T_RUTIN,SKYDD],
  avslut:"Sammanfatta att ett förlåt är mer än ett ord, att man säger vad man gjorde, frågar vad man kan göra, gör det och tänker på nästa gång, att den som blev ledsen får vara ledsen en stund, och att man inte är en dålig människa för att man gör fel.",
  slides:[
    `<div class="slide"><div class="face-slide"><div class="fbig">${face("ledsen")}</div><div><h2 class="big">Förlåt är mer än ett ord</h2><p>Lo och Maja</p></div></div></div>`,
    `<div class="slide"><h2>Lo och Maja</h2><div class="timeline"><div class="tl"><b>1</b>Maja har ritat en teckning.</div><div class="tl"><b>2</b>Lo drar i den och den går sönder.</div><div class="tl"><b>3</b>Maja blir ledsen.</div></div></div>`,
    `<div class="slide"><h2>Vilket förlåt hjälper?</h2><div class="two"><div class="panel a"><h3>Bara ”förlåt”</h3><p>Lo går därifrån. Teckningen är trasig.</p></div><div class="panel b"><h3>Förlåt och göra något</h3><p>Lo säger vad Lo gjorde och hjälper till att laga den.</p></div></div></div>`,
    `<div class="slide"><h2>Fyra steg</h2>${nsteps(["Säg vad du gjorde.","Fråga: Vad kan jag göra?","Gör det.","Nästa gång: vad gör jag annorlunda?"])}<p class="tagline">Man är inte en dålig människa för att man gör fel.</p></div>`,
    `<div class="slide"><h2>Öva två och två</h2><div class="three-col"><div class="bubble"><small>Kort A</small>Du knuffar någon i kön.</div><div class="bubble"><small>Kort B</small>Du tar någons penna utan att fråga.</div><div class="bubble"><small>Kort C</small>Du välter någons bygge.</div></div><p style="margin-top:2cqw">En säger de fyra stegen. Den andra svarar. Byt sedan.</p></div>`,
    `<div class="slide"><h2 class="big">Förlåt är mer än ett ord.</h2><p>Vi säger vad vi gjorde, frågar vad vi kan göra, gör det och tänker på nästa gång.</p><div class="faces small">${["glad","stolt"].map(faceCard).join("")}</div></div>`
  ]};

EX[8] = {n:8, niva:3, titel:"Samma situation, olika känslor.", omr:"andra", tagline:"9–10 år · Förstå andra människor",
  ingress:"Övning för årskurs 3–4 om att olika människor kan känna olika i samma situation, och att man kan fråga i stället för att gissa.",
  syfte:["Eleverna får se att människor kan känna olika i samma situation, att ingen känsla är fel, och att man kan ta reda på hur någon har det genom att titta, lyssna och fråga. De övar på att fråga i stället för att gissa."],
  intro:"Övningen utgår från påhittade personer, Sam, Lo, Maja och Ines, och eleverna skriver om påhittade personer och läser upp för en kompis. Poängen är att förstå att andra kan känna annorlunda än man själv, och att fråga.",
  material:["Skärm eller projektor för klassrumsläget.","Papper och pennor.","Inga personuppgifter eller tester behövs."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om hur olika människor kan känna olika i samma situation.","Vi utgår från påhittade personer. Ingen behöver berätta något om sig själv. "+YNGRE]},
    {t:"Redovisningen", min:3, slide:1, gor:"Ta emot några svar. Det finns inga fel svar. Peka inte ut vad någon själv har upplevt.", manus:["Läs situationen. Läraren säger att alla ska redovisa på fredag. Sam, Lo, Maja och Ines hör det.","Hur tror ni att var och en känner? Prata med personen bredvid er i en minut."]},
    {t:"Olika kroppar, olika känslor", min:5, slide:2, manus:["Titta på bilden. Samma sak hände, men alla känner olika. Sams mage knyter sig, och Sam är nervös. Lo känner pirr och ser fram emot det. Maja är orolig att glömma vad hon ska säga. Ines är sur eftersom hon ville göra något annat.","Ingen känsla är fel. Känslor hänger ihop med hur vi tänker på det som händer, vad som är viktigt för oss och hur vi mår just idag.","Därför kan vi aldrig vara helt säkra på vad någon annan känner. Men vi kan ta reda på det."]},
    {t:"Hur kan jag veta?", min:5, slide:3, manus:["Det finns tre sätt att ta reda på det. Titta: hur ser personen ut och hur rör hen sig? Lyssna på vad personen säger. Och fråga: ”Hur är det för dig?”","Gissa inte säkert. Säg hellre: ”Jag tror att du är nervös, stämmer det?” Då kan den andra rätta dig."]},
    {t:"Skriv två och två", min:5, slide:4, gor:"Gå runt. "+NGOR+" Läs inte upp elevernas texter inför klassen utan tillåtelse.", manus:["Nu skriver ni två och två. Välj ett kort på skärmen. Skriv två påhittade personer som kan känna olika i den situationen, och skriv varför. Ni har tre minuter.","Läs sedan upp din text för personen bredvid. Ni pratar om påhittade personer, inte om er själva."]},
    {t:"Avslut", min:1, slide:5, manus:["Idag har vi sett att människor kan känna olika i samma situation, att ingen känsla är fel och att vi kan fråga i stället för att gissa.","Om det blir för mycket kan du alltid prata med en trygg vuxen."]}
  ],
  exempel:[["Sam, Lo, Maja och Ines","De hör att alla ska redovisa på fredag och känner nervositet, glädje, oro och irritation."],["Jo och Alex","Jo blir glad när läraren byter plats på alla. Alex blir orolig."],["Mika och Kim","Mika längtar efter skolfotot. Kim vill helst slippa bli fotograferad."]],
  fragor:["Varför kan två personer känna olika i samma situation?","Hur kan man ta reda på hur någon har det?","Vad kan du säga i stället för att gissa?"],
  anpassningar:[["Mer stöd","Skriv upp meningsstarten på tavlan: ”Jag tror att du … stämmer det?”"],["Fördjupning","Låt eleverna hitta på en egen situation med tre personer som känner olika."],["Muntligt","Elever som har svårt att skriva kan säga sin text muntligt till kompisen eller få hjälp att skriva ner den."],["Språk","Skriv upp orden nervös, orolig, sur och fråga."]],
  trygghet:[T_ALLA,T_RESPEKT,"Ingen elev behöver berätta något om sig själv. Eleverna skriver om påhittade personer och läser upp sina texter för en kompis.","Ämnet kan beröra elever som ofta känner att andra inte förstår dem. Betona att ingen känsla är fel.","Om en elev blir upprörd: pausa och ge eleven ro.",T_RUTIN,SKYDD],
  avslut:"Sammanfatta att människor kan känna olika i samma situation, att ingen känsla är fel, och att man kan titta, lyssna och fråga i stället för att gissa.",
  slides:[
    `<div class="slide"><h2 class="big">Samma situation, olika känslor</h2><p>Att förstå hur andra kan känna</p><p class="tagline">9–10 år · Förstå andra människor</p></div>`,
    `<div class="slide"><h2>Redovisningen</h2><p>Läraren säger att alla ska redovisa på fredag. Sam, Lo, Maja och Ines hör det.</p><p style="margin-top:2cqw">Hur tror du att var och en känner?</p></div>`,
    `<div class="slide"><h2>Samma situation, olika känslor</h2><div class="two"><div class="panel a"><h3>Sam</h3><p>Magen knyter sig. Sam är nervös.</p></div><div class="panel b"><h3>Lo</h3><p>Det pirrar. Lo ser fram emot det.</p></div><div class="panel a"><h3>Maja</h3><p>Maja är orolig att glömma vad hon ska säga.</p></div><div class="panel b"><h3>Ines</h3><p>Ines är sur. Hen ville göra något annat.</p></div></div></div>`,
    `<div class="slide"><h2>Hur kan jag veta?</h2>${nsteps(["Titta: hur ser personen ut och rör sig?","Lyssna på vad personen säger.","Fråga: Hur är det för dig?"])}<p class="tagline">Gissa inte säkert. Säg: Jag tror att du …, stämmer det?</p></div>`,
    `<div class="slide"><h2>Skriv två och två</h2><div class="three-col"><div class="bubble"><small>Kort A</small>Klassen ska ha gympa utomhus i regn.</div><div class="bubble"><small>Kort B</small>Läraren delar upp klassen i nya grupper.</div><div class="bubble"><small>Kort C</small>Det ska vara skolfoto imorgon.</div></div><p style="margin-top:2cqw">Skriv två påhittade personer som kan känna olika, och varför. Läs upp för kompisen bredvid.</p></div>`,
    `<div class="slide"><h2 class="big">Fråga i stället för att gissa.</h2><p>Människor kan känna olika i samma situation.</p></div>`
  ]};

EX[14] = {n:14, niva:5, titel:"Att förstå är inte att acceptera.", omr:"nyasatt", tagline:"13–15 år · Nya sätt att tänka och handla",
  ingress:"Övning för årskurs 7–9 om att förstå varför någon gör något utan att behöva acceptera det.",
  syfte:["Eleverna får se att man kan förstå varför någon gjorde något utan att ursäkta eller acceptera det, och att båda sakerna kan vara sanna samtidigt. De övar på att skriva en mening som både förstår och sätter en gräns."],
  intro:"Övningen utgår från tre påhittade personer, Kim, Robin och Alex, och eleverna skriver om påhittade personer och läser upp sin text för en kompis. Ämnet kan beröra elever som har blivit kränkta eller själva har sårat andra, så var uppmärksam. Poängen är att förstå och att sätta en gräns, inte att ursäkta.",
  material:["Skärm eller projektor för klassrumsläget.","Papper och pennor, eller digital anteckningsyta.","Inga personuppgifter samlas in."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om att förstå varför någon gör något, och om att ändå kunna säga att det inte var okej.","Vi utgår från påhittade personer. Det du skriver senare handlar om en påhittad person, och du läser upp det för personen bredvid. Ingen tvingas, och du kan säga till mig om något känns jobbigt. "+ALDRE]},
    {t:"Kim, Robin och Alex", min:3, slide:1, gor:"Ta emot några svar. Peka inte ut vad någon själv har upplevt.", manus:["Läs situationen. Kim blev kritiserad av en lärare inför klassen. Senare skickar Kim ett elakt skämt om Robin i gruppchatten. Robin blir sårad. Alex läser det och undrar vad han ska göra.","Vad tror ni kan ligga bakom att Kim gjorde så? Hur kan det vara för Robin? Prata med personen bredvid er i en minut."]},
    {t:"Förstå, förklara, acceptera", min:5, slide:2, manus:["Titta på bilden. Vi kan förstå varför Kim gjorde så: Kim var kanske skamsen och ville bli av med känslan. Att förstå är inte detsamma som att acceptera.","Det var ändå inte okej att vara elak mot Robin. Robin har rätt att bli sur eller ledsen, och Robin har rätt att säga ifrån.","Båda sakerna kan vara sanna samtidigt: ”Jag förstår varför du gjorde så, och det var inte okej.”","Och det är inte Robins jobb att förstå eller förlåta direkt. Robin kan förstå, men behöver inte."]},
    {t:"Tre frågor", min:4, slide:3, manus:["Här är tre frågor som hjälper. Vad hände? Vad kan ligga bakom? Och vad är inte okej, oavsett orsak?","Alex kan använda dem: ”Kim var kanske skamsen. Men det var inte okej att vara elak mot Robin.” Alex kan stötta Robin och säga ifrån till Kim."]},
    {t:"Skriv och läs upp", min:7, slide:4, gor:"Gå runt. Läs inte upp elevernas texter inför klassen utan tillåtelse. "+NGOR+" Hjälp med meningsstarten: Jag förstår att … men det är inte okej att …", manus:["Nu skriver ni i fem minuter. Välj en av personerna, Kim, Robin eller Alex, eller hitta på en egen person. Skriv en mening som både förstår och sätter en gräns: ”Jag förstår att … men det är inte okej att …” Skriv sedan vad personen kan göra eller säga.","Skriv om en påhittad person, inte om er själva. Läs sedan upp din text för personen bredvid."]},
    {t:"Avslut", min:1, slide:5, manus:["Idag har vi sett att man kan förstå varför någon gör något utan att acceptera det, och att man alltid får säga ifrån.","Om någon behandlar dig illa gång på gång: prata med en vuxen. Elevhälsan och skolans personal finns."]}
  ],
  exempel:[["Kim, Robin och Alex","Kim skickar ett elakt skämt om Robin efter att ha blivit kritiserad. Alex undrar vad han ska göra."],["Sasha och Jo","Sasha svarar skarpt på Jo efter ett dåligt prov. Jo förstår varför men tycker inte att det var okej."],["Mika och Lee","Mika blir utesluten ur en grupp av Lee, som själv känner sig utanför."]],
  fragor:["Vad är skillnaden mellan att förstå och att acceptera?","Hur kan man både förstå någon och säga ifrån?","Vad kan en kompis som ser det göra?"],
  anpassningar:[["Mer stöd","Ge en färdig mall: Jag förstår att … men det är inte okej att …"],["Fördjupning","Koppla till steg 6 i modellen i sex steg: Ta ansvar och reparera, och till övningen Hur reparerar man en relation?"],["Skrivande","Elever som har svårt att skriva kan säga sin text muntligt till kompisen eller få hjälp att skriva ner den."],["Pauser","Elever får gå ut en stund i lugn och ro."]],
  trygghet:[T_ALLA,T_RESPEKT,"Ingen elev behöver berätta om egna upplevelser. Eleverna skriver om påhittade personer och läser upp sina texter för en kompis.","Ämnet kan beröra elever som själva har blivit kränkta eller har kränkt andra. Betona att att förstå inte betyder att den som blir illa behandlad ska tåla det.","Om en elev berättar om mobbning eller kränkningar: lyssna lugnt, lova inte att hålla det hemligt och följ skolans rutiner. Kontakta elevhälsan.",SKYDD],
  avslut:"Avsluta med att man kan förstå varför någon gör något utan att acceptera det, att man alltid får säga ifrån, och att vuxna och elevhälsan finns om någon behandlas illa.",
  slides:[
    `<div class="slide"><h2 class="big">Att förstå är inte att acceptera</h2><p>Förstå varför, och ändå säga ifrån</p><p class="tagline">13–15 år · Nya sätt att tänka och handla</p></div>`,
    `<div class="slide"><h2>Kim, Robin och Alex</h2><div class="timeline"><div class="tl"><b>1</b>Kim blir kritiserad av en lärare inför klassen.</div><div class="tl"><b>2</b>Kim skickar ett elakt skämt om Robin i gruppchatten.</div><div class="tl"><b>3</b>Robin blir sårad. Alex läser det och undrar vad han ska göra.</div></div></div>`,
    `<div class="slide"><h2>Förstå, men inte acceptera</h2><div class="three-col"><div class="bubble good"><small>Förstå</small>Kim var kanske skamsen.</div><div class="bubble bad"><small>Inte okej</small>Att vara elak mot Robin.</div><div class="bubble mid"><small>Båda är sanna</small>”Jag förstår varför du gjorde så, och det var inte okej.”</div></div></div>`,
    `<div class="slide"><h2>Tre frågor</h2>${nsteps(["Vad hände?","Vad kan ligga bakom?","Vad är inte okej, oavsett orsak?"])}</div>`,
    `<div class="slide"><h2>Skriv om en person</h2><ul class="q-list"><li>Jag förstår att … men det är inte okej att …</li><li>Vad kan personen göra eller säga?</li></ul><p class="tagline">Skriv om en påhittad person, inte om dig själv. Läs upp för kompisen bredvid.</p></div>`,
    `<div class="slide"><h2 class="big">Att förstå är inte att acceptera.</h2><p>Du får alltid säga ifrån.</p><p class="tagline">Stöd finns: elevhälsan och vuxna på skolan.</p></div>`
  ]};

EX[16] = {n:16, niva:6, titel:"Varför gör jag som jag gör?", omr:"nyasatt", tagline:"16–19 år · Nya sätt att tänka och handla",
  ingress:"Övning för gymnasiet om att det vi gör ofta fyller ett behov, och att man kan prova ett annat val i liten skala.",
  syfte:["Eleverna får se att ett beteende ofta fyller ett behov, till exempel lugn, att slippa obehag eller kontakt, och att man kan förstå ett mönster utan att skämmas. De övar på att hitta behovet bakom ett vardagsmönster och på ett litet annat val."],
  intro:"Övningen utgår från en påhittad person, Lee, och eleverna skriver om en påhittad person med ett vardagsmönster, till exempel skärm på kvällen eller att alltid säga ja, och läser upp sin text för en kompis. Använd inte exempel som handlar om svåra problem. Poängen är att förstå mönster utan att skämmas och att prova något litet annat.",
  material:["Skärm eller projektor för klassrumsläget.","Papper och pennor, eller digital anteckningsyta.","Inga personuppgifter samlas in."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om varför vi gör som vi gör, och om hur man kan prova ett annat val.","Vi utgår från en påhittad person, Lee. Det du skriver senare handlar om en påhittad person, och du läser upp det för personen bredvid. Ingen tvingas, och du kan säga till mig om något känns jobbigt. "+ALDRE]},
    {t:"Lees kväll", min:3, slide:1, gor:"Ta emot några svar. Peka inte ut vad någon själv har upplevt.", manus:["Läs situationen. Lee har ett prov i veckan. Varje kväll sätter sig Lee med telefonen för att ”bara kolla en stund”, och plötsligt har två timmar gått. Lee blir stressad och sover dåligt.","Vad får Lee ut av att scrolla? Prata med personen bredvid er i en minut."]},
    {t:"Beteendet fyller ett behov", min:5, slide:2, manus:["Det vi gör fyller ofta ett behov. Lee behöver kanske koppla av, slippa stressen inför provet eller känna kontakt med andra.","Scrollandet fungerar en stund, men det löser inte det som skapar stressen. Det är skillnaden mellan det som lindrar för stunden och det som hjälper på sikt.","Att förstå behovet betyder inte att Lee är lat eller svag. Det är ett mönster, och mönster går att förändra."]},
    {t:"Mönster och val", min:5, slide:3, manus:["Tre steg. Ett: märk mönstret, alltså när det händer och hur Lee känner sig. Två: fråga vad behovet är: lugn, kontakt eller att slippa något. Tre: prova något litet annat som svarar på samma behov.","Till exempel kan Lee ta en kort paus med musik eller en promenad, eller lägga telefonen i ett annat rum under en timme. Det ska vara litet och möjligt."]},
    {t:"Skriv och läs upp", min:8, slide:4, gor:"Gå runt. Läs inte upp elevernas texter inför klassen utan tillåtelse. "+NGOR+" Hjälp med frågorna på bilden.", manus:["Nu skriver ni i sex minuter. Välj Lee eller hitta på en egen person med ett vardagsmönster. Skriv: Vad gör personen, och när? Vilket behov kan ligga bakom? Vilket litet annat val kan personen prova?","Skriv om en påhittad person, inte om er själva. Läs sedan upp din text för personen bredvid, i två minuter."]},
    {t:"Avslut", min:2, slide:5, manus:["Idag har vi sett att det vi gör ofta fyller ett behov, att man kan förstå ett mönster utan att skämmas, och att ett litet annat val kan göra skillnad.","Om något i ditt liv känns svårt att ändra på egen hand finns elevhälsan och vuxna här på skolan."]}
  ],
  exempel:[["Lee och telefonen","Lee scrollar varje kväll för att slippa stress inför provet, och provar att ha telefonen i ett annat rum under en timme."],["Sasha och ja","Sasha säger ja till allt för att slippa konflikter, och övar på att säga nej till en liten sak."],["Robin och pausen","Robin drar sig undan när det blir spänt, och provar att säga ”Jag behöver en paus, jag kommer strax tillbaka.”"]],
  fragor:["Vilket behov kan ligga bakom ett vanligt mönster?","Vad är skillnaden mellan det som lindrar för stunden och det som hjälper på sikt?","Hur litet kan ett annat val vara för att det ska vara möjligt?"],
  anpassningar:[["Mer stöd","Ge en färdig mall med de tre frågorna och exempel på behov: lugn, kontakt, slippa något."],["Fördjupning","Koppla till övningen Från reaktion till medvetet val och steg 5 i modellen i sex steg."],["Skrivande","Elever som har svårt att skriva kan säga sin text muntligt till kompisen eller få hjälp att skriva ner den."],["Pauser","Elever får gå ut en stund i lugn och ro."]],
  trygghet:[T_ALLA,T_RESPEKT,"Ingen elev behöver berätta om egna mönster. Eleverna skriver om påhittade personer och läser upp sina texter för en kompis.","Ämnet kan beröra elever som har svåra mönster, till exempel kring sömn, skärm, mat eller mående. Använd vardagliga exempel och låt eleverna skriva om påhittade personer.",T_RUTIN,SKYDD],
  avslut:"Avsluta med att det vi gör ofta fyller ett behov, att man kan förstå ett mönster utan att skämmas, att ett litet annat val kan göra skillnad, och att elevhälsan finns om något är svårt att ändra på egen hand.",
  slides:[
    `<div class="slide"><h2 class="big">Varför gör jag som jag gör?</h2><p>Behov, mönster och val</p><p class="tagline">16–19 år · Nya sätt att tänka och handla</p></div>`,
    `<div class="slide"><h2>Lees kväll</h2><div class="timeline"><div class="tl"><b>1</b>Lee har ett prov i veckan.</div><div class="tl"><b>2</b>Varje kväll sätter sig Lee med telefonen för att ”bara kolla en stund”. Två timmar går.</div><div class="tl"><b>3</b>Lee blir stressad och sover dåligt.</div></div><p style="margin-top:2cqw">Vad får Lee ut av att scrolla?</p></div>`,
    `<div class="slide"><h2>Beteendet fyller ett behov</h2><div class="three-col"><div class="bubble"><small>Vad gör Lee?</small>Scrollar varje kväll.</div><div class="bubble mid"><small>Vilket behov?</small>Koppla av, slippa stress eller få kontakt.</div><div class="bubble good"><small>Vad hjälper på sikt?</small>Något som svarar på samma behov.</div></div></div>`,
    `<div class="slide"><h2>Mönster och val</h2>${nsteps(["Märk mönstret: när händer det, och hur känns det?","Fråga vad behovet är: lugn, kontakt eller att slippa något.","Prova något litet annat som svarar på samma behov."])}</div>`,
    `<div class="slide"><h2>Skriv om en person</h2><ul class="q-list"><li>Vad gör personen, och när?</li><li>Vilket behov kan ligga bakom?</li><li>Vilket litet annat val kan personen prova?</li></ul><p class="tagline">Skriv om en påhittad person, inte om dig själv. Läs upp för kompisen bredvid.</p></div>`,
    `<div class="slide"><h2 class="big">Det vi gör har ofta en orsak.</h2><p>Du kan förstå ett mönster utan att skämmas, och prova ett litet annat val.</p><p class="tagline">Stöd finns: elevhälsan och vuxna på skolan.</p></div>`
  ]};

}
