EX[21] = {n:21, niva:3, titel:"Tankar och känslor hänger ihop.", omr:"nyasatt", tagline:"9–10 år · Nya sätt att tänka och handla",
  ingress:"Övning för årskurs 3–4 om att tankar och känslor hänger ihop, att tankar inte alltid är sanna och att man kan undersöka dem.",
  syfte:["Eleverna får se att samma situation kan ge olika känslor beroende på vad man tänker, att tankar ofta är snabba gissningar som inte alltid är sanna, och att man kan undersöka en tanke med tre frågor. De får också höra att känslan får finnas medan man undersöker."],
  intro:"Övningen utgår från påhittade personer, Ali, Maja och Lo, och eleverna övar två och två. Poängen är inte att eleverna ska tänka positivt hela tiden, utan att de får se att en tanke kan undersökas. Ingen behöver berätta något om sig själv.",
  material:["Skärm eller projektor för klassrumsläget.","Valfritt: papper och pennor.","Inga personuppgifter eller tester behövs."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om hur tankar och känslor hänger ihop.","Vi utgår från påhittade personer. Ingen behöver berätta något om sig själv. "+YNGRE]},
    {t:"Berättelsen om Ali", min:3, slide:1, gor:"Ta emot några svar. Det finns inga fel svar. Peka inte ut vad någon själv har upplevt.", manus:["Läs berättelsen. Ali ser att Maja och Lo viskar och tittar åt Ali. Ali tänker: ”De pratar om mig.” Ali blir ledsen och går därifrån.","Vad tänkte Ali? Hur kände Ali? Prata med personen bredvid er i en minut."]},
    {t:"Samma situation, ny tanke", min:5, slide:2, manus:["Titta på bilden. Samma sak hände, men med en annan tanke blir det en annan känsla. Om Ali tänker ”De pratar om mig” blir Ali ledsen. Om Ali tänker ”De planerar nog något” blir Ali nyfiken.","Tankar är ofta snabba gissningar, och de är inte alltid sanna. Men en tanke kan påverka hur vi känner.","Det betyder inte att man ska tänka glatt hela tiden. Först får vi känna det vi känner. Sedan kan vi undersöka tanken."]},
    {t:"Tanke-detektiven", min:5, slide:3, manus:["Här är tre frågor som en tanke-detektiv ställer. Vad tänker jag? Är det säkert, och vad vet jag? Finns det ett annat sätt att tänka?","Ali kan fråga: ”Vet jag att de pratar om mig? Nej. Kanske de planerar något.”"]},
    {t:"Öva två och två", min:5, slide:4, gor:"Gå runt. Hjälp grupper som fastnat med första frågan: Vilken tanke gör det värre? Ingen behöver berätta något om sig själv.", manus:["Nu övar ni två och två. Titta på korten på skärmen och välj ett. Prata om en påhittad person i den situationen: Vilken tanke gör det värre? Vilken annan tanke finns? Vilken känsla kommer då?","Ni pratar om påhittade personer, inte om er själva. Ni har tre minuter. Byt sedan kort."]},
    {t:"Avslut", min:1, slide:5, manus:["Idag har vi sett att tankar och känslor hänger ihop, att tankar inte alltid är sanna och att vi kan undersöka dem.","Känslan får finnas hela tiden. Om det känns svårt kan du prata med en trygg vuxen."]}
  ],
  exempel:[["Ali och viskandet","Ali ser att kompisar viskar och tänker först att de pratar om Ali, men kommer på att de kanske planerar något."],["Jo och meddelandet","Jo får inget svar på ett meddelande och tänker att kompisen är sur, men kommer på att kompisen kanske inte har sett det."],["Sam och läraren","Läraren ser allvarlig ut och Sam tänker att Sam har gjort något fel, men det kanske beror på något annat."]],
  fragor:["Hur kan en tanke ändra hur man känner?","Vilka frågor kan en tanke-detektiv ställa?","Varför är det bra att känslan får finnas medan man undersöker tanken?"],
  anpassningar:[["Mer stöd","Skriv upp de tre frågorna på tavlan och använd bilderna som stöd."],["Fördjupning","Låt eleverna hitta på en egen situation med två olika tankar."],["Muntligt","Eleverna övar muntligt och behöver inte skriva."],["Språk","Skriv upp orden tanke, känsla, gissning och säker."]],
  trygghet:[T_ALLA,T_RESPEKT,"Ingen elev behöver berätta något om sig själv.","Ämnet kan beröra elever som ofta tänker negativt om sig själva. Betona att tankar inte alltid är sanna och att eleven inte behöver ändra en tanke direkt. Känslan får finnas.","Syftet är inte att alla ska tänka positivt hela tiden.","Om en elev blir upprörd: pausa och ge eleven ro.",T_RUTIN,SKYDD],
  avslut:"Sammanfatta att tankar och känslor hänger ihop, att tankar inte alltid är sanna, att man kan undersöka en tanke med tre frågor, och att känslan får finnas hela tiden.",
  slides:[
    `<div class="slide"><h2 class="big">Tankar och känslor hänger ihop</h2><p>Samma situation, olika tankar</p><p class="tagline">9–10 år · Nya sätt att tänka och handla</p></div>`,
    `<div class="slide"><h2>Ali</h2><div class="timeline"><div class="tl"><b>1</b>Ali ser att Maja och Lo viskar och tittar åt Ali.</div><div class="tl"><b>2</b>Ali tänker: ”De pratar om mig.”</div><div class="tl"><b>3</b>Ali blir ledsen och går därifrån.</div></div></div>`,
    `<div class="slide"><h2>Samma situation, olika tankar</h2><div class="two"><div class="panel a"><h3>Tanke 1: De pratar om mig.</h3><p>Känsla: ledsen. Ali går därifrån.</p></div><div class="panel b"><h3>Tanke 2: De planerar nog något.</h3><p>Känsla: nyfiken. Ali går dit.</p></div></div></div>`,
    `<div class="slide"><h2>Tanke-detektiven</h2>${nsteps(["Vad tänker jag?","Är det säkert? Vad vet jag?","Finns det ett annat sätt att tänka?"])}<p class="tagline">Först får vi känna. Sedan kan vi undersöka tanken.</p></div>`,
    `<div class="slide"><h2>Öva två och två</h2><div class="three-col"><div class="bubble"><small>Kort A</small>Jo får inget svar på sitt meddelande.</div><div class="bubble"><small>Kort B</small>Läraren ser allvarlig ut i morse.</div><div class="bubble"><small>Kort C</small>Sam blir inte vald först i laget.</div></div><p style="margin-top:2cqw">Vilken tanke gör det värre? Vilken annan tanke finns? Vilken känsla kommer då?</p></div>`,
    `<div class="slide"><h2 class="big">Tankar är inte alltid sanna.</h2><p>Vi kan undersöka dem, och känslan får finnas hela tiden.</p></div>`
  ]};

EX[22] = {n:22, niva:5, titel:"Tankefällor och att testa tanken.", omr:"nyasatt", tagline:"13–15 år · Nya sätt att tänka och handla",
  ingress:"Övning för årskurs 7–9 om vanliga tankefällor och om att testa en tanke med tre frågor.",
  syfte:["Eleverna får se att några tankar är vanliga tankefällor, att tankar inte alltid är fakta, och att man kan testa en tanke genom att fråga efter bevis, tänka som en kompis och hitta ett rättvisare sätt att tänka. De får också höra att målet är rättvisare tankar och inte alltid positivare."],
  intro:"Övningen utgår från en påhittad person, Robin, och eleverna skriver om en påhittad person och läser upp sin text för en kompis. Håll tonen nyfiken och inte rättande. Poängen är att tankar går att testa, inte att tvinga fram positivt tänkande.",
  material:["Skärm eller projektor för klassrumsläget.","Papper och pennor, eller digital anteckningsyta.","Inga personuppgifter samlas in."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om tankar som kan göra det jobbigare än det behöver vara, och om hur man kan testa dem.","Vi utgår från påhittade personer. Det du skriver senare handlar om en påhittad person, och du läser upp det för personen bredvid. Ingen tvingas, och du kan säga till mig om något känns jobbigt. "+ALDRE]},
    {t:"Robins tanke", min:3, slide:1, gor:"Ta emot några svar. Peka inte ut vad någon själv har upplevt.", manus:["Läs situationen. Robin ska hålla ett kort tal i morgon. Robin tänker: ”Jag kommer glömma allt, och alla kommer skratta.” Robin blir spänd och sover dåligt.","Hur påverkar tanken Robin? Prata med personen bredvid er i en minut."]},
    {t:"Fyra tankefällor", min:5, slide:2, manus:["Det finns några tankar som många människor har, och som kallas tankefällor. De är vanliga och betyder inte att något är fel på dig.","Katastroftänk är att tro att det värsta kommer att hända. Tankeläsning är att tro att man vet vad andra tycker. Allt eller inget är att tänka ”alltid”, ”aldrig” eller ”helt värdelös”. Skuld på mig själv är att tro att allt är mitt fel.","Robins tanke är en blandning av katastroftänk och tankeläsning."]},
    {t:"Testa tanken", min:5, slide:3, manus:["Här är tre frågor som hjälper att testa en tanke. Ett: vilka bevis finns för tanken, och vilka finns emot? Två: vad skulle jag säga till en kompis som hade samma tanke? Tre: hitta ett rättvisare sätt att tänka.","Robin kan säga: ”Jag har övat, och jag har klarat tal förut. Jag kanske blir nervös, men det går att klara.” Det är inte positivare, det är rättvisare.","Det betyder inte att man ska trycka bort rädslan. Rädslan får finnas, och man kan ändå testa tanken."]},
    {t:"Skriv och läs upp", min:7, slide:4, gor:"Gå runt. Läs inte upp elevernas texter inför klassen utan tillåtelse. "+NGOR+" Hjälp med frågorna på bilden.", manus:["Nu skriver ni i fem minuter. Hitta på en tanke hos en påhittad person, eller välj Robins. Skriv: Vilken tankefälla kan det vara? Vad säger bevisen för och emot? Vad skulle personen säga till en kompis? Vad är en rättvisare tanke?","Skriv om en påhittad person, inte om er själva. Läs sedan upp din text för personen bredvid."]},
    {t:"Avslut", min:1, slide:5, manus:["Idag har vi sett att tankar inte alltid är fakta, att några tankefällor är vanliga och att man kan testa en tanke med tre frågor.","Om tankar gör det mycket svårt att leva kan du prata med en vuxen. Elevhälsan och skolans personal finns."]}
  ],
  exempel:[["Robin och talet","Robin tänker att allt kommer gå fel och alla kommer skratta, och testar tanken med bevis och en kompis syn."],["Sasha och provet","Sasha tänker ”jag är helt värdelös” efter ett dåligt resultat och hittar en rättvisare tanke."],["Kim och gruppen","Kim tänker att alla i gruppen tycker illa om Kim, men har ingen bevis för det."]],
  fragor:["Vilka tankefällor känner du igen hos påhittade personer?","Vad är skillnaden mellan en positivare och en rättvisare tanke?","Vad skulle du säga till en kompis med samma tanke?"],
  anpassningar:[["Mer stöd","Ge en färdig mall med de tre frågorna och exempel på tankefällor."],["Fördjupning","Koppla till steg 3 i modellen i sex steg: Förstå."],["Skrivande","Elever som har svårt att skriva kan säga sin text muntligt till kompisen eller få hjälp att skriva ner den."],["Pauser","Elever får gå ut en stund i lugn och ro."]],
  trygghet:[T_ALLA,T_RESPEKT,"Ingen elev behöver berätta om egna tankar. Eleverna skriver om påhittade personer och läser upp sina texter för en kompis.","Tankefällor är vanliga och inget tecken på att något är fel. Håll tonen nyfiken och inte rättande.","Rättvisare tankar är inte alltid positiva. Målet är att tänka sanningsenligt och inte att tvinga fram positivt tänkande.",T_RUTIN,SKYDD],
  avslut:"Avsluta med att tankar inte alltid är fakta, att några tankefällor är vanliga, att man kan testa en tanke med tre frågor och att målet är rättvisare tankar, inte alltid positivare.",
  slides:[
    `<div class="slide"><h2 class="big">Tankefällor</h2><p>Att testa en tanke</p><p class="tagline">13–15 år · Nya sätt att tänka och handla</p></div>`,
    `<div class="slide"><h2>Robins tanke</h2><div class="timeline"><div class="tl"><b>1</b>Robin ska hålla ett kort tal i morgon.</div><div class="tl"><b>2</b>Robin tänker: ”Jag kommer glömma allt, och alla kommer skratta.”</div><div class="tl"><b>3</b>Robin blir spänd och sover dåligt.</div></div></div>`,
    `<div class="slide"><h2>Fyra tankefällor</h2><div class="two"><div class="panel a"><h3>Katastroftänk</h3><p>Det blir säkert en katastrof.</p></div><div class="panel b"><h3>Tankeläsning</h3><p>Jag vet att de tycker illa om mig.</p></div><div class="panel a"><h3>Allt eller inget</h3><p>Jag är helt värdelös.</p></div><div class="panel b"><h3>Skuld på mig själv</h3><p>Det är mitt fel.</p></div></div></div>`,
    `<div class="slide"><h2>Testa tanken</h2>${nsteps(["Vilka bevis finns för tanken, och vilka finns emot?","Vad skulle jag säga till en kompis med samma tanke?","Hitta ett rättvisare sätt att tänka."])}<p class="tagline">Rättvisare är inte samma sak som positivare.</p></div>`,
    `<div class="slide"><h2>Skriv om en person</h2><ul class="q-list"><li>En tanke hos en påhittad person.</li><li>Vilken tankefälla kan det vara?</li><li>Vad säger bevisen, och vad skulle personen säga till en kompis?</li><li>En rättvisare tanke.</li></ul><p class="tagline">Skriv om en påhittad person, inte om dig själv. Läs upp för kompisen bredvid.</p></div>`,
    `<div class="slide"><h2 class="big">Tankar är inte fakta.</h2><p>Du kan testa dem.</p><p class="tagline">Stöd finns: elevhälsan och vuxna på skolan.</p></div>`
  ]};

EX[23] = {n:23, niva:6, titel:"Tanke, känsla, handling.", omr:"nyasatt", tagline:"16–19 år · Nya sätt att tänka och handla",
  ingress:"Övning för gymnasiet om hur situation, tanke, känsla och handling hänger ihop, och om att prova ett litet experiment.",
  syfte:["Eleverna får se att det finns flera led mellan en händelse och en handling. Mellan dem finns tanken och känslan, och där kan man göra något annat. De får se att en tanke kan undersökas, och att ett litet experiment kan visa om en tanke stämmer. De får också höra att man först vågar känna och inte trycker bort känslan."],
  intro:"Övningen utgår från en påhittad person, Mika, och eleverna skriver om en påhittad person och läser upp sin text för en kompis. Poängen är att förstå kedjan och prova något litet, inte att analysera sina egna problem.",
  material:["Skärm eller projektor för klassrumsläget.","Papper och pennor, eller digital anteckningsyta.","Inga personuppgifter samlas in."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om hur situation, tanke, känsla och handling hänger ihop, och om hur man kan prova ett annat sätt att se och göra.","Vi utgår från en påhittad person, Mika. Det du skriver senare handlar om en påhittad person, och du läser upp det för personen bredvid. Ingen tvingas, och du kan säga till mig om något känns jobbigt. "+ALDRE]},
    {t:"Mikas lektion", min:3, slide:1, gor:"Ta emot några svar. Peka inte ut vad någon själv har upplevt.", manus:["Läs situationen. Mika räcker upp handen och ställer en fråga på lektionen. Någon suckar. Mika tänker: ”Jag är dum.” Mika skäms, rodnar och slutar ställa frågor.","Vad händer med Mika? Prata med personen bredvid er i en minut."]},
    {t:"Kedjan", min:5, slide:2, manus:["Titta på kedjan: situation, tanke, känsla och kropp, handling. En händelse leder inte direkt till en handling. Tanken i mitten påverkar känslan, och känslan påverkar vad vi gör.","Mikas tanke ”Jag är dum” ger skam, och skammen gör att Mika drar sig undan. Då får Mika aldrig veta om tanken stämmer.","Först vågar vi känna skammen och inte trycka bort den. Sedan kan vi undersöka tanken."]},
    {t:"Ett annat sätt att se, och ett experiment", min:6, slide:3, manus:["Fyra steg. Ett: fånga tanken, alltså vad tänkte jag precis? Två: vad vet jag, och vad vet jag inte? Mika vet inte varför personen suckade. Tre: hitta en rimligare tanke, till exempel ”Någon var kanske trött, och min fråga var rimlig.” Fyra: prova ett litet experiment.","Mikas experiment kan vara att ställa en kort fråga nästa lektion och se vad som händer. Det ska vara litet och möjligt. Experimentet visar om den gamla tanken stämde."]},
    {t:"Skriv och läs upp", min:7, slide:4, gor:"Gå runt. Läs inte upp elevernas texter inför klassen utan tillåtelse. "+NGOR+" Hjälp med frågorna på bilden.", manus:["Nu skriver ni i fem minuter. Välj Mika eller hitta på en egen person. Skriv: Situationen. Tanken. Känslan och kroppen. Vad personen gjorde. En rimligare tanke. Ett litet experiment.","Skriv om en påhittad person, inte om er själva. Läs sedan upp din text för personen bredvid."]},
    {t:"Avslut", min:2, slide:5, manus:["Idag har vi sett att situation, tanke, känsla och handling hänger ihop, att en tanke kan undersökas och att ett litet experiment visar vad som stämmer.","Om tankar och känslor tar mycket plats och är svåra att ändra på egen hand finns elevhälsan och vuxna här på skolan."]}
  ],
  exempel:[["Mika och suckandet","Mika tänker ”Jag är dum” när någon suckar och drar sig undan. Mika provar att ställa en fråga igen."],["Lee och kommentaren","Lee tolkar en kort kommentar som kritik och slutar skicka in arbete, men frågar läraren vad kommentaren betydde."],["Sasha och svaret","Sasha tror att kompisen är arg eftersom svaret dröjer, och frågar en dag senare hur kompisen har det."]],
  fragor:["Hur kan en tanke påverka vad vi gör?","Vad kan ett litet experiment visa?","Varför är det bra att våga känna innan man undersöker tanken?"],
  anpassningar:[["Mer stöd","Ge en färdig mall med kedjan och de fyra stegen."],["Fördjupning","Koppla till övningen Tankefällor och att testa tanken, och till steg 3 i modellen i sex steg."],["Skrivande","Elever som har svårt att skriva kan säga sin text muntligt till kompisen eller få hjälp att skriva ner den."],["Pauser","Elever får gå ut en stund i lugn och ro."]],
  trygghet:[T_ALLA,T_RESPEKT,"Ingen elev behöver berätta om egna tankar. Eleverna skriver om påhittade personer och läser upp sina texter för en kompis.","Ämnet kan beröra elever som ofta tänker hårt om sig själva. Använd vardagliga exempel och betona att man inte behöver ändra en tanke direkt.",T_RUTIN,SKYDD],
  avslut:"Avsluta med att situation, tanke, känsla och handling hänger ihop, att en tanke kan undersökas, att ett litet experiment visar vad som stämmer, och att elevhälsan finns om tankar och känslor är svåra att ändra på egen hand.",
  slides:[
    `<div class="slide"><h2 class="big">Tanke, känsla, handling</h2><p>Kedjan och ett litet experiment</p><p class="tagline">16–19 år · Nya sätt att tänka och handla</p></div>`,
    `<div class="slide"><h2>Mikas lektion</h2><div class="timeline"><div class="tl"><b>1</b>Mika räcker upp handen och ställer en fråga. Någon suckar.</div><div class="tl"><b>2</b>Mika tänker: ”Jag är dum.” Mika skäms och rodnar.</div><div class="tl"><b>3</b>Mika slutar ställa frågor.</div></div></div>`,
    `<div class="slide"><h2>Kedjan</h2><div class="flow"><span class="schip on">Situation</span><i>→</i><span class="schip">Tanke</span><i>→</i><span class="schip">Känsla och kropp</span><i>→</i><span class="schip">Handling</span></div><p style="margin-top:2.4cqw">En händelse leder inte direkt till en handling. Mellan dem finns tanken och känslan, och där kan man göra något annat. Först vågar vi känna, sedan undersöker vi tanken.</p></div>`,
    `<div class="slide"><h2>Ett annat sätt att se</h2>${nsteps(["Fånga tanken: vad tänkte jag precis?","Vad vet jag, och vad vet jag inte?","Hitta en rimligare tanke.","Prova ett litet experiment."])}</div>`,

    `<div class="slide"><h2 class="big">Ett litet experiment visar vad som stämmer.</h2><p>Först känna, sedan undersöka.</p><p class="tagline">Stöd finns: elevhälsan och vuxna på skolan.</p></div>`

EX[24] = {n:24, niva:2, titel:"Vad kroppen behöver varje dag.", omr:"lugn", tagline:"6–8 år · Lugn och balans",
  ingress:"Övning för förskoleklass till årskurs 2 om att kroppen behöver sömn, rörelse, mat och vatten och att vara med andra.",
  syfte:["Eleverna får höra att kroppen behöver sömn, rörelse, mat och vatten och att vara med andra, och att känslor kan bli större när kroppen är trött eller hungrig. De övar på en lugn kvällsrutin."],
  intro:"Övningen utgår från en påhittad person, Lo. Eleverna mimar en kvällsrutin och pratar om vad som hjälper Lo. Håll det lekfullt och utan krav. Ingen behöver berätta något om sig själv eller sin familj.",
  material:["Skärm eller projektor för klassrumsläget.","Inget annat behövs."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om vad kroppen behöver varje dag för att må bra.","Vi är snälla mot varandra och lyssnar på varandra."]},
    {t:"Fyra saker", min:4, slide:1, manus:["Titta på bilderna. Kroppen behöver fyra saker varje dag. Sömn, för att vila och hämta kraft. Att röra på sig, för att kroppen vill röra sig. Mat och vatten. Och att vara med andra, som kompisar och familj.","När kroppen inte får det den behöver kan känslorna bli större. Trött eller hungrig kan göra att man blir arg eller ledsen lättare."]},
    {t:"Sov gott", min:4, slide:2, gor:"Låt barnen mima stegen. Allt är lekfullt, och ingen behöver ställa upp om hen inte vill.", manus:["Hur kan man göra för att sova gott? Titta på tre steg. Lägg undan skärmen. Borsta tänderna och ta på pyjamas. Ha en lugn stund, till exempel med en bok eller en kram.","Vi låtsas att vi gör det här tillsammans, steg för steg. Vi gäspar och sträcker oss."]},
    {t:"Vad hjälper Lo?", min:4, slide:3, manus:["Lo är en påhittad person. Titta på tre dagar. Lo är trött och arg. Lo är hungrig och sur. Lo har suttit still hela dagen och är rastlös. Vad hjälper Lo? Sova, äta eller röra på sig?","Prata med personen bredvid er och peka på vad som hjälper Lo i varje dag."]},
    {t:"Avslut", min:2, slide:4, manus:["Idag har vi sett att kroppen behöver sömn, rörelse, mat och vatten, och att vara med andra. Känslorna kan bli större när kroppen är trött eller hungrig.","Om du ofta är trött eller orolig kan du berätta för en trygg vuxen. Bra jobbat!"]}
  ],
  exempel:[["Lo är trött och arg","Lo sov dåligt och blir arg för en liten sak. När Lo har vilat blir det lättare."],["Lo är hungrig och sur","Lo har inte ätit och blir sur. Efter en frukt känns det bättre."],["Lo är rastlös","Lo har suttit still hela dagen och hoppar en stund. Då blir kroppen lugnare."]],
  fragor:["Vad behöver kroppen varje dag?","Vad kan hända med känslorna när man är trött?","Vad kan man göra före läggdags?"],
  anpassningar:[["Bildstöd","Använd bilderna och låt eleverna peka."],["Mindre grupper","Dela klassen i halvgrupper vid behov."],["Rörelse","Elever kan mima sittande."],["Språk","Skriv upp orden sömn, rörelse, mat och vatten."]],
  trygghet:[T_ALLA,T_RESPEKT,"Ingen elev behöver berätta om sin familj, sina vanor eller sin kväll.","Elevers hemförhållanden kan skilja sig mycket. Undvik att jämföra eller fråga hur många timmar någon sover, och låt Lo vara den som pratar.","Om ett barn berättar något som väcker oro, till exempel att det ofta är hungrigt eller trött: följ skolans rutiner och kontakta elevhälsan.",SKYDD],
  avslut:"Sammanfatta att kroppen behöver sömn, rörelse, mat och vatten och att vara med andra, att känslor kan bli större när man är trött eller hungrig, och att man kan berätta för en trygg vuxen.",
  slides:[
    `<div class="slide"><div class="face-slide"><div class="fbig">${IK.manen()}</div><div><h2 class="big">Vad kroppen behöver varje dag</h2></div></div></div>`,
    `<div class="slide"><h2>Kroppen behöver</h2><div class="ikgrid"><div>${IK.manen()}Sova</div><div>${IK.hoppa()}Röra på sig</div><div>${IK.frukt()}Äta och dricka</div><div>${IK.trygg()}Vara med andra</div></div></div>`,
    `<div class="slide"><h2>Sov gott</h2>${nsteps(["Lägg undan skärmen.","Borsta tänderna och ta på pyjamas.","Lugn stund: en bok eller en kram."])}</div>`,
    `<div class="slide"><h2>Vad hjälper Lo?</h2><div class="three-col"><div class="bubble"><small>Dag 1</small>Lo är trött och arg.</div><div class="bubble"><small>Dag 2</small>Lo är hungrig och sur.</div><div class="bubble"><small>Dag 3</small>Lo har suttit still hela dagen och är rastlös.</div></div><p style="margin-top:2cqw">Sova, äta eller röra på sig?</p></div>`,
    `<div class="slide"><h2 class="big">Kroppen mår bra av sömn, rörelse, mat och vatten.</h2><p>Och av att vara med andra.</p></div>`
  ]};

EX[25] = {n:25, niva:4, titel:"Sömn och skärm.", omr:"lugn", tagline:"11–12 år · Lugn och balans",
  ingress:"Övning för årskurs 5–6 om hur sömn och skärm påverkar hur vi mår, och om små ändringar som kan hjälpa.",
  syfte:["Eleverna får se att sömn hjälper kroppen och känslorna, att trötthet kan göra känslor större, och att små ändringar i kvällsrutinen kan göra det lättare att sova. De övar på att planera tre små ändringar för en påhittad person."],
  intro:"Övningen utgår från en påhittad person, Lo, och eleverna skriver om Lo och läser upp för en kompis. Tonen ska vara nyfiken och utan skuld. Jämför inte elevers vanor, och fråga inte hur länge någon sover eller har skärm.",
  material:["Skärm eller projektor för klassrumsläget.","Papper och pennor.","Inga personuppgifter eller tester behövs."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om sömn och skärm, och om hur de påverkar hur vi mår.","Vi utgår från en påhittad person, Lo. Ingen behöver berätta något om sig själv. "+YNGRE]},
    {t:"Los kväll", min:3, slide:1, gor:"Ta emot några svar. Peka inte ut vad någon själv har upplevt.", manus:["Läs om Lo. Lo scrollar i sängen långt efter läggdags. Nästa dag är Lo trött och orkar inte. Små saker känns stora, och Lo blir snabbt sur.","Vad tror ni händer i Los kropp? Prata med personen bredvid er i en minut."]},
    {t:"Varför sömn spelar roll", min:5, slide:2, manus:["Sömn hjälper kroppen att vila och hämta kraft, och den hjälper oss att minnas det vi lärt oss och att hantera känslor. Barn i den här åldern behöver ofta ungefär nio till tolv timmars sömn.","När vi är trötta blir känslorna ofta större, det är svårare att koncentrera sig och lättare att bli sur. Det är kroppen som behöver vila, och det är inget fel på dig.","Skärmar kan göra det svårare att somna, särskilt när man scrollar länge. Det gäller inte bara Lo."]},
    {t:"Tre små ändringar", min:5, slide:3, manus:["Här är tre små ändringar som Lo kan prova. Bestäm en tid då skärmen vilar. Lägg telefonen utanför sängen. Gör något lugnt innan du somnar, till exempel lyssna på musik, läsa eller andas långsamt.","Små ändringar är lättare att klara än stora. Och de behöver inte vara perfekta."]},
    {t:"Skriv två och två", min:5, slide:4, gor:"Gå runt. "+NGOR+" Läs inte upp elevernas texter inför klassen utan tillåtelse.", manus:["Nu skriver ni två och två i tre minuter. Skriv tre små ändringar som Lo kan prova, vad som kan göra det svårt och hur Lo kan se att det hjälper.","Läs sedan upp din text för personen bredvid. Ni pratar om Lo, inte om er själva."]},
    {t:"Avslut", min:1, slide:5, manus:["Idag har vi sett att sömn hjälper kroppen och känslorna, att trötthet kan göra känslor större, och att små ändringar kan göra det lättare att sova.","Om du ofta har svårt att sova eller är orolig kan du prata med en trygg vuxen eller elevhälsan."]}
  ],
  exempel:[["Lo och mobilen","Lo scrollar i sängen och är trött dagen efter, och provar att lägga mobilen utanför sängen."],["Ines och läxan","Ines sitter sent med läxor och sover för lite, och bestämmer en tid då skärmen och läxorna vilar."],["Mika och spelet","Mika spelar till sent och är sur på morgonen, och provar att sluta en halvtimme tidigare."]],
  fragor:["Hur kan trötthet påverka känslor?","Vilka små ändringar är lätta att klara?","Vad kan göra det svårt att ändra en vana?"],
  anpassningar:[["Mer stöd","Ge tre färdiga ändringar att välja bland."],["Fördjupning","Låt eleverna planera en vecka för Lo."],["Skrivande","Elever som har svårt att skriva kan säga sin text muntligt till kompisen eller få hjälp att skriva ner den."],["Språk","Skriv upp orden sömn, vana, rutin och ändring."]],
  trygghet:[T_ALLA,T_RESPEKT,"Ingen elev behöver berätta om sina sömn- eller skärmvanor. Eleverna skriver om Lo.","Elevers hemförhållanden skiljer sig mycket. Jämför inte vanor, och fråga inte hur länge någon sover eller sitter vid skärmen.","Om en elev berättar att hen ofta inte kan sova eller mår dåligt: följ skolans rutiner och kontakta elevhälsan.",SKYDD],
  avslut:"Sammanfatta att sömn hjälper kroppen och känslorna, att trötthet kan göra känslor större, och att små ändringar i kvällsrutinen kan göra det lättare att sova.",
  slides:[
    `<div class="slide"><h2 class="big">Sömn och skärm</h2><p>Kroppen och sömnen</p><p class="tagline">11–12 år · Lugn och balans</p></div>`,
    `<div class="slide"><h2>Los kväll</h2><div class="timeline"><div class="tl"><b>1</b>Lo scrollar i sängen långt efter läggdags.</div><div class="tl"><b>2</b>Nästa dag är Lo trött och orkar inte.</div><div class="tl"><b>3</b>Små saker känns stora, och Lo blir snabbt sur.</div></div></div>`,
    `<div class="slide"><h2>Sömn och trötthet</h2><div class="two"><div class="panel b"><h3>Sömn hjälper kroppen</h3><p>Att vila och hämta kraft, minnas det vi lärt oss och hantera känslor.</p></div><div class="panel a"><h3>När vi är trötta</h3><p>Känslor blir större, det är svårare att koncentrera sig och lättare att bli sur.</p></div></div></div>`,
    `<div class="slide"><h2>Tre små ändringar</h2>${nsteps(["Bestäm en tid då skärmen vilar.","Lägg telefonen utanför sängen.","Gör något lugnt: musik, en bok eller långsam andning."])}</div>`,
    `<div class="slide"><h2>Skriv två och två</h2><ul class="q-list"><li>Tre små ändringar som Lo kan prova.</li><li>Vad kan göra det svårt?</li><li>Hur ser Lo att det hjälper?</li></ul><p class="tagline">Skriv om Lo, inte om dig själv. Läs upp för kompisen bredvid.</p></div>`,
    `<div class="slide"><h2 class="big">Små ändringar räknas.</h2><p>Sömn hjälper kroppen och känslorna.</p></div>`
  ]};

EX[26] = {n:26, niva:6, titel:"Mina vardagsgrunder: ett litet experiment.", omr:"lugn", tagline:"16–19 år · Lugn och balans",
  ingress:"Övning för gymnasiet om vardagsgrunderna sömn, rörelse, mat och vila, skärm och kontakt, och om att planera ett litet experiment för en påhittad person.",
  syfte:["Eleverna får se att vardagsgrunderna påverkar energi och mående, att man kan börja med något litet även när energin är låg, och hur man planerar ett litet experiment för en vecka. De övar på att planera för en påhittad person."],
  intro:"Övningen utgår från en påhittad person, Jo, och eleverna skriver om en påhittad person och läser upp sin text för en kompis. Fokus är energi och mående, inte prestation, vikt eller träning som mål. Jämför inte elevers vanor.",
  material:["Skärm eller projektor för klassrumsläget.","Papper och pennor, eller digital anteckningsyta.","Inga personuppgifter samlas in."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om vardagsgrunderna: sömn, rörelse, mat och vila, skärm och att träffa andra, och om hur man kan prova en liten förändring.","Vi utgår från en påhittad person, Jo. Det du skriver senare handlar om en påhittad person, och du läser upp det för personen bredvid. Ingen tvingas, och du kan säga till mig om något känns jobbigt. "+ALDRE]},
    {t:"Jos vecka", min:3, slide:1, gor:"Ta emot några svar. Peka inte ut vad någon själv har upplevt.", manus:["Läs situationen. Jo har låg energi. Jo sover oregelbundet, har slutat röra på sig och träffar sällan kompisar. Det känns tungt att börja något.","Vad kan hända när man gör mindre och mindre? Prata med personen bredvid er i en minut."]},
    {t:"Fem vardagsgrunder", min:5, slide:2, manus:["Titta på de fem vardagsgrunderna: sömn, rörelse, mat och vila, skärm och kontakt med andra. De påverkar hur vi mår och hur mycket energi vi har, och de påverkar varandra.","När energin är låg är det lätt att dra sig undan och göra mindre. Men det tunga känns ofta lättare efter att man har gjort något litet, än innan. Därför börjar man med det minsta.","Det här handlar om energi och mående, inte om prestation, vikt eller att vara perfekt."]},
    {t:"Börja litet", min:5, slide:3, manus:["Fyra steg. Ett: välj en grund. Två: gör den liten och möjlig, till exempel en tio minuters promenad eller att lägga telefonen utanför sovrummet. Tre: planera när och hur. Fyra: följ upp hur det kändes, och justera.","Om det inte går första gången är det okej. Då gör man den ännu mindre."]},
    {t:"Skriv och läs upp", min:8, slide:4, gor:"Gå runt. Läs inte upp elevernas texter inför klassen utan tillåtelse. "+NGOR+" Hjälp med frågorna på bilden.", manus:["Nu skriver ni i sex minuter. Välj Jo eller hitta på en egen person. Skriv ett experiment för en vecka: vilken grund, hur litet, när och hur, vad som kan komma i vägen och hur personen ser om det hjälper.","Skriv om en påhittad person, inte om er själva. Läs sedan upp din text för personen bredvid, i två minuter."]},
    {t:"Avslut", min:2, slide:5, manus:["Idag har vi sett att vardagsgrunderna påverkar hur vi mår, att små steg räknas och att man kan göra något litet även när energin är låg.","Om energin är låg under lång tid, eller du mår tungt, kan du prata med elevhälsan eller en vuxen du litar på."]}
  ],
  exempel:[["Jo och promenaden","Jo har låg energi och bestämmer sig för en tio minuters promenad tre dagar i veckan."],["Lee och telefonen","Lee scrollar sent och är trött, och lägger telefonen utanför sovrummet i en vecka."],["Mika och kompisen","Mika har slutat träffa vänner och bestämmer sig för att skicka ett meddelande till en kompis varje vecka."]],
  fragor:["Varför kan en liten förändring vara lättare än en stor?","Vad kan komma i vägen, och vad kan man göra då?","Hur kan man se att något hjälper?"],
  anpassningar:[["Mer stöd","Ge en färdig mall med de fem frågorna."],["Fördjupning","Koppla till övningen Sömn och skärm och till verktygen i Verktygslådan."],["Skrivande","Elever som har svårt att skriva kan säga sin text muntligt till kompisen eller få hjälp att skriva ner den."],["Pauser","Elever får gå ut en stund i lugn och ro."]],
  trygghet:[T_ALLA,T_RESPEKT,"Ingen elev behöver berätta om egna vanor. Eleverna skriver om påhittade personer och läser upp sina texter för en kompis.","Ämnet kan beröra elever som har svårt med sömn, mat, rörelse eller mående. Använd vardagliga exempel, och prata inte om vikt, kost eller träning som mål. Fokusera på energi och mående.","Om en elev berättar att hen under lång tid har låg energi eller mår tungt: lyssna lugnt och kontakta elevhälsan enligt skolans rutiner.",T_RUTIN,SKYDD],
  avslut:"Avsluta med att vardagsgrunderna påverkar energi och mående, att små steg räknas och att man kan börja med något litet även när energin är låg, och att elevhälsan finns om man mår tungt under lång tid.",
  slides:[
    `<div class="slide"><h2 class="big">Mina vardagsgrunder</h2><p>Ett litet experiment</p><p class="tagline">16–19 år · Lugn och balans</p></div>`,
    `<div class="slide"><h2>Jos vecka</h2><div class="timeline"><div class="tl"><b>1</b>Jo har låg energi.</div><div class="tl"><b>2</b>Jo sover oregelbundet, har slutat röra på sig och träffar sällan kompisar.</div><div class="tl"><b>3</b>Det känns tungt att börja något.</div></div></div>`,
    `<div class="slide"><h2>Fem vardagsgrunder</h2><div class="chips6"><span class="schip">Sömn</span><span class="schip">Rörelse</span><span class="schip">Mat och vila</span><span class="schip">Skärm</span><span class="schip">Kontakt med andra</span></div><p style="margin-top:2.4cqw">Små förändringar i en av dem kan ge mer energi.</p></div>`,
    `<div class="slide"><h2>Börja litet</h2>${nsteps(["Välj en grund.","Gör den liten och möjlig: 5–10 minuter.","Planera när och hur.","Följ upp: hur kändes det?"])}<p class="tagline">Orkar man inte mycket: börja med det allra minsta.</p></div>`,
    `<div class="slide"><h2>Skriv om en person</h2><ul class="q-list"><li>Vilken grund väljer personen?</li><li>Hur litet, och när och hur?</li><li>Vad kan komma i vägen, och vad gör personen då?</li><li>Hur ser personen att det hjälper?</li></ul><p class="tagline">Skriv om en påhittad person, inte om dig själv. Läs upp för kompisen bredvid.</p></div>`,
    `<div class="slide"><h2 class="big">Små steg räknas.</h2><p>Det går att börja litet, även när energin är låg.</p><p class="tagline">Stöd finns: elevhälsan och vuxna på skolan.</p></div>`
  ]};

const T_UTANFOR = "Ämnet kan beröra elever som ofta står utanför eller blir utanför. Betona att det aldrig är deras fel. Fråga inte vilka som är utanför, och peka inte ut någon.";

EX[27] = {n:27, niva:1, titel:"Alla får vara med.", omr:"andra", tagline:"3–5 år · Förstå andra människor",
  ingress:"Övning för förskolan om att alla hör till, att fråga ”Får jag vara med?” och att bjuda in andra.",
  syfte:["Barnen får höra att alla hör till och får vara med. De övar på att fråga ”Får jag vara med?” och att säga ”Kom, du får vara med!”, och får veta att man kan gå till en trygg vuxen om någon inte får vara med."],
  intro:"Övningen leds av pedagogen med handdockorna Mimmi och Nisse, eller två gosedjur. Håll tonen lugn och lekfull. Barnen övar meningarna i kör, och ingen behöver prata ensam. Ingen behöver berätta om egna upplevelser.",
  material:["Skärm eller projektor för klassrumsläget.","Handdockorna Mimmi och Nisse, eller två gosedjur.","Inget annat behövs."],
  steg:[
    {t:"Välkommen", min:1, slide:0, manus:["Hej allihop! Idag pratar vi om att alla får vara med.","Mimmi och Nisse hjälper oss. Vi är snälla mot varandra och lyssnar på varandra."]},
    {t:"Mimmi vill vara med", min:3, slide:1, gor:"Peka på ansiktskorten. Det finns inga fel svar.", manus:["Nisse bygger ett torn. Mimmi kommer fram och vill vara med. Mimmi blir ledsen om Nisse säger nej. Hur känns det för Mimmi? Peka på ett ansikte.","Alla vill höra till. Det är en stor känsla."]},
    {t:"Fråga och bjud in", min:3, slide:2, gor:"Låt barnen säga meningarna i kör. Ingen behöver säga dem ensam. Håll det lekfullt.", manus:["Vi kan fråga: ”Får jag vara med?” Säg det tillsammans med mig!","Och vi kan säga: ”Kom, du får vara med!” Säg det också tillsammans.","Nisse säger: ”Ja, kom!” och gör plats. Mimmi blir glad."]},
    {t:"Om någon inte får vara med", min:3, slide:3, manus:["Ibland säger någon: ”Nej, du får inte vara med.” Hur känns det? Då kan vi göra tre saker. Vi kan säga att det inte känns bra. Vi kan bjuda in någon annan. Eller så går vi till en trygg vuxen.","Trygga vuxna hjälper alltid till. Det är inte att skvallra, det är att be om hjälp."]},
    {t:"Öva två och två", min:3, slide:4, gor:"Gå runt och hjälp barn som fastnar. Barn som inte vill kan titta på.", manus:["Nu övar vi två och två med varsin docka eller gosedjur. En frågar: ”Får jag vara med?” Den andra svarar: ”Ja, kom!” Byt sedan."]},
    {t:"Avslut", min:1, slide:5, manus:["Bra jobbat! Idag har vi sett att alla får vara med. Vi kan fråga och bjuda in. Och vi kan gå till en trygg vuxen.","Nu säger vi tillsammans: ”Kom, du får vara med!”"]}
  ],
  exempel:[["Mimmi och tornet","Mimmi frågar ”Får jag vara med?” och Nisse svarar ”Ja, kom!”"],["Nisse och leken","Nisse ser att Mimmi står ensam och säger ”Vill du leka med mig?”"],["Mimmi och den trygga vuxna","Någon säger nej till Mimmi, och Mimmi går till en trygg vuxen och säger ”Det känns inte bra.”"]],
  fragor:["Vad kan man säga om man vill vara med?","Vad kan man säga om någon annan vill vara med?","Vem kan man gå till om någon inte får vara med?"],
  anpassningar:[["Tecken och bilder","Använd tecken som stöd (TAKK) för ”får jag vara med” och ”kom”."],["Mindre grupp","Dela barngruppen i två om den är stor."],["Röst","Barn kan säga meningarna högt, viska eller visa med handen."],["Korta stunder","Dela övningen i två tillfällen om barnen blir rastlösa."]],
  trygghet:[T_ALLA,T_RESPEKT,"Inget barn behöver berätta något om sig själv.",T_UTANFOR,"Om ett barn ofta står utanför eller berättar att andra är elaka: prata med barnets pedagog och elevhälsan, och följ förskolans rutiner.",SKYDD],
  avslut:"Avsluta med att alla får vara med, att man kan fråga ”Får jag vara med?” och säga ”Kom, du får vara med!”, och att man kan gå till en trygg vuxen.",
  slides:[
    `<div class="slide"><div class="face-slide"><div class="fbig">${IK.trygg()}</div><div><h2 class="big">Alla får vara med</h2><p>Mimmi och Nisse</p></div></div></div>`,

    `<div class="slide"><h2>Vi kan säga</h2><div class="three-col" style="grid-template-columns:1fr 1fr"><div class="bubble good"><small>Fråga</small>”Får jag vara med?”</div><div class="bubble good"><small>Bjud in</small>”Kom, du får vara med!”</div></div></div>`,
    `<div class="slide"><h2>Om någon inte får vara med</h2><div class="chips6"><span class="schip">Säg att det inte känns bra</span><span class="schip">Bjud in någon annan</span><span class="schip">Gå till en trygg vuxen</span></div></div>`,
    `<div class="slide"><h2>Öva två och två</h2><div class="flow"><span class="schip on">Får jag vara med?</span><i>→</i><span class="schip">Ja, kom!</span></div></div>`,

EX[28] = {n:28, niva:2, titel:"Att vara en bra kompis.", omr:"andra", tagline:"6–8 år · Förstå andra människor",
  ingress:"Övning för förskoleklass till årskurs 2 om vänskap, att bjuda in och vad man kan göra när man själv blir utanför.",
  syfte:["Eleverna får se tre sätt att vara en bra kompis: bjuda in, lyssna och vara snäll. De får också höra att det inte är något fel på den som blir utanför, och att man kan fråga, hitta någon annan att vara med eller gå till en trygg vuxen."],
  intro:"Övningen utgår från påhittade barn, Sam, Lo och Maja. Eleverna övar meningar två och två. Ingen behöver berätta något om sig själv. Poängen är att vänskap kan övas, och att man kan be om hjälp.",
  material:["Skärm eller projektor för klassrumsläget.","Inget annat behövs.","Inga personuppgifter eller tester behövs."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om att vara en bra kompis.","Vi utgår från påhittade barn, Sam, Lo och Maja. Ingen behöver berätta något om sig själv. Vi är snälla mot varandra och lyssnar på varandra."]},
    {t:"Sam på rasten", min:3, slide:1, gor:"Ta emot några svar. Det finns inga fel svar. Peka inte ut någon.", manus:["Lyssna på berättelsen. Sam står ensam vid staketet på rasten. Lo ser det.","Hur kan det kännas för Sam? Vad kan Lo göra? Peka på ett ansikte och berätta."]},
    {t:"Tre sätt att vara en bra kompis", min:4, slide:2, manus:["Lo kan bjuda in: ”Vill du vara med?” Det är det första sättet.","Det andra är att lyssna: ”Hur är det för dig?”","Det tredje är att vara snäll och säga något vänligt: ”Jag gillar när du …”","Vi kan alla öva på de här tre sätten."]},
    {t:"När man själv blir utanför", min:3, slide:3, manus:["Ibland är det vi som står utanför. Då kan vi fråga: ”Får jag vara med?”, hitta någon annan att leka med eller gå till en trygg vuxen.","Det är inget fel på dig om någon inte kan just nu. Alla får vara med."]},
    {t:"Öva två och två", min:3, slide:4, gor:"Gå runt och hjälp barn som fastnar. Låt dem börja med: Vill du vara med?", manus:["Nu övar ni två och två. Titta på korten på skärmen och välj ett. Ni spelar påhittade barn. En säger en vänlig mening, och den andra svarar. Byt sedan."]},
    {t:"Avslut", min:1, slide:5, manus:["Idag har vi sett tre sätt att vara en bra kompis: bjuda in, lyssna och vara snäll.","Om du är utanför kan du fråga, hitta någon annan eller gå till en trygg vuxen. Bra jobbat!"]}
  ],
  exempel:[["Sam och Lo","Sam står ensam på rasten, och Lo frågar: ”Vill du vara med?”"],["Maja och leken","Maja vill vara med i leken, frågar ”Får jag vara med?” och får ett ja."],["Lo och den ledsna kompisen","Lo ser att en kompis är ledsen och frågar: ”Hur är det för dig?”"]],
  fragor:["Vad kan man säga för att bjuda in någon?","Vad kan man göra om man själv blir utanför?","Vem kan man gå till om det känns svårt?"],
  anpassningar:[["Bildstöd","Använd bilderna och låt eleverna peka."],["Mindre grupper","Dela klassen i halvgrupper vid behov."],["Muntligt","Eleverna övar muntligt och behöver inte skriva."],["Språk","Skriv upp orden bjuda in, lyssna och vänlig."]],
  trygghet:[T_ALLA,T_RESPEKT,"Ingen elev behöver berätta något om sig själv.",T_UTANFOR,"Om ett barn ofta står utanför eller berättar att andra är elaka: prata med mentor och elevhälsan och följ skolans rutiner.",T_RUTIN,SKYDD],
  avslut:"Sammanfatta att man kan vara en bra kompis genom att bjuda in, lyssna och vara snäll, att det inte är något fel på den som blir utanför, och att man kan be en trygg vuxen om hjälp.",
  slides:[
    `<div class="slide"><div class="face-slide"><div class="fbig">${IK.trygg()}</div><div><h2 class="big">Att vara en bra kompis</h2><p>Sam, Lo och Maja</p></div></div></div>`,
    `<div class="slide"><h2>Sam på rasten</h2><div class="timeline"><div class="tl"><b>1</b>Sam står ensam vid staketet.</div><div class="tl"><b>2</b>Lo ser det.</div><div class="tl"><b>3</b>Vad kan Lo göra?</div></div></div>`,
    `<div class="slide"><h2>Tre sätt att vara en bra kompis</h2>${nsteps(["Bjud in: Vill du vara med?","Lyssna: Hur är det för dig?","Var snäll: säg något vänligt."])}</div>`,
    `<div class="slide"><h2>När man själv blir utanför</h2><div class="chips6"><span class="schip">Fråga: Får jag vara med?</span><span class="schip">Hitta någon annan</span><span class="schip">Gå till en trygg vuxen</span></div><p style="margin-top:2.4cqw">Det är inget fel på dig.</p></div>`,
    `<div class="slide"><h2>Öva två och två</h2><div class="three-col"><div class="bubble"><small>Kort A</small>Någon står ensam på rasten.</div><div class="bubble"><small>Kort B</small>Någon vill vara med i leken, men det är fullt.</div><div class="bubble"><small>Kort C</small>Någon blev ledsen av något du sa.</div></div><p style="margin-top:2cqw">En säger en vänlig mening. Den andra svarar. Byt sedan.</p></div>`,
    `<div class="slide"><h2 class="big">Vänskap kan man öva.</h2><div class="faces small">${["glad","stolt"].map(faceCard).join("")}</div></div>`
  ]};

EX[29] = {n:29, niva:3, titel:"Utanför och med.", omr:"andra", tagline:"9–10 år · Förstå andra människor",
  ingress:"Övning för årskurs 3–4 om att höra till, att bli utanför och om små handlingar som hjälper.",
  syfte:["Eleverna får se att ensam kan betyda olika saker: man kan vilja vara själv eller känna sig utanför. De lär sig små handlingar som hjälper den som är utanför och att man kan berätta för en vuxen."],
  intro:"Övningen utgår från påhittade personer, Ines, Mika och Jo. Eleverna övar muntligt två och två. Ingen behöver berätta något om sig själv. Fråga inte vilka som är utanför.",
  material:["Skärm eller projektor för klassrumsläget.","Inget annat behövs.","Inga personuppgifter eller tester behövs."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om att höra till, och om vad man kan göra när någon blir utanför.","Vi utgår från påhittade personer. Ingen behöver berätta något om sig själv. "+YNGRE]},
    {t:"Ines vid matbordet", min:3, slide:1, gor:"Ta emot några svar. Peka inte ut vad någon själv har upplevt.", manus:["Läs situationen. Ines sitter ensam vid matbordet. Alla andra sitter i grupper. Mika och Jo ser det.","Hur kan det vara för Ines? Vad kan Mika och Jo tänka? Prata med personen bredvid er i en minut."]},
    {t:"Olika skäl, olika behov", min:5, slide:2, manus:["Titta på bilden. Att vara ensam kan betyda olika saker. Vissa vill vara själva en stund. Andra känner sig utanför och vill vara med.","Vi kan inte alltid se skillnaden. Därför kan vi fråga: ”Vill du sitta med oss?” Det går bra att svara nej, och då har man ändå visat att man bryr sig.","Alla hör till, och det är inget fel på den som är utanför."]},
    {t:"Små handlingar som hjälper", min:5, slide:3, manus:["Här är fyra små handlingar. Titta och le. Fråga: ”Vill du sitta med oss?” Ta med någon i leken eller samtalet. Och berätta för en vuxen om någon ofta är utanför.","Små handlingar räcker ofta. Du behöver inte lösa allt själv."]},
    {t:"Öva två och två", min:5, slide:4, gor:"Gå runt och lyssna. Hjälp grupper som fastnat med frågan: Vad kan man säga?", manus:["Nu övar ni två och två. Titta på korten på skärmen och välj ett. Prata om en påhittad person i situationen. Vad kan en kompis göra? Vad kan man säga? Byt kort efter tre minuter.","Ni pratar om påhittade personer, inte om er själva."]},
    {t:"Avslut", min:1, slide:5, manus:["Idag har vi sett att ensam kan betyda olika saker, att små handlingar hjälper och att man kan berätta för en vuxen.","Om det känns svårt kan du alltid prata med en trygg vuxen."]}
  ],
  exempel:[["Ines vid matbordet","Ines sitter ensam, och Mika frågar: ”Vill du sitta med oss?”"],["Jo och den nya eleven","Jo ser en ny elev som går ensam och frågar om den nya eleven vill vara med i leken."],["Mika och gruppchatten","Mika märker att en kompis aldrig får svar i gruppchatten och skriver direkt till kompisen."]],
  fragor:["Hur kan man veta om någon vill vara själv eller känner sig utanför?","Vad kan man säga för att bjuda in någon?","När är det bra att berätta för en vuxen?"],
  anpassningar:[["Mer stöd","Skriv upp meningsstarten på tavlan: ”Vill du …?”"],["Fördjupning","Låt eleverna hitta på en egen situation och tre sätt att bjuda in."],["Muntligt","Eleverna övar muntligt och behöver inte skriva."],["Språk","Skriv upp orden utanför, höra till och bjuda in."]],
  trygghet:[T_ALLA,T_RESPEKT,"Ingen elev behöver berätta något om sig själv.",T_UTANFOR,"Om en elev ofta är utanför eller berättar att andra är elaka: prata med mentor och elevhälsan och följ skolans rutiner.",T_RUTIN,SKYDD],
  avslut:"Sammanfatta att ensam kan betyda olika saker, att små handlingar hjälper den som är utanför, och att man kan berätta för en vuxen.",
  slides:[
    `<div class="slide"><h2 class="big">Utanför och med</h2><p>Att höra till</p><p class="tagline">9–10 år · Förstå andra människor</p></div>`,
    `<div class="slide"><h2>Ines vid matbordet</h2><p>Ines sitter ensam vid matbordet. Alla andra sitter i grupper. Mika och Jo ser det.</p><p style="margin-top:2cqw">Hur kan det vara för Ines?</p></div>`,
    `<div class="slide"><h2>Ensam kan betyda olika saker</h2><div class="two"><div class="panel b"><h3>Vill vara själv</h3><p>Man vill vara för sig en stund. Det är okej.</p></div><div class="panel a"><h3>Känner sig utanför</h3><p>Man vill vara med men vet inte hur.</p></div></div><p class="tagline">Vi kan fråga: Vill du sitta med oss?</p></div>`,
    `<div class="slide"><h2>Små handlingar som hjälper</h2>${nsteps(["Titta och le.","Fråga: Vill du sitta med oss?","Ta med någon i leken eller samtalet.","Berätta för en vuxen om någon ofta är utanför."])}</div>`,
    `<div class="slide"><h2>Öva två och två</h2><div class="three-col"><div class="bubble"><small>Kort A</small>En ny elev på rasten.</div><div class="bubble"><small>Kort B</small>Någon går ensam hem.</div><div class="bubble"><small>Kort C</small>En kompis blir utanför i gruppchatten.</div></div><p style="margin-top:2cqw">Vad kan en kompis göra? Vad kan man säga?</p></div>`,
    `<div class="slide"><h2 class="big">Alla hör till.</h2><p>Små handlingar räcker ofta.</p></div>`
  ]};

EX[30] = {n:30, niva:4, titel:"Jämförelser och sociala medier.", omr:"sjalv", tagline:"11–12 år · Lär känna dig själv",
  ingress:"Övning för årskurs 5–6 om att det man ser på sociala medier är ett urval, och om hur jämförelser kan påverka hur man mår.",
  syfte:["Eleverna får se att det som läggs ut på sociala medier ofta är ett urval, att jämförelser är mänskliga men kan göra att man mår sämre, och att man kan fråga sig vad man ser och vad man inte ser. De övar på tre frågor och på vad man kan göra."],
  intro:"Övningen utgår från påhittade personer, Lo och Jo. Eleverna övar två och två med påhittade situationer. Ingen behöver visa eller berätta om egna konton. Prata inte om utseende eller kroppar. Fokus är urval och känslor.",
  material:["Skärm eller projektor för klassrumsläget.","Inget annat behövs.","Inga personuppgifter eller tester behövs."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om vad vi ser på sociala medier, och om hur jämförelser kan påverka hur vi mår.","Vi utgår från påhittade personer. Ingen behöver visa eller berätta om egna konton. "+YNGRE]},
    {t:"Los scrollning", min:3, slide:1, gor:"Ta emot några svar. Peka inte ut vad någon själv har upplevt.", manus:["Läs situationen. Lo scrollar och ser att Jo har en fin resa, en grupp kompisar och många gillningar. Lo känner sig sämre.","Varför kan Lo känna så? Prata med personen bredvid er i en minut."]},
    {t:"Det du ser är en bit", min:5, slide:2, manus:["Titta på bilden. Det som läggs ut är ofta ett urval. Man väljer bilder, tar bort sådant man inte vill visa och ändrar ibland. Det är en bit av livet och inte hela.","Att jämföra sig är mänskligt. Men om vi jämför vårt hela liv med andras bästa bitar kan vi känna oss sämre än vi borde.","Det betyder inte att alla låtsas. Det betyder att vi bara ser en del."]},
    {t:"Tre frågor", min:5, slide:3, manus:["Här är tre frågor som hjälper. Vad ser jag, och vad ser jag inte? Hur känns det i kroppen när jag scrollar? Vad kan jag göra?","Lo kan till exempel ta en paus, följa andra konton som ger en bra känsla, eller prata med en vän eller en vuxen. Ingen behöver göra allt."]},
    {t:"Öva två och två", min:5, slide:4, gor:"Gå runt och lyssna. Hjälp grupper som fastnat med första frågan: Vad ser man, och vad ser man inte?", manus:["Nu övar ni två och två. Titta på korten på skärmen och välj ett. Prata om en påhittad person i situationen: Vad ser personen? Vad ser personen inte? Vad kan personen göra?","Ni pratar om påhittade personer, inte om er själva. Ni har tre minuter. Byt sedan kort."]},
    {t:"Avslut", min:1, slide:5, manus:["Idag har vi sett att det vi ser på sociala medier är ett urval, att jämförelser är mänskliga och att man kan fråga sig vad man ser och inte ser.","Om det känns tungt kan du prata med en trygg vuxen."]}
  ],
  exempel:[["Lo och resan","Lo ser Jos fina resa och känner sig sämre, men tänker på vad Lo inte ser."],["Ines och gillningarna","Ines ser att en kompis fick många fler gillningar och tar en paus från skärmen."],["Mika och festbilden","Mika ser en festbild från ett tillfälle Mika inte var på och frågar kompisen om kvällen."]],
  fragor:["Vad ser man på sociala medier, och vad ser man inte?","Hur kan jämförelser påverka hur man mår?","Vad kan man göra när man märker att det känns tungt?"],
  anpassningar:[["Mer stöd","Skriv upp de tre frågorna på tavlan och använd bilderna som stöd."],["Fördjupning","Låt eleverna hitta på en egen situation och svara på de tre frågorna."],["Muntligt","Eleverna övar muntligt och behöver inte skriva."],["Språk","Skriv upp orden urval, jämföra och scrolla."]],
  trygghet:[T_ALLA,T_RESPEKT,"Ingen elev behöver visa eller berätta om egna konton eller inlägg.","Ämnet kan beröra elever som känner sig utanför eller är osäkra på sig själva. Prata inte om utseende eller kroppar. Fokusera på urval och känslor.","Om en elev berättar att hen mår dåligt av sociala medier eller blir kränkt på nätet: lyssna lugnt, följ skolans rutiner och kontakta elevhälsan.",T_RUTIN,SKYDD],
  avslut:"Sammanfatta att det man ser på sociala medier är ett urval, att jämförelser är mänskliga men kan göra att man mår sämre, och att man kan ställa tre frågor och göra något som hjälper.",
  slides:[
    `<div class="slide"><h2 class="big">Jämförelser och sociala medier</h2><p>Det du ser är en bit</p><p class="tagline">11–12 år · Lär känna dig själv</p></div>`,
    `<div class="slide"><h2>Los scrollning</h2><div class="timeline"><div class="tl"><b>1</b>Lo scrollar.</div><div class="tl"><b>2</b>Lo ser att Jo har en fin resa, många kompisar och många gillningar.</div><div class="tl"><b>3</b>Lo känner sig sämre.</div></div></div>`,
    `<div class="slide"><h2>Det du ser är en bit</h2><div class="two"><div class="panel b"><h3>Det vi ser</h3><p>De bästa bilderna, valda och ibland ändrade.</p></div><div class="panel a"><h3>Det vi inte ser</h3><p>Resten av dagen, och hur personen mår.</p></div></div></div>`,
    `<div class="slide"><h2>Tre frågor</h2>${nsteps(["Vad ser jag, och vad ser jag inte?","Hur känns det i kroppen när jag scrollar?","Vad kan jag göra: en paus, andra konton, någon att prata med?"])}</div>`,
    `<div class="slide"><h2>Öva två och två</h2><div class="three-col"><div class="bubble"><small>Kort A</small>En kompis lägger ut en bild från en fest som du inte var på.</div><div class="bubble"><small>Kort B</small>Någon har många fler följare.</div><div class="bubble"><small>Kort C</small>Ett foto där alla ser glada ut.</div></div><p style="margin-top:2cqw">Vad ser man? Vad ser man inte? Vad kan personen göra?</p></div>`,
    `<div class="slide"><h2 class="big">Det du ser är en bit.</h2><p>Jämförelser är mänskliga. Du kan fråga dig vad du inte ser.</p></div>`
  ]};

EX[31] = {n:31, niva:5, titel:"Skämt eller kränkning? Att stå upp och be om hjälp.", omr:"granser", tagline:"13–15 år · Gränser och respekt",
  ingress:"Övning för årskurs 7–9 om skillnaden mellan skämt och kränkning, och vad man kan göra när man ser att någon blir illa behandlad.",
  syfte:["Eleverna får se skillnaden mellan skämt och kränkning, och lär sig vad man kan göra när man ser att någon blir illa behandlad: stötta, säga ifrån om det känns tryggt, inte sprida vidare och berätta för en vuxen. De får höra att man inte behöver göra allt och att det inte är skvaller att be om hjälp."],
  intro:"Övningen utgår från påhittade personer, Noor, Elias och Ines, och eleverna skriver om påhittade personer och läser upp sin text för en kompis. Ämnet kan beröra elever som har blivit kränkta eller har kränkt andra, så var uppmärksam. Fråga inte vilka som är utsatta. Den som blir kränkt har aldrig fel.",
  material:["Skärm eller projektor för klassrumsläget.","Papper och pennor, eller digital anteckningsyta.","Inga personuppgifter samlas in."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om skillnaden mellan skämt och kränkning, och om vad man kan göra när man ser att någon blir illa behandlad.","Vi utgår från påhittade personer. Det du skriver senare handlar om en påhittad person, och du läser upp det för personen bredvid. Ingen tvingas, och du kan säga till mig om något känns jobbigt. "+ALDRE]},
    {t:"Gruppchatten", min:3, slide:1, gor:"Ta emot några svar. Peka inte ut vad någon själv har upplevt.", manus:["Läs situationen. I en gruppchatt skickar Elias en bild på Noor med en elak text. Flera skrattar. Ines ser det och undrar vad hon ska göra.","Hur kan det vara för Noor? Vad kan Ines tänka? Prata med personen bredvid er i en minut."]},
    {t:"Skämt eller kränkning?", min:5, slide:2, manus:["Titta på bilden. Ett skämt kan alla skratta åt, även den det handlar om. Man slutar när någon säger stopp.","En kränkning gör att någon blir sårad, skämd eller rädd. Det kan fortsätta, och den det handlar om kan ha svårt att säga stopp.","Om någon blir sårad är det inte okej, även om det kallas skämt. Den som blir kränkt har aldrig fel."]},
    {t:"Vad kan Ines göra?", min:5, slide:3, manus:["Här är fyra saker Ines kan göra. Stötta Noor: skicka ett meddelande eller sätt dig bredvid. Säg ifrån om det känns tryggt: ”Sluta, det där är inte okej.” Spara inte och sprid inte vidare. Berätta för en vuxen.","Det är inte skvaller att berätta för en vuxen. Det är att be om hjälp. Och Ines behöver inte göra allt. Det Ines kan göra räknas."]},
    {t:"Skriv och läs upp", min:7, slide:4, gor:"Gå runt. Läs inte upp elevernas texter inför klassen utan tillåtelse. "+NGOR+" Hjälp med frågorna på bilden.", manus:["Nu skriver ni i fem minuter. Hitta på en situation, eller välj Noor, Elias och Ines. Skriv: Vad kan den som ser det göra? Vad kan den som blev sårad göra? Vad kan skolan göra?","Skriv om påhittade personer, inte om er själva. Läs sedan upp din text för personen bredvid."]},
    {t:"Avslut", min:1, slide:5, manus:["Idag har vi sett skillnaden mellan skämt och kränkning, och att man kan stötta, säga ifrån om det känns tryggt och berätta för en vuxen.","Om någon behandlar dig eller någon annan illa kan du alltid prata med en vuxen. Elevhälsan och skolans personal finns."]}
  ],
  exempel:[["Noor, Elias och Ines","Elias skickar en elak bild på Noor i en gruppchatt, och Ines stöttar Noor och berättar för en vuxen."],["Kim och skämtet","Kim skämtar om Robins röst varje dag, och Robin skrattar inte längre."],["Alex i korridoren","Alex ser att några knuffar en kompis och går och hämtar en vuxen."]],
  fragor:["Vad är skillnaden mellan ett skämt och en kränkning?","Vad kan den som ser något göra?","Varför är det inte skvaller att berätta för en vuxen?"],
  anpassningar:[["Mer stöd","Ge en färdig mall med de fyra sakerna man kan göra."],["Fördjupning","Koppla till steg 5 i modellen i sex steg: Välj handling, och till övningen Våga säga nej."],["Skrivande","Elever som har svårt att skriva kan säga sin text muntligt till kompisen eller få hjälp att skriva ner den."],["Pauser","Elever får gå ut en stund i lugn och ro."]],
  trygghet:[T_ALLA,T_RESPEKT,"Ingen elev behöver berätta om egna upplevelser. Eleverna skriver om påhittade personer och läser upp sina texter för en kompis.","Ämnet kan beröra elever som har blivit kränkta eller har kränkt andra. Fråga inte vilka som är utsatta. Betona att den som blir kränkt aldrig har fel.","Om en elev berättar om kränkningar eller mobbning: lyssna lugnt, lova inte att hålla det hemligt och följ skolans plan mot kränkande behandling. Kontakta elevhälsan och rektor. Skolpersonal har anmälningsplikt vid oro för att ett barn far illa.",SKYDD],
  avslut:"Avsluta med skillnaden mellan skämt och kränkning, att man kan stötta, säga ifrån om det känns tryggt och berätta för en vuxen, och att den som blir kränkt aldrig har fel.",
  slides:[
    `<div class="slide"><h2 class="big">Skämt eller kränkning?</h2><p>Att stå upp och be om hjälp</p><p class="tagline">13–15 år · Gränser och respekt</p></div>`,
    `<div class="slide"><h2>Gruppchatten</h2><div class="timeline"><div class="tl"><b>1</b>Elias skickar en bild på Noor med en elak text.</div><div class="tl"><b>2</b>Flera skrattar.</div><div class="tl"><b>3</b>Ines ser det och undrar vad hon ska göra.</div></div></div>`,
    `<div class="slide"><h2>Skämt eller kränkning?</h2><div class="two"><div class="panel b"><h3>Skämt</h3><p>Alla kan skratta, även den det handlar om. Man slutar när någon säger stopp.</p></div><div class="panel a"><h3>Kränkning</h3><p>Någon blir sårad, skämd eller rädd. Det kan fortsätta.</p></div></div><p class="tagline">Den som blir kränkt har aldrig fel.</p></div>`,

    `<div class="slide"><h2>Skriv om påhittade personer</h2><ul class="q-list"><li>Vad kan den som ser det göra?</li><li>Vad kan den som blev sårad göra?</li><li>Vad kan skolan göra?</li></ul><p class="tagline">Skriv om påhittade personer, inte om dig själv. Läs upp för kompisen bredvid.</p></div>`,
    `<div class="slide"><h2 class="big">Du behöver inte göra allt.</h2><p>Det du kan göra räknas.</p><p class="tagline">Stöd finns: elevhälsan och vuxna på skolan.</p></div>`

EX[32] = {n:32, niva:6, titel:"Ensam bland andra.", omr:"andra", tagline:"16–19 år · Förstå andra människor",
  ingress:"Övning för gymnasiet om skillnaden mellan att vara ensam och att känna ensamhet, och om små steg mot kontakt.",
  syfte:["Eleverna får se att ensamhet är vanligt och inget personligt fel, att man kan vara ensam och ha det bra men också känna ensamhet i en grupp, och att små steg mot kontakt kan planeras och följas upp. De planerar små steg för en påhittad person."],
  intro:"Övningen utgår från en påhittad person, Jo, och eleverna skriver om en påhittad person och läser upp sin text för en kompis. Fråga inte vilka som är ensamma. Betona att ensamhet är vanligt och inget personligt fel.",
  material:["Skärm eller projektor för klassrumsläget.","Papper och pennor, eller digital anteckningsyta.","Inga personuppgifter samlas in."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om ensamhet och om hur man kan ta små steg mot kontakt.","Vi utgår från en påhittad person, Jo. Det du skriver senare handlar om en påhittad person, och du läser upp det för personen bredvid. Ingen tvingas, och du kan säga till mig om något känns jobbigt. "+ALDRE]},
    {t:"Jos första vecka", min:3, slide:1, gor:"Ta emot några svar. Peka inte ut vad någon själv har upplevt.", manus:["Läs situationen. Jo har börjat på ett nytt program och känner ingen. På lunchen sitter Jo med telefonen. Dagarna går, och Jo känner att ingen vet vem Jo är.","Hur kan det vara för Jo? Vad kan Jo tänka? Prata med personen bredvid er i en minut."]},
    {t:"Ensam och ensamhet", min:5, slide:2, manus:["Titta på bilden. Att vara ensam betyder att man är själv, och det kan vara skönt. Ensamhet är något annat: man vill ha mer kontakt än man har, och det känns tomt.","Man kan känna ensamhet även när man är bland andra. Det är vanligt, och det är inget personligt fel eller någon svaghet.","Ensamhet säger att kontakt är viktigt för oss som människor, och det går ofta att göra något åt."]},
    {t:"Små steg mot kontakt", min:6, slide:3, manus:["Fyra steg. Ett: märk känslan: jag saknar kontakt. Två: välj ett litet steg, till exempel att säga hej, fråga något eller sätta sig nära någon. Tre: planera när och hur. Fyra: följ upp hur det kändes, och prova igen.","Jo kan till exempel fråga någon i klassen om en uppgift, eller gå med i en aktivitet som Jo gillar. Det ska vara litet och möjligt. Det är normalt att det känns lite obekvämt, och det går över.","Om det inte går första gången gör man steget ännu mindre."]},
    {t:"Skriv och läs upp", min:7, slide:4, gor:"Gå runt. Läs inte upp elevernas texter inför klassen utan tillåtelse. "+NGOR+" Hjälp med frågorna på bilden.", manus:["Nu skriver ni i fem minuter. Välj Jo eller hitta på en egen person. Skriv: Vad känns svårt? Vilket litet steg kan personen ta? Vad kan komma i vägen, och vad gör personen då? Var kan personen hitta kontakt?","Skriv om en påhittad person, inte om er själva. Läs sedan upp din text för personen bredvid."]},
    {t:"Avslut", min:2, slide:5, manus:["Idag har vi sett att ensamhet är vanligt, att man kan känna sig ensam även bland andra och att små steg mot kontakt kan göra skillnad.","Om ensamheten känns tung eller håller i sig kan du prata med elevhälsan eller en vuxen du litar på."]}
  ],
  exempel:[["Jo på lunchen","Jo sitter med telefonen på lunchen och bestämmer sig för att fråga en klasskamrat om en uppgift."],["Lee och föreningen","Lee saknar kontakt och går med i en aktivitet som Lee gillar."],["Mika och meddelandet","Mika skickar ett kort meddelande till en gammal kompis varje vecka."]],
  fragor:["Vad är skillnaden mellan att vara ensam och att känna ensamhet?","Vilka små steg kan göra det lättare att få kontakt?","Vad kan man göra när ett steg känns för stort?"],
  anpassningar:[["Mer stöd","Ge en färdig mall med de fyra stegen."],["Fördjupning","Koppla till övningen Säg vad du behöver och till övningen Mina vardagsgrunder."],["Skrivande","Elever som har svårt att skriva kan säga sin text muntligt till kompisen eller få hjälp att skriva ner den."],["Pauser","Elever får gå ut en stund i lugn och ro."]],
  trygghet:[T_ALLA,T_RESPEKT,"Ingen elev behöver berätta om egna upplevelser. Eleverna skriver om påhittade personer och läser upp sina texter för en kompis.","Ämnet kan beröra elever som känner sig ensamma. Betona att ensamhet är vanligt och inget personligt fel. Fråga inte vilka som är ensamma, och peka inte ut någon.","Om en elev berättar att hen ofta är ensam och mår dåligt: lyssna lugnt och kontakta elevhälsan enligt skolans rutiner.",T_RUTIN,SKYDD],
  avslut:"Avsluta med att ensamhet är vanligt, att man kan känna sig ensam även bland andra, att små steg mot kontakt kan planeras och följas upp, och att elevhälsan finns om ensamheten känns tung.",
  slides:[
    `<div class="slide"><h2 class="big">Ensam bland andra</h2><p>Små steg mot kontakt</p><p class="tagline">16–19 år · Förstå andra människor</p></div>`,
    `<div class="slide"><h2>Jos första vecka</h2><div class="timeline"><div class="tl"><b>1</b>Jo har börjat på ett nytt program och känner ingen.</div><div class="tl"><b>2</b>På lunchen sitter Jo med telefonen.</div><div class="tl"><b>3</b>Jo känner att ingen vet vem Jo är.</div></div></div>`,
    `<div class="slide"><h2>Ensam och ensamhet</h2><div class="two"><div class="panel b"><h3>Att vara ensam</h3><p>Man är själv, och det kan vara skönt.</p></div><div class="panel a"><h3>Ensamhet</h3><p>Man vill ha mer kontakt än man har, och det känns tomt. Det är vanligt.</p></div></div></div>`,
    `<div class="slide"><h2>Små steg mot kontakt</h2>${nsteps(["Märk känslan: jag saknar kontakt.","Välj ett litet steg: säg hej, fråga något, sätt dig nära någon.","Planera när och hur.","Följ upp: hur kändes det? Prova igen."])}</div>`,
    `<div class="slide"><h2>Skriv om en person</h2><ul class="q-list"><li>Vad känns svårt?</li><li>Vilket litet steg kan personen ta?</li><li>Vad kan komma i vägen, och vad gör personen då?</li><li>Var kan personen hitta kontakt?</li></ul><p class="tagline">Skriv om en påhittad person, inte om dig själv. Läs upp för kompisen bredvid.</p></div>`,
    `<div class="slide"><h2 class="big">Små steg räknas.</h2><p>Ensamhet är vanligt, och det går att göra något åt.</p><p class="tagline">Stöd finns: elevhälsan och vuxna på skolan.</p></div>`
  ]};

EX[33] = {n:33, niva:2, titel:"Kroppens larm och lugn.", omr:"nervsystem", tagline:"6–8 år · Kroppen och nervsystemet",
  ingress:"Övning för förskoleklass till årskurs 2 om nervsystemet som kroppens ledningar med ett larm och ett lugn, och om att kroppen kan kämpa, fly eller stelna.",
  syfte:["Eleverna får höra att nervsystemet är kroppens ledningar, att det har ett larm och ett lugn, och att larmet kan få kroppen att vilja kämpa, fly eller stelna. De får höra att det händer av sig självt och att man kan hjälpa kroppen tillbaka till lugn med verktyg."],
  intro:"Övningen utgår från en påhittad person, Sam. Eleverna kan visa kämpa, fly och stelna med kroppen på ett lekfullt sätt, men ingen behöver göra det. Poängen är att förstå att kroppen reagerar automatiskt och att det finns verktyg.",
  material:["Skärm eller projektor för klassrumsläget.","Inget annat behövs.","Inga personuppgifter eller tester behövs."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om kroppens larm och lugn.","Vi utgår från en påhittad person, Sam. Ingen behöver berätta något om sig själv. Vi är snälla mot varandra och lyssnar på varandra."]},
    {t:"Kroppens ledningar", min:3, slide:1, manus:["Inuti kroppen finns ledningar som skickar meddelanden mellan hjärnan och kroppen. Det kallas nervsystemet.","Nervsystemet har ett larm och ett lugn. Larmet gör kroppen redo när något känns läskigt eller orättvist. Lugnet hjälper kroppen att vila igen.","Larmet är inte farligt. Det vill hjälpa oss."]},
    {t:"Kämpa, fly eller stelna", min:4, slide:2, gor:"Ingen behöver visa med kroppen. De som vill kan göra det lekfullt eller sitta kvar och titta på.", manus:["Sam hör ett högt skrik. Hjärtat bultar och larmet går. Kroppen kan reagera på tre sätt.","Kämpa: Sam blir arg och spänd och vill säga ifrån. Fly: Sam vill springa iväg. Stelna: Sam blir alldeles stilla och tyst.","Det händer av sig självt. Det är okej, och det är inget fel på Sam.","Du kan visa med kroppen om du vill. Spänn armarna för kämpa, spring på stället för fly och stå helt stilla för stelna."]},
    {t:"Tillbaka till lugn", min:4, slide:3, manus:["När larmet har gått kan vi hjälpa kroppen tillbaka till lugn. Först får vi känna det vi känner. Sedan kan vi välja ett verktyg.","Vi kan säga hur det känns. Vi kan andas som en ballong, röra på oss, ta en paus eller gå till en trygg vuxen.","Vi provar tre ballongandetag tillsammans. Du får också titta på."]},
    {t:"Vad hjälper Sam?", min:2, slide:4, manus:["Titta på korten. Sam blir arg. Sam stelnar. Vad hjälper Sam? Peka på ett verktyg och berätta för personen bredvid."]},
    {t:"Avslut", min:1, slide:5, manus:["Idag har vi sett att nervsystemet har ett larm och ett lugn. Kroppen kan kämpa, fly eller stelna. Och vi kan hjälpa kroppen tillbaka till lugn.","Om det känns svårt kan du alltid gå till en trygg vuxen. Bra jobbat!"]}
  ],
  exempel:[["Sam hör ett skrik","Sam hör ett högt skrik, hjärtat bultar och larmet går."],["Sam blir arg","Sam blir arg och spänd och tar tre ballongandetag."],["Sam stelnar","Sam blir alldeles stilla och tyst, rör på tårna och går till en trygg vuxen."]],
  fragor:["Vad är nervsystemet?","Vad kan kroppen vilja göra när larmet går?","Vad kan man göra för att få kroppen tillbaka till lugn?"],
  anpassningar:[["Bildstöd","Använd bilderna och låt eleverna peka."],["Rörelse","Elever som inte vill röra sig kan titta på eller visa med bara händerna."],["Mindre grupper","Dela klassen i halvgrupper vid behov."],["Språk","Skriv upp orden nervsystem, larm, lugn, kämpa, fly och stelna."]],
  trygghet:[T_ALLA,T_RESPEKT,"Ingen elev behöver berätta något om sig själv.","Vissa barn kan bli oroliga av att prata om larm och rädsla. Betona att larmet vill hjälpa oss, att det är normalt och att det går att komma tillbaka till lugn.",T_RUTIN,SKYDD],
  avslut:"Sammanfatta att nervsystemet är kroppens ledningar med ett larm och ett lugn, att kroppen kan kämpa, fly eller stelna, att det händer av sig självt och att man kan hjälpa kroppen tillbaka till lugn med verktyg.",
  slides:[
    `<div class="slide"><div class="face-slide"><div class="fbig">${HJARTA}</div><div><h2 class="big">Kroppens larm och lugn</h2><p>Sam</p></div></div></div>`,
    `<div class="slide"><h2>Nervsystemet är kroppens ledningar</h2><div class="two"><div class="panel a"><h3>Larm</h3><p>Gör kroppen redo när något känns läskigt eller orättvist.</p></div><div class="panel b"><h3>Lugn</h3><p>Hjälper kroppen att vila igen.</p></div></div></div>`,
    `<div class="slide"><h2>När larmet går</h2><div class="three-col"><div class="bubble bad"><small>Kämpa</small>Sam blir arg och spänd.</div><div class="bubble mid"><small>Fly</small>Sam vill springa iväg.</div><div class="bubble good"><small>Stelna</small>Sam blir stilla och tyst.</div></div><p style="margin-top:2cqw">Det händer av sig självt. Det är okej.</p></div>`,
    `<div class="slide"><h2>Tillbaka till lugn</h2><div class="chips6"><span class="schip">Säg hur det känns</span><span class="schip">Andas som en ballong</span><span class="schip">Röra på sig</span><span class="schip">Paus</span><span class="schip">Trygg vuxen</span></div></div>`,
    `<div class="slide"><h2>Vad hjälper Sam?</h2><div class="three-col" style="grid-template-columns:1fr 1fr"><div class="bubble"><small>Dag 1</small>Sam blir arg.</div><div class="bubble"><small>Dag 2</small>Sam stelnar.</div></div><p style="margin-top:2cqw">Peka på ett verktyg som kan hjälpa.</p></div>`,
    `<div class="slide"><h2 class="big">Larmet vill hjälpa oss.</h2><p>Och vi kan hjälpa kroppen tillbaka till lugn.</p><div class="faces small">${["glad","stolt"].map(faceCard).join("")}</div></div>`
  ]};

EX[34] = {n:34, niva:6, titel:"Mitt nervsystem: larm, lugn och val.", omr:"nervsystem", tagline:"16–19 år · Kroppen och nervsystemet",
  ingress:"Övning för gymnasiet om nervsystemets beredskapsläge och vilo- och återhämtningsläge, om att kroppen kan kämpa, fly eller stelna, och om vilka verktyg som kan hjälpa.",
  syfte:["Eleverna får se att nervsystemet har ett beredskapsläge och ett vilo- och återhämtningsläge, att kroppen automatiskt kan kämpa, fly eller stelna, och att de kan välja verktyg och nästa steg. De övar på att koppla en reaktion till ett verktyg för en påhittad person."],
  intro:"Övningen utgår från en påhittad person, Lee, och eleverna skriver om en påhittad person och läser upp sin text för en kompis. Bilden av nervsystemet är förenklad. Poängen är att förstå att reaktionerna är automatiska, inte en svaghet, och att det finns verktyg.",
  material:["Skärm eller projektor för klassrumsläget.","Papper och pennor, eller digital anteckningsyta.","Inga personuppgifter samlas in."],
  steg:[
    {t:"Introduktion", min:1, slide:0, manus:["Hej! Idag pratar vi om nervsystemet: om kroppens larm och lugn, och om hur man kan välja nästa steg.","Vi utgår från en påhittad person, Lee. Det du skriver senare handlar om en påhittad person, och du läser upp det för personen bredvid. Ingen tvingas, och du kan säga till mig om något känns jobbigt. "+ALDRE]},
    {t:"Lees dag", min:3, slide:1, gor:"Ta emot några svar. Peka inte ut vad någon själv har upplevt.", manus:["Läs situationen. Lee får tillbaka ett prov med ett sämre resultat än väntat. Hjärtat slår fort, magen knyter sig och tankarna rusar. En version av Lee svarar skarpt, en annan går därifrån och en tredje blir alldeles tom.","Vad händer i Lees kropp? Prata med personen bredvid er i en minut."]},
    {t:"Larm och lugn i kroppen", min:5, slide:2, manus:["Nervsystemet skickar signaler mellan hjärnan och hela kroppen. En del styr det som sker av sig självt, som hjärtslag och andning. Den delen har två huvudlägen.","I beredskapsläget slår hjärtat snabbare, andningen går fortare och musklerna spänns. Det är kroppens larm, och det är till för att hjälpa oss att agera. I vilo- och återhämtningsläget slår hjärtat lugnare och kroppen kan hämta kraft.","Det här är en förenklad bild av nervsystemet, men den hjälper oss att förstå varför vi reagerar som vi gör."]},
    {t:"Kämpa, fly, stelna och vad som kan hjälpa", min:5, slide:3, manus:["Larmet kan ge tre reaktioner. Kämpa: man blir arg eller försvarar sig. Fly: man vill därifrån eller undviker. Stelna: man blir stilla, tom eller tyst, och hjärtat kan slå långsammare en stund.","Reaktionerna sker automatiskt och är inget val eller någon svaghet. Men vad vi gör efteråt kan vi välja.","Om man kämpar eller flyr kan bromsen hjälpa: andas långsamt med lång utandning, rör på dig eller ta en paus. Om man stelnar kan små steg hjälpa: rör fingrar och tår, titta runt och namnge saker du ser, och rör dig sedan lite mer. Att sätta ord på känslan, skriva av sig och prata med någon trygg kan hjälpa oavsett reaktion.","Först vågar vi känna. Att trycka undan känslan hjälper inte. Se Verktygslådan för stegen."]},
    {t:"Skriv och läs upp", min:8, slide:4, gor:"Gå runt. Läs inte upp elevernas texter inför klassen utan tillåtelse. "+NGOR+" Hjälp med frågorna på bilden.", manus:["Nu skriver ni i sex minuter. Välj Lee eller hitta på en egen person. Skriv: Vad hände? Hur reagerar personens kropp? Är det kämpa, fly eller stelna? Vilket verktyg kan hjälpa? Vad väljer personen att göra efteråt?","Skriv om en påhittad person, inte om er själva. Läs sedan upp din text för personen bredvid, i två minuter."]},
    {t:"Avslut", min:2, slide:5, manus:["Idag har vi sett att nervsystemet har ett larm och ett lugn, att kroppen kan kämpa, fly eller stelna, och att vi kan välja verktyg och nästa steg.","Om reaktionerna tar mycket plats eller är svåra att hantera på egen hand finns elevhälsan och vuxna här på skolan."]}
