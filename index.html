<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Human Basics – prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F4EE; --surface:#FFFDF9; --sand:#E8DDCC; --salvia:#A8B8A0; --skog:#354F43; --terra:#C8846B;
  --lav:#B7A9C8; --himmel:#A9C5CF; --ockra:#D8B46A;
  --ink:#25332c; --muted:#4d5d54; --head:#354F43; --line:rgba(53,79,67,.2);
  --btn-bg:#354F43; --btn-ink:#F7F4EE; --foot-bg:#2d4338; --foot-ink:#F1ECE1; --foot-muted:#C9D3C6;
  --font-head:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18231e; --surface:#202e27; --sand:#26352d; --skog:#9DBBA6; --ink:#efe9dd; --muted:#c6cdc2; --head:#d9e6d6;
    --line:rgba(217,230,214,.26); --btn-bg:#A8B8A0; --btn-ink:#18231e; --foot-bg:#101a15; --foot-ink:#efe9dd; --foot-muted:#b9c3b6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#18231e; --surface:#202e27; --sand:#26352d; --skog:#9DBBA6; --ink:#efe9dd; --muted:#c6cdc2; --head:#d9e6d6;
  --line:rgba(217,230,214,.26); --btn-bg:#A8B8A0; --btn-ink:#18231e; --foot-bg:#101a15; --foot-ink:#efe9dd; --foot-muted:#b9c3b6; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1.0625rem;line-height:1.65;-webkit-text-size-adjust:100%}
body.is-klass{background:#1b2822}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:40}
body.is-klass::before{background:#1b2822}
h1,h2,h3{font-family:var(--font-head);color:var(--head);line-height:1.15;margin:0 0 .55em;letter-spacing:-.02em;font-weight:600}
h1{font-size:clamp(2rem,4.2vw,3.1rem)}
h2{font-size:clamp(1.5rem,2.6vw,2rem)}
h3{font-size:1.15rem;font-weight:700}
p{margin:0 0 1em;max-width:66ch}
a{color:var(--head);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--head);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--btn-bg);color:var(--btn-ink);padding:.7rem 1rem;border-radius:8px;z-index:60}
.skip:focus{left:8px}
.wrap{max-width:1140px;margin:0 auto;padding:0 1.5rem}
main{display:block;outline:none}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:.7rem 1.4rem;border-radius:8px;background:var(--btn-bg);color:var(--btn-ink);font:inherit;font-family:var(--font-head);font-weight:600;font-size:1.02rem;text-decoration:none;border:2px solid var(--btn-bg);cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--head);border-color:var(--head)}
.btn.sm{min-height:44px;padding:.45rem 1.05rem;font-size:.97rem}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.btn-row{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.6rem}
.badge{display:inline-block;font-size:.9rem;font-weight:700;padding:.2rem .7rem;border-radius:6px;background:var(--sand);color:var(--head)}
.badge.warn{background:var(--ockra);color:#25332c}
.lead{font-size:1.15rem;color:var(--muted)}
section.block{padding:clamp(2.4rem,5vw,4rem) 0}
.alt{background:color-mix(in srgb,var(--sand) 45%,var(--bg))}
.sec-head{max-width:62ch;margin-bottom:1.8rem}
.sec-head p{color:var(--muted);margin:0}
.sec-head.wide{max-width:none;display:flex;justify-content:space-between;align-items:end;gap:1.5rem;flex-wrap:wrap}
.sec-head.wide>div{max-width:62ch}
.link-more{font-weight:700;color:var(--head)}
.callout{background:var(--surface);border:1px solid var(--line);border-left:7px solid var(--ockra);border-radius:6px 12px 12px 6px;padding:1.2rem 1.4rem}
.callout p:last-child{margin-bottom:0}

/* ===== webbplats: sidhuvud ===== */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.site-head .wrap{display:flex;align-items:center;gap:1rem;min-height:74px}
.brand{display:flex;align-items:center;gap:.65rem;font-family:var(--font-head);font-weight:700;font-size:1.3rem;color:var(--head);text-decoration:none;margin-right:auto}
.site-head nav ul{display:flex;gap:.1rem;list-style:none;margin:0;padding:0}
.site-head nav a{display:block;padding:.5rem .8rem;border-radius:8px;text-decoration:none;font-weight:700;font-size:.98rem;color:var(--ink);min-height:44px;line-height:1.75}
.site-head nav a:hover{background:var(--sand)}
.site-head nav a[aria-current="page"]{color:var(--head);background:var(--sand);box-shadow:inset 0 -3px 0 var(--terra)}
.menu-btn{display:none;font:inherit;font-weight:700;background:var(--sand);color:var(--ink);border:0;border-radius:8px;padding:.6rem 1.1rem;min-height:44px;cursor:pointer}
.nav-cta{display:none}
@media (max-width:1000px){
  .menu-btn{display:inline-flex;align-items:center}
  .site-head nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);padding:.5rem 1.5rem 1rem}
  .site-head nav.open{display:block}
  .site-head nav ul{flex-direction:column}
}
@media (max-width:560px){.hdr-cta{display:none}.nav-cta{display:block}.nav-cta a{background:var(--btn-bg);color:var(--btn-ink)!important;text-align:center}}

/* sidhuvud för undersidor */
.band{background:linear-gradient(180deg,color-mix(in srgb,var(--sand) 55%,var(--bg)),var(--bg));border-bottom:1px solid var(--line);padding:clamp(2.2rem,5vw,3.6rem) 0}
.band h1{margin-bottom:.35em}
.band .lead{margin:0;max-width:60ch}

/* startsida */
.hero{padding:clamp(2.6rem,6vw,5.5rem) 0;background:linear-gradient(180deg,color-mix(in srgb,var(--sand) 45%,var(--bg)),var(--bg))}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(2rem,5vw,4.5rem);align-items:center}
.hero h1{font-size:clamp(2.2rem,4.6vw,3.7rem);line-height:1.08;letter-spacing:-.03em;margin-bottom:.6em}
.hero .lead{line-height:1.7}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}}
.figure-card{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.2rem .9rem;box-shadow:0 1px 1px rgba(40,62,50,.05),0 22px 40px -28px rgba(40,62,50,.4)}
.figure-card h2{font-size:1.05rem;margin-bottom:.1em}
.figure-card .sub{font-size:.9rem;color:var(--muted);margin-bottom:.6rem}
.figure-card .scroll{overflow-x:auto}
.figure-card svg{display:block;min-width:500px;width:100%;height:auto}
.figure-card .cap{font-size:.88rem;color:var(--muted);margin:.5rem 0 0}
.fg text{font-family:var(--font-head);font-size:12.5px;font-weight:600;fill:var(--ink)}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6rem;list-style:none;padding:0;margin:0}
.four li{border-top:3px solid var(--head);padding-top:1.1rem}
.four svg{width:30px;height:30px;fill:none;stroke:var(--head);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:.6rem;display:block}
.four p{color:var(--muted);margin:0}
@media (max-width:960px){.four{grid-template-columns:repeat(2,1fr)}}
@media (max-width:540px){.four{grid-template-columns:1fr}}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;list-style:none;padding:0;margin:0}
.layer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.5rem;display:flex;flex-direction:column;border-top:6px solid var(--c);height:100%}
.layer .tag{font-size:.88rem;font-weight:700;color:var(--muted);margin-bottom:.3rem}
.layer p{color:var(--muted)}
.layer .btn{margin-top:auto;align-self:flex-start}
.layer ul{margin:0 0 1.2rem;padding-left:1.1rem;color:var(--muted);font-size:.97rem}
@media (max-width:900px){.three{grid-template-columns:1fr}}
.tscroll{overflow-x:auto}
table.levels{width:100%;min-width:760px;border-collapse:collapse;background:var(--surface);border:1px solid var(--line)}
table.levels th,table.levels td{text-align:left;padding:.85rem 1rem;border-bottom:1px solid var(--line);vertical-align:top;font-size:.97rem}
table.levels th{font-family:var(--font-head);font-weight:700;color:var(--head);background:color-mix(in srgb,var(--sand) 55%,var(--surface))}
table.levels tr:last-child td{border-bottom:0}
table.levels td:first-child{font-family:var(--font-head);font-weight:700;color:var(--head);white-space:nowrap}
.status-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(1.6rem,4vw,3.6rem);align-items:start}
@media (max-width:860px){.status-grid{grid-template-columns:1fr}}
.status-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.status-list li{display:flex;gap:.9rem;align-items:flex-start;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}
.status-list li:last-child{border-bottom:0}
.status-list .ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;font-family:var(--font-head)}
.ic.done{background:var(--salvia);color:#25332c}
.ic.now{background:var(--ockra);color:#25332c}
.ic.todo{background:transparent;border:2px solid var(--head);color:var(--head)}
.status-list b{display:block;font-family:var(--font-head);color:var(--head)}
.status-list span{font-size:.95rem;color:var(--muted)}
.principle{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.6rem,4vw,3.6rem);align-items:start}
.principle .stmt{font-family:var(--font-head);font-weight:600;font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.2;letter-spacing:-.025em;color:var(--head);margin:0}
.principle ul{margin:0;padding-left:1.1rem;color:var(--muted)}
.principle li{margin-bottom:.5rem}
@media (max-width:860px){.principle{grid-template-columns:1fr}}
footer.site{background:var(--foot-bg);color:var(--foot-ink);padding:2.6rem 0 2rem;font-size:.96rem}
footer.site a{color:var(--foot-ink)}
footer.site .cols{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:2.4rem}
footer.site h2{font-size:1.02rem;color:var(--foot-ink);margin-bottom:.6rem}
footer.site p{color:var(--foot-muted);margin-bottom:.7em}
footer.site ul{list-style:none;margin:0;padding:0}
footer.site li{margin-bottom:.35rem}
footer.site .brand{color:var(--foot-ink);margin-bottom:.7rem}
@media (max-width:820px){footer.site .cols{grid-template-columns:1fr}}

/* om oss / så fungerar det */
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;list-style:none;padding:0;margin:0;counter-reset:s}
.how li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.4rem}
.how li::before{content:counter(s);display:inline-grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--btn-bg);color:var(--btn-ink);font-family:var(--font-head);font-weight:700;margin-bottom:.8rem}
.how h3{margin-bottom:.3em}.how p{margin:0;color:var(--muted)}
@media (max-width:860px){.how{grid-template-columns:1fr}}
.audience{columns:2;column-gap:2rem;padding-left:1.2rem;margin:0 0 1rem}
.audience li{margin-bottom:.4rem;break-inside:avoid}
@media (max-width:640px){.audience{columns:1}}
.principles{list-style:none;padding:0;margin:1.2rem 0 0;display:grid;gap:.8rem}
.principles li{border-left:6px solid var(--c);background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:4px 10px 10px 4px;padding:.95rem 1.2rem;--c:var(--salvia)}
.principles li:nth-child(2n){--c:var(--terra)}
.principles li:nth-child(3n){--c:var(--lav)}
.principles li:nth-child(5n){--c:var(--himmel)}
.principles li:nth-child(7n){--c:var(--ockra)}
.principles strong{display:block;font-family:var(--font-head);font-size:1.12rem;color:var(--head);margin-bottom:.1rem}
.vision-quote{font-family:var(--font-head);font-weight:600;font-size:clamp(1.4rem,2.8vw,2.1rem);line-height:1.25;letter-spacing:-.025em;color:var(--head);max-width:30ch;margin:0 0 1.2rem}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin:1rem 0 0}
.compare>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.2rem 1.4rem}
.compare h3{margin-bottom:.4em}
.compare ul{margin:0;padding-left:1.2rem;color:var(--muted)}
@media (max-width:760px){.compare{grid-template-columns:1fr}}

/* kunskapsgrund */
.ev{list-style:none;padding:0;margin:1.2rem 0 0;display:grid;gap:1rem}
.ev li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.2rem 1.4rem}
.ev h3{margin-bottom:.35em}
.ev p{margin:0 0 .5em}
.ev p:last-child{margin-bottom:0}
.ev .src{font-size:.93rem;color:var(--muted)}
.ev.cave li{border-left:7px solid var(--terra);border-radius:4px 12px 12px 4px}
.ev.take li{border-left:7px solid var(--salvia);border-radius:4px 12px 12px 4px}
.refs{padding-left:1.2rem}
.refs li{margin-bottom:.6rem;max-width:80ch}

/* ===== lärarplattform ===== */
.t-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.t-head .top{display:flex;align-items:center;gap:1rem;min-height:62px}
.t-head .brand{font-size:1.15rem;margin-right:0}
.t-head .to-site{margin-left:auto;font-weight:700;font-size:.95rem}
.subnav .wrap{display:flex;align-items:center;gap:.35rem;overflow-x:auto;padding-top:.4rem;padding-bottom:.55rem}
.subnav a{white-space:nowrap;text-decoration:none;font-weight:700;color:var(--ink);padding:.4rem .85rem;border-radius:6px;min-height:40px;display:inline-flex;align-items:center;font-size:.95rem}
.subnav a:hover{background:var(--sand)}
.subnav a[aria-current="page"]{background:var(--btn-bg);color:var(--btn-ink)}
.t-page{padding:clamp(1.6rem,3.5vw,2.6rem) 0 clamp(3rem,6vw,4.5rem)}
.t-title{padding-bottom:1.4rem;margin-bottom:1.6rem;border-bottom:1px solid var(--line)}
.t-title h1{font-size:clamp(1.8rem,3.4vw,2.5rem);margin-bottom:.3em}
.t-title .lead{margin:0}
.crumbs{font-size:.92rem;color:var(--muted);margin:0 0 .7rem}
.badges{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 0}
.chip{font:inherit;font-weight:700;min-height:44px;padding:.4rem 1rem;border-radius:6px;border:2px solid var(--head);background:var(--surface);color:var(--head);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.chip:hover{background:var(--sand)}
.chip[aria-pressed="true"]:hover{background:var(--btn-bg)}
.modes{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 .8rem}
.modes button{font:inherit;font-weight:700;min-height:46px;padding:.5rem 1.1rem;border-radius:6px;border:2px solid var(--head);background:var(--surface);color:var(--head);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.mode-note{color:var(--muted);margin-bottom:1.4rem}
.parts{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
.part{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.2rem 1.3rem 1.3rem;height:100%}
.part h3{display:flex;gap:.7rem;align-items:flex-start;margin-bottom:.45em}
.part .n{flex:none;display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--btn-bg);color:var(--btn-ink);font-size:.95rem}
.part p{margin:0}
.part.compact p.q{font-weight:700;color:var(--head);margin-bottom:.3em}
.part.compact p.k{color:var(--muted)}
.part.b h3{margin-bottom:.3em}
@media (max-width:760px){.parts{grid-template-columns:1fr}}
.next-row{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.8rem}

.levels-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;list-style:none;padding:0;margin:0}
.lcard{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--salvia);border-radius:10px;padding:1.3rem 1.4rem;display:flex;flex-direction:column;height:100%}
.lcard .age{font-family:var(--font-head);font-weight:700;font-size:1.6rem;color:var(--head);line-height:1.1}
.lcard .stage{font-weight:700;color:var(--muted);margin:.15rem 0 .8rem}
.lcard p{font-size:.98rem;margin-bottom:.6rem}
.lcard .row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:auto;padding-top:.8rem}
@media (max-width:980px){.levels-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.levels-grid{grid-template-columns:1fr}}

.areas{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;list-style:none;padding:0;margin:0}
.area{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:10px;padding:1.3rem 1.4rem;display:flex;flex-direction:column;height:100%}
.area h3{margin-bottom:.15em;font-size:1.25rem}
.area .core{font-family:var(--font-head);font-weight:600;color:var(--head);margin-bottom:.5rem}
.area .here{background:var(--bg);border-radius:8px;padding:.75rem 1rem;margin:.3rem 0 .8rem}
.area .here b{color:var(--head)}
.area .row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:auto}
.area ol{margin:.8rem 0 0;padding-left:1.2rem}
.area ol li{margin-bottom:.4rem}
.area ol li.cur{font-weight:700}
.area .toggle,.area .go{font:inherit;font-weight:700;color:var(--head);background:transparent;border:2px solid var(--head);border-radius:6px;min-height:42px;padding:.3rem 1rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.area .toggle:hover,.area .go:hover{background:var(--bg)}
@media (max-width:760px){.areas{grid-template-columns:1fr}}

.steps6{display:grid;grid-template-columns:repeat(6,1fr);gap:.5rem;list-style:none;padding:0;margin:0 0 1.4rem;position:relative}
.steps6::before{content:"";position:absolute;left:8%;right:8%;top:31px;height:3px;background:var(--line)}
.steps6 li{position:relative;z-index:1}
.step-btn{width:100%;display:flex;flex-direction:column;align-items:center;gap:.5rem;text-align:center;font:inherit;font-weight:700;color:var(--ink);background:transparent;border:0;padding:.3rem .2rem .6rem;cursor:pointer;border-radius:10px}
.step-btn .dot{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--c);color:#25332c;font-family:var(--font-head);font-weight:700;font-size:1.35rem;border:4px solid var(--bg)}
.step-btn.light .dot{color:#F7F4EE}
.step-btn[aria-pressed="true"] .dot{outline:3px solid var(--head);outline-offset:2px}
.step-btn[aria-pressed="true"] .lbl{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.step-btn:hover{background:var(--sand)}
.detail{background:color-mix(in srgb,var(--c) 30%,var(--surface));border:1px solid var(--line);border-radius:12px;padding:clamp(1.3rem,3vw,1.9rem)}
.detail h3{font-size:1.45rem}
.detail .q{font-family:var(--font-head);font-weight:600;font-size:1.25rem;color:var(--head)}
.detail .ex{background:var(--surface);border-radius:8px;padding:1rem 1.2rem;margin-top:1rem}
.detail .ex b{color:var(--head)}
.nav-steps{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.2rem}
@media (max-width:820px){
  .steps6{grid-template-columns:1fr;gap:.2rem}

  "Känslor är signaler som visar hur du har det och vad som är viktigt för dig. De hänger ihop med hur du ser på det som händer, och de märks i kroppen. Om en kompis plötsligt slutar svara på dina meddelanden kan du känna oro: det knyter sig i magen och du undrar vad du har gjort. Känslorna kan vara starka, och flera kan finnas samtidigt. Runt 11–12 års ålder börjar kropp och hjärna förändras, och då kan känslorna kännas starkare eller svänga snabbare. Det är normalt.",

  "Självmedvetenhet är att lägga märke till vad som händer inom dig: vad du tänker, vad du känner och vad kroppen säger. Det handlar också om vem du är: vad du tycker är viktigt, vad du är bra på och hur kompisar och sociala medier påverkar dig. Behov är sådant du behöver för att må bra, som sömn, mat, rörelse, vila, att bli lyssnad på, att få bestämma själv och att höra till. Att känna igen sina behov gör det lättare att stå emot grupptryck.",
  "Empati är att försöka förstå hur någon annan känner och tänker, även när du inte håller med. I relationer kan behov krocka: du vill vara ensam, kompisen vill umgås. Det hjälper att lyssna, att säga tydligt vad du själv tycker och behöver och att tåla att andra tycker annorlunda. Empati betyder inte att du ska ta över någon annans känslor.",

  "Ett beteendemönster är något du gör på liknande sätt gång på gång, till exempel att alltid bli tyst eller alltid svara snabbt när du blir sårad. Mönster byggs genom upprepning och påverkas av miljö, förebilder och belöningar: det som ger snabb lättnad gör man oftare. Mönster går att ändra, men det kräver övning, tålamod och ofta stöd från andra."
 ],
 "6": [
  "Känslor är signaler som visar hur du har det och vad som är viktigt för dig. De hänger ihop med hur du värderar och tolkar det som händer, och de märks också i kroppen: hjärtat, magen, musklerna och andningen. Om du till exempel får kritik inför gruppen kan du tolka det som att de tycker att du är dålig, känna ilska eller skam, få hjärtklappning och en impuls att försvara dig eller försvinna. Känslor påverkas av biologi, erfarenheter och sammanhang. Att kunna sätta ord på dem mer exakt, till exempel besviken eller sårad i stället för bara arg, gör det lättare att förstå sig själv och att förklara för andra.",
  "Nervsystemet är det system som skickar signaler mellan hjärnan och hela kroppen. En del styr du själv, som att röra en hand. En annan del, det autonoma nervsystemet, styr det som sker av sig självt: hjärtslag, andning och matsmältning. Det har två huvudlägen. I beredskapsläget slår hjärtat snabbare, andningen går fortare och musklerna spänns, så att du kan agera. I vilo- och återhämtningsläget slår hjärtat lugnare och kroppen kan vila, smälta mat och återhämta sig. Det är genom det här systemet som känslor och stress märks i kroppen. Att känna igen när kroppen är i beredskap, och veta vad som kan hjälpa den att varva ner, är en del av att reglera känslor och stress: till exempel sömn, rörelse, långsam andning och att prata med någon. Hur du sover, hur mycket stress du har och hur trygg du känner dig påverkar hur ofta kroppen är i vilket läge.",
  "Stress är kroppens reaktion när du upplever krav eller hot, till exempel inför ett prov, en konflikt eller en osäker framtid. Hjärnan skickar signaler som får kroppen att frigöra stresshormoner som adrenalin och kortisol. Hjärtat slår snabbare och hårdare, andningen går fortare, musklerna spänns och sinnena skärps. Det kallas kamp-eller-flykt-reaktionen, och kortvarigt kan den ge extra energi och fokus. Kroppen kan reagera på tre sätt, ofta kallade fight, flight och freeze: kämpa (bli arg, gå till angrepp eller försvara sig), fly (undvika, dra sig undan eller lämna situationen) eller stelna (bli stilla, tom eller oförmögen att säga något; hjärtat kan då slå långsammare i stället för snabbare). Reaktionerna sker automatiskt och är varken ett val eller en svaghet, men hur du agerar efteråt kan du välja. Om stressen pågår länge utan tillräcklig återhämtning kan den leda till sömnproblem, ihållande trötthet, huvudvärk, muskelspänningar, magproblem, irritabilitet och svårigheter att koncentrera sig. Det är en signal om att kroppen behöver vila. Håller besvären i sig under en längre tid finns stöd att få via elevhälsan eller vårdcentralen. Vid kraftiga kroppsliga symtom, som tryck över bröstet eller svårt att andas, ska man alltid kontakta vården: ring 1177 för rådgivning eller 112 vid akuta symtom.",
  "Känsloreglering är att kunna påverka hur starkt en känsla blir, hur länge den varar och vad du gör med den. Det börjar med att våga känna: att märka känslan, ge den ett namn och tåla obehaget en stund. Det handlar inte om att slippa känna, och inte om att trycka undan eller gräva ner känslan. Forskning visar att undertryckande och undvikande hänger ihop med fler symtom på ångest och depression, och det kan bli en flaskhals: det du har tryckt undan kommer ut på en gång, ofta som ett utbrott eller som en känsla av att vara överväldigad. När du har känt efter kan du påverka kroppen (andas långsamt, röra på dig), tankarna (fundera på om det finns ett annat sätt att tolka situationen) och situationen (ta en paus, be om tid, prata med någon). Det är skillnad på det som hjälper på sikt och det som bara lindrar för stunden. Att scrolla, spela eller dricka alkohol för att slippa känna kan lindra en stund, men känslan och det som väckte den finns kvar.",
  "Mellan en känsla och en handling finns ett utrymme. Känslan kommer ofta snabbt och av sig själv, men vad du gör är ett val, även om det kan kännas svårt när känslan är stark. Du kan vara arg och ändå välja att gå därifrån i stället för att skrika. Att göra utrymmet större är en färdighet som går att öva på. Att förklara varför man gjorde något är inte detsamma som att rättfärdiga det.",
  "Självinsikt är att kunna iaktta sina mönster, värderingar och behov utan att döma sig själv hårt. Ett mönster kan vara att du alltid drar dig undan när du blir kritiserad. Värderingar är det du tycker är viktigt, som ärlighet eller frihet. Behov är det du behöver för att må bra, till exempel sömn, rörelse, att bli lyssnad på, att få bestämma själv eller att känna sammanhang. När du känner till det kan du fatta bättre beslut om studier, relationer och framtid.",
  "Goda relationer bygger på ömsesidighet: båda lyssnar, båda tar hänsyn och båda kan säga vad de behöver. Empati är att kunna förstå hur någon annan har det, utan att behöva hålla med eller acceptera allt och utan att ta över deras känslor eller problem. Ditt ansvar är att lyssna, säga vad du själv behöver och vara respektfull, och den andres ansvar är sina egna känslor och val. Det hjälper att tala utifrån sig själv: ”Jag blir stressad när planerna ändras, och jag behöver få veta i god tid.” Konflikter hör till relationer, och de går att hantera genom att lyssna och söka en lösning.",
  "En gräns är en linje för vad som är okej för dig, till exempel kring kropp, tid, pengar, känslor och det du delar på nätet. Samtycke betyder att man har sagt ja fritt, tydligt och utan tryck, och man får alltid ändra sig. Självrespekt är att ta dina egna behov och värderingar på allvar. Det betyder att du kan säga nej, förhandla och stå för det du tycker, i nära relationer, i skolan och på jobbet. Kärlek handlar inte om att förlora sig själv.",
  "Att ta ansvar är att stå för vad du gjorde och vad det ledde till, och att göra något åt det där det går. Det innebär att erkänna sin del, be om ursäkt på ett sätt som lagar och förändra hur du gör nästa gång. Det går att ta ansvar utan att tycka att man är en dålig människa: ansvar handlar om vad du gjorde, inte om vem du är.",
  "Ett inlärt beteendemönster är ett sätt att reagera som du har övat på så länge att det går av sig självt, till exempel att alltid bli tyst, skämta bort det eller svara skarpt. Mönster byggs genom upprepning, erfarenheter och belöning: det som ger snabb lättnad gör man oftare. De går att förändra genom att uppmärksamma dem, pröva något nytt och upprepa det, och det går lättare med stöd. Det tar ofta veckor till månader, och det är normalt att det ibland blir som förut. Att gå från reaktion till medvetet val är en process som pågår hela livet."

    <p>Human Basics ska ge barn och ungdomar kunskap och praktiska verktyg för att förstå sina känslor, känna igen kroppens signaler, hantera stress, uttrycka sina behov, bygga hälsosamma relationer och ta ansvar för sina handlingar.</p>
    <p>Målet är inte att barn alltid ska vara lugna, glada eller perfekta. Målet är att de ska förstå sig själva och få verktyg att möta livets utmaningar på ett tryggare, mer medvetet och mer respektfullt sätt.</p>

    <h2 style="margin-top:2.4rem">Vem är det till för?</h2>
    <p>Pedagoger och skolpersonal är de som använder plattformen. Barn och unga är de som undervisningen riktar sig till.</p>
    <ul class="audience"><li>Förskolepedagoger</li><li>Lärare i förskoleklass</li><li>Lärare i grundskolan</li><li>Gymnasielärare</li><li>Skolledare</li><li>Elevhälsopersonal och sakkunniga som granskar materialet</li></ul>
    <p>Läraren har en tydlig pedagogvy och en separat presentationsvy för eleverna. Elever skapar inga egna konton.</p>

  const brow = {glad:"M62 78q14-9 28 0M110 78q14-9 28 0", ledsen:"M62 84l28-11M138 84l-28-11", arg:"M62 72l28 11M138 72l-28 11", radd:"M62 80q14-16 28-4M138 80q-14-16-28-4", besviken:"M62 82l28-6M138 82l-28-6", stolt:"M62 76q14-8 28 0M110 76q14-8 28 0"}[k];
  const st = `fill="none" stroke="#25332c" stroke-width="7" stroke-linecap="round"`;
  const mouth = {
    glad:`<path d="M66 128q34 34 68 0" ${st}/>`, ledsen:`<path d="M72 146q28-26 56 0" ${st}/>`, arg:`<path d="M72 138h56" ${st}/>`,
    radd:`<ellipse cx="100" cy="140" rx="10" ry="13" fill="#25332c"/>`, besviken:`<path d="M76 142q24-12 48 0" ${st}/>`, stolt:`<path d="M68 128q32 28 64 0" ${st}/>`
  }[k];
  const er = k==="radd" ? 15 : 12;
  return `<svg viewBox="0 0 200 200" aria-hidden="true" focusable="false"><circle cx="100" cy="100" r="90" fill="${FARG[k]}"/><ellipse cx="68" cy="52" rx="36" ry="20" fill="#fff" opacity=".22"/><circle cx="76" cy="106" r="${er}" fill="#FDFBF7"/><circle cx="124" cy="106" r="${er}" fill="#FDFBF7"/><circle cx="76" cy="108" r="5.500" fill="#25332c"/><circle cx="124" cy="108" r="5.500" fill="#25332c"/><path d="${brow}" fill="none" stroke="#25332c" stroke-width="6" stroke-linecap="round"/>${mouth}</svg>`;
}
const faceCard = k => `<div class="fcard">${face(k)}<b>${NAMN[k]}</b></div>`;
const faceSlide = (k, text) => `<div class="slide"><div class="face-slide"><div class="fbig">${face(k)}</div><div><h2 class="giant">${NAMN[k]}</h2><p>${text}</p></div></div></div>`;
const nsteps = a => `<ol class="nsteps">${a.map(t=>`<li>${t}</li>`).join("")}</ol>`;
